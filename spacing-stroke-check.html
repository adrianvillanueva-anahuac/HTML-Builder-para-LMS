<!doctype html><html lang="es"><meta charset="utf-8"><title>Separación y bordes</title><body style="font:14px Arial;margin:12px"><h1>Separaciones y bordes: Builder / LMS</h1><button id="run" disabled>Verificar cambios</button><pre id="results">Cargando…</pre><iframe id="editor" src="/" style="width:1300px;height:650px;border:1px solid #ddd"></iframe><iframe id="published" style="width:850px;height:650px;border:1px solid #ddd"></iframe>
<script type="module">
import {getCajaTextoHTML,getParrafoBasicoHTML} from '/src/templates.ts';
import {createModular,activateAllCells} from '/src/modular-model.ts';
const editor=document.querySelector('#editor'),published=document.querySelector('#published'),run=document.querySelector('#run'),results=document.querySelector('#results');
const wait=ms=>new Promise(r=>setTimeout(r,ms));editor.onload=()=>run.disabled=false;
run.onclick=async()=>{results.textContent='';const check=(ok,label)=>{if(!ok)throw Error(label);results.textContent+='✓ '+label+'\n';};try{
const w=editor.contentWindow,d=editor.contentDocument;
[...d.querySelectorAll('button')].find(b=>b.textContent==='Nuevo proyecto'&&!b.closest('#project-file-menu')).click();await wait(200);
const canvas=d.querySelector('#canvas');canvas.innerHTML=getParrafoBasicoHTML()+getParrafoBasicoHTML()+getCajaTextoHTML()+'<section class="lms-element is-rendered modular-table" data-type="tabla_modular"></section>';
const table=canvas.querySelector('.modular-table'),model=createModular(2,2);model.margin=3;activateAllCells(model);table.dataset.modular=JSON.stringify(model);w.initNestedDropzones();await wait(200);
const a=canvas.children[0],b=canvas.children[1];
check(Math.abs(b.getBoundingClientRect().top-a.getBoundingClientRect().bottom-20)<0.1,'Separación inicial exacta: 10 + 10 = 20 px');
const box=canvas.querySelector('[data-type=caja_texto]');check(box.querySelector(':scope > .lms-dropzone > [data-type=titulo_basico] h3')&&box.querySelector(':scope > .lms-dropzone > [data-type=parrafo_basico]'),'Título y párrafo de caja son elementos independientes');
const r=a.getBoundingClientRect();canvas.dispatchEvent(new w.PointerEvent('pointermove',{bubbles:true,clientX:r.left+40,clientY:r.bottom+10}));await wait(30);
const handles=d.querySelector('#element-spacing-handles');check(!handles.hidden&&handles.querySelectorAll('button').length===3,'Tres marcadores aparecen en el espacio entre elementos');
const page=canvas.getBoundingClientRect(),handleLeft=parseFloat(handles.style.left);check(handleLeft>=page.right||handleLeft+52<=page.left,'Marcadores fuera del margen de la página');
d.dispatchEvent(new w.PointerEvent('pointermove',{bubbles:true,clientX:page.right+4,clientY:r.bottom+10}));check(!handles.hidden,'Controles permanecen visibles al cruzar hacia el lateral');
const center=handles.querySelector('[data-spacing-handle=center]');for(let i=0;i<5;i++)center.dispatchEvent(new w.KeyboardEvent('keydown',{bubbles:true,key:'ArrowDown'}));
check(a.dataset.spaceBottom==='15'&&b.dataset.spaceTop==='15','Marcador central modifica ambas separaciones');
const upper=handles.querySelector('[data-spacing-handle=upper]');upper.dispatchEvent(new w.KeyboardEvent('keydown',{bubbles:true,key:'ArrowUp'}));check(a.dataset.spaceBottom==='16'&&b.dataset.spaceTop==='15','Marcador superior modifica solo su lado');
const lower=handles.querySelector('[data-spacing-handle=lower]');for(let i=0;i<60;i++)lower.dispatchEvent(new w.KeyboardEvent('keydown',{bubbles:true,key:'ArrowDown'}));check(b.dataset.spaceTop==='30','Límite máximo de 30 px');for(let i=0;i<60;i++)lower.dispatchEvent(new w.KeyboardEvent('keydown',{bubbles:true,key:'ArrowUp'}));check(b.dataset.spaceTop==='0','Límite mínimo de 0 px');
const choose=(scope,key,color)=>table.querySelector(`[data-stroke-scope="${scope}"][data-stroke-key="${key}"][data-stroke-color="${color}"]`).click();
choose('row','0','#ff5900');choose('column','1','#646464');choose('cell','0:0','#5d428c');
const saved=JSON.parse(table.dataset.modular);check(saved.cells['0:0'].strokeColor==='#5d428c'&&saved.cells['0:1'].strokeColor==='#646464'&&saved.cells['1:1'].strokeColor==='#646464'&&!saved.cells['1:0'].strokeColor,'Bordes individuales, por fila y por columna independientes');
const shell=table.querySelector('.mod-shell'),scroll=table.querySelector('.mod-scroll'),css=w.getComputedStyle(shell);check(css.paddingTop===css.paddingLeft&&css.paddingBottom===css.paddingRight&&w.getComputedStyle(scroll).padding==='0px','Márgenes modulares iguales en cuatro lados, sin espacio extra de controles');
check(w.getComputedStyle(table.querySelector('.mod-cell-tools')).position==='fixed'&&w.getComputedStyle(table.querySelector('.mod-column-tools')).position==='fixed','Controles de tabla fuera del flujo del contenido');
const expected=b.getBoundingClientRect().top-a.getBoundingClientRect().bottom;const loaded=new Promise(r=>published.onload=r);published.srcdoc=w.generateExportHTML(false);await loaded;await published.contentDocument.fonts.ready;await wait(300);
const out=published.contentDocument,ea=out.querySelector('#canvas').children[0],eb=out.querySelector('#canvas').children[1];check(Math.abs(eb.getBoundingClientRect().top-ea.getBoundingClientRect().bottom-expected)<0.1,'Exportación conserva exactamente la separación del builder');
check(out.querySelector('.mod-cell[data-cell="0:0"] .mod-card').style.boxShadow.includes('93, 66, 140'),'Color de borde individual conservado al exportar');
check(!out.querySelector('#element-spacing-handles,.mod-editor,.block-toolbar'),'Exportación sin controles del editor');
const finalRect=a.getBoundingClientRect();canvas.dispatchEvent(new w.PointerEvent('pointermove',{bubbles:true,clientX:finalRect.left+40,clientY:finalRect.bottom+8}));
table.scrollIntoView({block:'center'});
const selected=table.querySelector('.mod-cell');selected.classList.add('mod-cell-selected');
selected.dispatchEvent(new w.PointerEvent('pointerover',{bubbles:true}));await wait(250);
const main=table.querySelector(':scope > .block-toolbar > .mod-tools'),secondary=selected.querySelector('.mod-cell-tools');
check(Math.abs(secondary.getBoundingClientRect().top-main.getBoundingClientRect().top)<1,'Menú secundario alineado a la altura del principal');
check(main.getBoundingClientRect().bottom<=table.getBoundingClientRect().top&&secondary.getBoundingClientRect().bottom<=table.getBoundingClientRect().top,'Ambos menús están sobre el borde superior del elemento');
check(w.getComputedStyle(scroll).overflowY==='visible','Tabla sin barra de desplazamiento vertical interna ni recorte');
const overlaps=(a,b)=>a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top;
check(!overlaps(main.getBoundingClientRect(),secondary.getBoundingClientRect()),'Barra secundaria no tapa el menú principal');
main.parentElement.style.opacity='1';main.parentElement.style.pointerEvents='auto';
check([...secondary.querySelectorAll(':scope > button,:scope > details > summary')].every(control=>{const r=control.getBoundingClientRect();return control.contains(d.elementFromPoint(r.left+r.width/2,r.top+r.height/2));}),'Todas las opciones secundarias reciben el cursor sin capas invisibles');
const detail=secondary.querySelector('details');detail.open=true;await wait(100);
const popup=detail.querySelector(':scope > div').getBoundingClientRect();
check(!overlaps(popup,secondary.getBoundingClientRect())&&!overlaps(popup,main.getBoundingClientRect()),'Submenú accesible sin cubrir las barras de herramientas');
selected.classList.remove('mod-cell-selected');delete table.dataset.pinnedCell;detail.open=false;
const summary=detail.querySelector('summary'),option=detail.querySelector('div button');
summary.dispatchEvent(new w.PointerEvent('pointerover',{bubbles:true}));
summary.dispatchEvent(new w.PointerEvent('pointerout',{bubbles:true,relatedTarget:d.body}));
await wait(220);
check(detail.open&&w.getComputedStyle(secondary).display!=='none','Rollover visible durante el recorrido sin fijarlo');
option.dispatchEvent(new w.PointerEvent('pointerover',{bubbles:true,relatedTarget:d.body}));
await wait(300);
check(detail.open&&!detail.dataset.menuPinned,'Llegar a las opciones cancela el cierre sin clic previo');
option.click();
check(JSON.parse(table.dataset.modular).cells['0:0'].color,'Se puede seleccionar una opción del rollover');
option.dispatchEvent(new w.PointerEvent('pointerout',{bubbles:true,relatedTarget:d.body}));
await wait(500);
check(!detail.open,'El menú no fijado se cierra al abandonar las opciones');
table.querySelectorAll('.mod-cell-selected,.mod-cell-hover-active').forEach(el=>el.classList.remove('mod-cell-selected','mod-cell-hover-active'));delete table.dataset.pinnedCell;
const lowerCell=table.querySelector('[data-cell="1:1"]');lowerCell.classList.add('mod-cell-selected');
lowerCell.dispatchEvent(new w.PointerEvent('pointerover',{bubbles:true}));await wait(300);
const lowerTools=lowerCell.querySelector('.mod-cell-tools');
check(Math.abs(lowerTools.getBoundingClientRect().bottom-lowerCell.getBoundingClientRect().top+6)<1,'Menú inferior situado sobre su propio rectángulo');
check(main.parentElement.style.translate.split(' ').every(v=>parseFloat(v)===0),'Menú principal inmóvil para las filas inferiores');
check([...lowerTools.querySelectorAll(':scope > button,:scope > details > summary')].every(control=>{const r=control.getBoundingClientRect();return control.contains(d.elementFromPoint(r.left+r.width/2,r.top+r.height/2));}),'Todas las opciones de la fila inferior son accesibles');
results.textContent+='Todas las comprobaciones correctas';
}catch(error){results.textContent+='ERROR: '+error.message;}};
</script></body></html>
