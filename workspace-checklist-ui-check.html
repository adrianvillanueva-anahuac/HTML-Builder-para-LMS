<!doctype html><html lang="es"><meta charset="utf-8"><title>Indicadores de checklist</title><style>body{margin:0;font:13px Arial}#controls{padding:8px;background:#eee}pre{max-height:110px;overflow:auto;white-space:pre-wrap;margin:6px}iframe{width:100%;height:calc(100vh - 36px);border:0}</style>
<div id="controls"><button id="run">Verificar pestañas y checklist</button> <button id="proof">Mostrar Info. pestaña</button> <button id="tabs">Mostrar estados de pestañas</button></div><pre id="result"></pre><iframe id="app" src="/"></iframe>
<script type="module">
import {getEmbedHTML} from '/src/templates.ts';
const frame=document.querySelector('#app'),out=document.querySelector('#result'),wait=(ms=450)=>new Promise(r=>setTimeout(r,ms)),env=()=>({w:frame.contentWindow,d:frame.contentWindow.document});let results=[],saved='';
const check=(name,ok)=>{results.push((ok?'PASS ':'FAIL ')+name);out.textContent=results.join('\n');if(!ok)throw Error(name);};
const tab=(i=0)=>env().d.querySelectorAll('.project-tabs [role=tab]')[i],dot=(i=0)=>tab(i).querySelector('.project-tab-checklist-dot');
const modal=()=>env().d.querySelector('.workspace-settings');
async function info(i=0){const {w}=env();tab(i).dispatchEvent(new w.KeyboardEvent('keydown',{key:'F2',bubbles:true}));await wait();return modal();}
async function accept(){modal().querySelector('button[value=ok]').click();await wait();}
const green=element=>env().w.getComputedStyle(element).backgroundColor==='rgb(24, 128, 56)';
function addTask(dialog,text,done){const {w}=env();dialog.querySelector('[data-add-task]').click();const row=dialog.querySelector('.workspace-task:last-child');row.querySelector('input[type=text]').value=text;row.querySelector('input[type=checkbox]').checked=done;row.querySelector('input[type=checkbox]').dispatchEvent(new w.Event('change',{bubbles:true}));}
async function addPage(name){const {d}=env();d.querySelector('.project-tab-add').click();await wait();const prompt=d.querySelector('.project-prompt');prompt.querySelector('input').value=name;prompt.querySelector('[value=ok]').click();await wait();}
function fillMedia(){const {w,d}=env(),media=d.querySelector('#canvas [data-type=embed_youtube]');media.querySelector('.embed-input').value='<iframe src="http://127.0.0.1:3000/media-checklist-resource.html" srcdoc="<p>Recurso completo</p>"></iframe>';w.processEmbed(media.querySelector('.embed-input'),'embed_youtube');}
document.querySelector('#run').onclick=async()=>{results=[];out.textContent='Preparando…';try{
 const {w,d}=env();for(let i=0;i<40&&typeof w.insertTemplate!=='function';i++)await wait(100);d.querySelector('.project-welcome .welcome-actions button').click();await wait();w.insertTemplate('bienvenida');await wait();check('Sin tareas no hay círculo de estado',!dot());
 const holder=d.createElement('template');holder.innerHTML=getEmbedHTML('embed_youtube');const page=d.querySelector('#canvas .lms-dropzone.bg-white');page.insertBefore(holder.content.firstElementChild,page.querySelector('.lms-footer-wrapper'));w.initNestedDropzones();await wait();
 check('Medio vacío crea círculo amarillo',dot()?.dataset.state==='pending'&&w.getComputedStyle(dot()).backgroundColor==='rgb(251, 188, 4)');check('Descripción accesible anuncia pendientes',tab().getAttribute('aria-description').includes('Checklist con pendientes'));
 let dialog=await info(),title=dialog.querySelector('h2').getBoundingClientRect(),color=dialog.querySelector('.workspace-color-trigger').getBoundingClientRect(),name=dialog.querySelector('[name=page-name]').getBoundingClientRect();
 check('Selector de color arriba a la derecha del título',color.left>title.right&&Math.abs(color.top+color.height/2-title.top-title.height/2)<1&&color.bottom<name.top);
 dialog.querySelector('.workspace-color-trigger').click();await wait(100);const palette=dialog.querySelector('.workspace-colors').getBoundingClientRect(),bounds=dialog.getBoundingClientRect();check('Paleta se despliega dentro del diálogo',palette.left>=bounds.left&&palette.right<=bounds.right&&palette.width>200);
 dialog.querySelector('.workspace-color[data-color="#5d428c"]').click();check('Elegir color conserva el menú existente',dialog.querySelector('.workspace-color-trigger').getAttribute('aria-expanded')==='false');addTask(dialog,'Revisar referencias',false);await accept();
 check('Color de pestaña y estado coexisten',tab().parentElement.style.getPropertyValue('--tab-color')==='#5d428c'&&dot().dataset.state==='pending');fillMedia();await wait();
 dialog=await info();let automatic=dialog.querySelector('.workspace-task[data-automatic=true]');check('Contenido insertado completa el pendiente automático',automatic.dataset.done==='true'&&automatic.querySelector('input[type=checkbox]').checked);check('Casilla automática permanece deshabilitada pero verde',automatic.querySelector('input[type=checkbox]').disabled&&green(automatic.querySelector('input[type=checkbox]'))&&w.getComputedStyle(automatic.querySelector('input[type=checkbox]')).appearance==='none');
 check('Completar solo el medio no pone toda la lista verde',dot().dataset.state==='pending');dialog.querySelector('.workspace-task:not([data-automatic]) input[type=checkbox]').click();await accept();
 check('Lista completa cambia el círculo a verde',dot()?.dataset.state==='complete'&&green(dot()));check('Descripción accesible anuncia lista completa',tab().getAttribute('aria-description').includes('Checklist completo'));
 tab().focus();tab().dispatchEvent(new w.FocusEvent('focusin',{bubbles:true}));await wait(150);const tooltip=d.querySelector('.project-tab-info');check('En rollover las casillas automática y manual se ven verdes',tooltip&&Array.from(tooltip.querySelectorAll('.project-tab-info-task input')).length===2&&Array.from(tooltip.querySelectorAll('.project-tab-info-task input')).every(green));
 dialog=await info();const boxes=dialog.querySelectorAll('.workspace-task input[type=checkbox]');check('En Info. pestaña manual y automático comparten el verde',Array.from(boxes).every(green));dialog.querySelector('[value=cancel]').click();await wait();
 const media=d.querySelector('#canvas [data-type=embed_youtube]');media.querySelector('.embed-result').innerHTML='';media.querySelector('.embed-result').classList.add('hidden');await wait();check('Quitar el contenido vuelve a amarillo',dot()?.dataset.state==='pending');
 await addPage('Página completa');dialog=await info(1);addTask(dialog,'Contenido revisado',true);await accept();check('Una lista manual completa muestra verde',dot(1)?.dataset.state==='complete'&&green(dot(1)));
 await addPage('Sin checklist');check('Pestaña sin checklist sigue sin indicador',!dot(2));check('Estados independientes en las tres pestañas',dot(0)?.dataset.state==='pending'&&dot(1)?.dataset.state==='complete'&&!dot(2));
 tab(0).click();await wait();dialog=await info();dialog.querySelector('.workspace-task:not([data-automatic]) input[type=checkbox]').click();await accept();check('Reabrir una tarea manual conserva el estado pendiente',dot(0)?.dataset.state==='pending');
 frame.style.width='760px';await wait();dialog=await info();title=dialog.querySelector('h2').getBoundingClientRect();color=dialog.querySelector('.workspace-color-trigger').getBoundingClientRect();check('Cabecera mantiene alineación en vista estrecha',Math.abs(color.top+color.height/2-title.top-title.height/2)<1&&color.right<dialog.getBoundingClientRect().right);dialog.querySelector('[value=cancel]').click();frame.style.width='100%';await wait();
 w.showSaveFilePicker=async()=>({name:'Checklist.lmsproject',createWritable:async()=>({write:async text=>{saved=text;},close:async()=>{}})});d.querySelector('.project-name').dispatchEvent(new w.MouseEvent('dblclick',{bubbles:true}));await wait();d.querySelector('.project-prompt input').value='Checklist';d.querySelector('.project-prompt [value=ok]').click();await wait();check('Guardar conserva los estados de las tareas',JSON.parse(saved).spaces[0].checklist.some(t=>!t.done)&&JSON.parse(saved).spaces[1].checklist.every(t=>t.done));
 out.textContent=results.join('\n')+'\nTOTAL: '+results.length+' / FAIL: '+results.filter(x=>x.startsWith('FAIL')).length;
 }catch(error){out.textContent+='\nERROR '+error.stack;}};
document.querySelector('#proof').onclick=async()=>{out.hidden=true;const {w,d}=env();if(modal()){modal().querySelector('[value=cancel]').click();await wait();}tab(0).click();await wait();fillMedia();await wait();let dialog=await info();const manual=dialog.querySelector('.workspace-task:not([data-automatic]) input[type=checkbox]');if(manual&&!manual.checked)manual.click();await accept();dialog=await info(1);const pending=dialog.querySelector('.workspace-task input[type=checkbox]');if(pending?.checked)pending.click();await accept();await info(0);};
document.querySelector('#tabs').onclick=async()=>{out.hidden=true;if(modal())await accept();};
</script></html>
