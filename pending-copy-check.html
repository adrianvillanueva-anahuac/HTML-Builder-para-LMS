<!doctype html><html lang="es"><meta charset="utf-8"><title>Copiar a Brightspace con pendientes</title>
<style>body{margin:0;font:13px Arial}#controls{padding:8px;background:#eee}pre{white-space:pre-wrap;margin:8px;max-height:120px;overflow:auto}iframe{width:100%;height:760px;border:0}</style>
<div id="controls"><button id="run">Verificar copia con pendientes</button> <button id="proof">Mostrar aviso</button></div><pre id="result"></pre><iframe id="app" src="/"></iframe>
<script type="module">
import {getEmbedHTML} from '/src/templates.ts';
const frame=document.querySelector('#app'),out=document.querySelector('#result'),wait=(ms=350)=>new Promise(r=>setTimeout(r,ms));
const env=()=>({w:frame.contentWindow,d:frame.contentWindow.document});
let results=[],copied=[],stored='';
const check=(name,ok)=>{results.push((ok?'PASS ':'FAIL ')+name);out.textContent=results.join('\n');if(!ok)throw Error(name);};
const prompt=()=>env().d.querySelector('dialog.project-prompt');
const tab=(i=0)=>env().d.querySelectorAll('.project-tabs [role=tab]')[i];
async function info(){const {w,d}=env();d.querySelector('.project-tab[data-active=true] [role=tab]').dispatchEvent(new w.KeyboardEvent('keydown',{key:'F2',bubbles:true}));await wait();return d.querySelector('dialog.workspace-settings');}
function addTask(settings,text,done=false){settings.querySelector('[data-add-task]').click();const row=settings.querySelector('.workspace-task:last-child');row.querySelector('input[type=text]').value=text;row.querySelector('input[type=checkbox]').checked=done;}
async function save(){const {w,d}=env();w.showSaveFilePicker=async()=>({name:'Prueba pendientes.lmsproject',createWritable:async()=>({write:async text=>{stored=text;},close:async()=>{}})});d.querySelector('.project-name').dispatchEvent(new w.MouseEvent('dblclick',{bubbles:true}));await wait();prompt().querySelector('input').value='Prueba pendientes';prompt().querySelector('button[value=ok]').click();await wait();}
async function copy(){env().d.querySelector('.project-copy').click();await wait();return prompt();}
async function proceed(){prompt().querySelector('button[value=continue]').click();await wait();}
async function setup(){const {w,d}=env();if(!d.querySelector('.project-welcome'))return;d.querySelector('.project-welcome .welcome-actions button').click();await wait();w.insertTemplate('bienvenida');await wait();const holder=d.createElement('template');holder.innerHTML=getEmbedHTML('embed_genially');const page=d.querySelector('#canvas .lms-dropzone.bg-white');page.insertBefore(holder.content.firstElementChild,page.querySelector(':scope > .lms-footer-wrapper'));w.initNestedDropzones();await wait();w.insertTemplate('boton_interactivo');await wait();d.querySelector('dialog.ib-dialog button[value=ok]').click();await wait();const settings=await info();addTask(settings,'Revisar la bibliografía');addTask(settings,'Verificar los objetivos',true);settings.querySelector('button[value=ok]').click();await wait();Object.defineProperty(w.navigator,'clipboard',{configurable:true,value:{writeText:async text=>{copied.push(text);}}});}
document.querySelector('#run').onclick=async()=>{results=[];copied=[];try{
 await setup();const {w,d}=env();let settings=await info();addTask(settings,'Revisar <img src=x onerror=alert(1)> & "citas"');settings.querySelector('button[value=ok]').click();await wait();
 let dialog=await copy(),items=Array.from(dialog.querySelectorAll('.project-prompt-pending li')).map(item=>item.textContent);
 check('Lista pendientes manuales y automáticos antes de copiar',items.length===4&&items.includes('Revisar la bibliografía')&&items.some(item=>item.includes('Genially'))&&items.some(item=>item.includes('poner acción')));
 check('No incluye tareas completadas',!items.includes('Verificar los objetivos'));
 check('Nombre de la pestaña y opciones claras',dialog.querySelector('.project-prompt-description').textContent.includes('Página 1')&&dialog.querySelector('button[value=cancel]').textContent==='Regresar a editar'&&dialog.querySelector('button[value=continue]').textContent==='Continuar con pendientes');
 check('Contenido del checklist se muestra como texto sin ejecutar HTML',items.some(item=>item.includes('<img src=x'))&&!dialog.querySelector('.project-prompt-pending img'));
 check('Abrir el aviso no escribe en el portapapeles',copied.length===0);
 dialog.querySelector('button[value=cancel]').click();await wait();check('Regresar a editar cierra el aviso sin copiar ni abrir guardado',!prompt()&&copied.length===0&&!!d.querySelector('#canvas [data-type=embed_genially]'));
 dialog=await copy();dialog.close();await wait();check('Cerrar sin aceptar tampoco copia',!prompt()&&copied.length===0);
 await copy();await proceed();check('Continuar conserva las opciones de guardar progreso o copiar sin guardar',!!prompt().querySelector('button[value=save]')&&!!prompt().querySelector('button[value=copy]')&&!prompt().querySelector('.project-prompt-pending'));
 prompt().querySelector('button[value=cancel]').click();await wait();check('Cancelar en guardado tampoco copia',copied.length===0&&!prompt());
 await copy();await proceed();prompt().querySelector('button[value=copy]').click();await wait();check('Continuar con pendientes y sin guardar copia el HTML actual',copied.length===1&&copied[0].includes('Nombre del curso')&&!prompt());
 await save();check('Proyecto con pendientes se puede guardar',!!stored&&d.querySelector('.project-save-state').textContent==='Guardado');
 dialog=await copy();check('Incluso guardado avisa si quedan pendientes',!!dialog.querySelector('.project-prompt-pending')&&copied.length===1);await proceed();check('Guardado y confirmado copia sin otro aviso',copied.length===2&&!prompt());
 d.querySelector('#canvas .editable-text').textContent='Curso actualizado';await wait();await copy();await proceed();prompt().querySelector('button[value=save]').click();await wait();check('Guardar progreso y copiar funciona tras confirmar los pendientes',copied.length===3&&stored.includes('Curso actualizado')&&!prompt());
 d.querySelector('.project-tab-add').click();await wait();prompt().querySelector('input').value='Pestaña sin pendientes';prompt().querySelector('button[value=ok]').click();await wait();
 dialog=await copy();check('No advierte por pendientes de otras pestañas',!dialog.querySelector('.project-prompt-pending')&&!!dialog.querySelector('button[value=copy]'));dialog.querySelector('button[value=copy]').click();await wait();check('Pestaña activa sin pendientes puede copiarse',copied.length===4);
 settings=await info();addTask(settings,'Tarea ya realizada',true);settings.querySelector('button[value=ok]').click();await wait();await save();await copy();check('Solo tareas completadas y proyecto guardado: copia directa',copied.length===5&&!prompt());
 tab(0).click();await wait();const media=d.querySelector('#canvas [data-type=embed_genially]');media.querySelector('.embed-input').value='<iframe srcdoc="<p>Recurso completo</p>"></iframe>';w.processEmbed(media.querySelector('.embed-input'),'embed_genially');await wait();
 const button=d.querySelector('#canvas [data-type=boton_interactivo]');button.querySelector('[data-ib-change-action]').click();await wait();d.querySelector('dialog.ib-dialog input[value=link]').click();d.querySelector('dialog.ib-dialog input[type=text]').value='https://www.anahuac.mx/';d.querySelector('dialog.ib-dialog button[value=ok]').click();await wait();
 settings=await info();settings.querySelectorAll('.workspace-task:not([data-automatic=true]) input[type=checkbox]').forEach(input=>input.checked=true);settings.querySelector('button[value=ok]').click();await wait();dialog=await copy();check('Al resolver los pendientes deja de mostrar el aviso',!dialog.querySelector('.project-prompt-pending')&&!!dialog.querySelector('button[value=copy]'));dialog.querySelector('button[value=copy]').click();await wait();check('Copia con todos los pendientes resueltos',copied.length===6);
 settings=await info();for(let i=1;i<=35;i++)addTask(settings,'Pendiente de revisión número '+i);settings.querySelector('button[value=ok]').click();await wait();dialog=await copy();const list=dialog.querySelector('.project-prompt-pending'),bounds=dialog.getBoundingClientRect();check('Lista larga enumera todo y tiene scroll propio',list.children.length===35&&list.scrollHeight>list.clientHeight);check('Ambas acciones siguen dentro de la ventana',Array.from(dialog.querySelectorAll('.exercise-dialog-actions button')).every(button=>{const r=button.getBoundingClientRect();return r.top>=bounds.top&&r.bottom<=bounds.bottom;}));
 dialog.querySelector('button[value=cancel]').click();await wait();check('Cancelar lista larga no altera la última copia',copied.length===6);
 out.textContent=results.join('\n')+'\nTOTAL: '+results.length+' / FAIL: '+results.filter(x=>x.startsWith('FAIL')).length;
}catch(error){out.textContent+='\nERROR '+error.stack;}};
document.querySelector('#proof').onclick=async()=>{await setup();const {d}=env();if(prompt())prompt().querySelector('button[value=cancel]')?.click();let settings=await info();settings.querySelectorAll('.workspace-task:not([data-automatic=true])').forEach((row,index)=>{row.querySelector('input[type=checkbox]').checked=index!==0;});settings.querySelector('button[value=ok]').click();await wait();out.hidden=true;d.querySelector('#scroll-container').scrollTop=0;await copy();};
</script></html>
