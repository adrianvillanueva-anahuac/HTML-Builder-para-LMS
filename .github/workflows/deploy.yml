# Archivo de configuración de GitHub Actions para desplegar a GitHub Pages
name: Deploy static content to Pages

on:
  # Se ejecuta cuando hay push a la rama main o master
  push:
    branches: ['main', 'master']
  # Permite ejecutar este flujo de trabajo manualmente desde la pestaña Actions
  workflow_dispatch:

# Otorga los permisos necesarios a GITHUB_TOKEN para desplegar en Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite desplegar solo concurrentemente
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Subimos la carpeta dist que es donde Vite exporta el proyecto final
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
