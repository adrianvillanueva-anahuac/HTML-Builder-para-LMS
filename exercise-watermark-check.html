<!doctype html><html lang="es"><meta charset="utf-8"><title>Marca de agua de entrega</title>
<style>body{margin:0;font:13px Arial}#controls{padding:8px;background:#eee}pre{white-space:pre-wrap;max-height:110px;overflow:auto;margin:6px}iframe{width:100%;height:calc(100vh - 40px);border:0}iframe[hidden]{display:none}</style>
<div id="controls"><button id="run">Verificar marca de agua</button> <button id="settings">Mostrar configuración</button> <button id="final">Mostrar HTML final</button></div><pre id="result"></pre><iframe id="editor" src="/?editor=exercise"></iframe><iframe id="student" hidden></iframe><iframe id="finalDoc" hidden></iframe>
<script type="module">
import {buildStudentDocument} from '/src/exercise-export.ts';
const editor=document.querySelector('#editor'),finalDoc=document.querySelector('#finalDoc'),out=document.querySelector('#result'),wait=(ms=160)=>new Promise(r=>setTimeout(r,ms));let student=document.querySelector('#student');
const env=()=>({w:editor.contentWindow,d:editor.contentWindow.document}),submission=()=>env().d.querySelector('#canvas [data-type=enviar_ejercicio]');let results=[],files=[],lastFinal='';
const check=(name,ok)=>{results.push((ok?'PASS ':'FAIL ')+name);out.textContent=results.join('\n');if(!ok)throw Error(name);};
const settings=()=>env().d.querySelector('.finish-settings');
async function setup(){const {w,d}=env();for(let i=0;i<40&&typeof w.insertTemplate!=='function';i++)await wait(100);if(submission())return;w.insertTemplate('pagina_ejercicio');await wait();w.insertTemplate('texto_alumno');w.insertTemplate('enviar_ejercicio');await wait();w.checkEmptyState();w.initNestedDropzones();w.saveHistoryState(true);}
async function open(){env().w.configureExercise(submission().querySelector('[title="Configurar entrega"]'));await wait();return settings();}
async function save(){settings().querySelector('[value=save]').click();await wait();}
async function load(frame,html){if(frame===student){const next=document.createElement('iframe');next.id='student';next.hidden=true;frame.replaceWith(next);student=frame=next;}const before=frame.contentDocument;frame.srcdoc=html;for(let i=0;i<100;i++){await wait(50);const d=frame.contentDocument;if(d!==before&&['Ejercicio abierto','Ejercicio finalizado'].includes(d?.querySelector('.exercise-status')?.textContent))return;}throw Error('No terminó de cargar el ejercicio de prueba');}
async function studentFile(){const {w}=env();const doc=new DOMParser().parseFromString(w.generateExportHTML(false),'text/html');doc.querySelectorAll('link[rel=stylesheet]').forEach(node=>node.remove());return buildStudentDocument('<!doctype html>'+doc.documentElement.outerHTML);}
function capture(){const w=student.contentWindow,d=w.document;files=[];w.showSaveFilePicker=async()=>({createWritable:async()=>({write:async text=>files.push(new Blob([text],{type:'text/html'})),close:async()=>{}})});w.URL.createObjectURL=blob=>{files.push(blob);return 'blob:test-watermark';};w.URL.revokeObjectURL=()=>{};d.addEventListener('click',event=>{if(event.target.closest('a[download]'))event.preventDefault();},true);}
async function finalize(){student.hidden=false;await wait();const d=student.contentDocument;d.querySelector('.student-answer').value='Respuesta de prueba para revisión docente.';d.querySelector('.student-name').value='Ana Pérez';d.querySelector('.student-name').dispatchEvent(new student.contentWindow.Event('input',{bubbles:true}));d.querySelector('.exercise-finish').click();Array.from(d.querySelectorAll('dialog button')).find(button=>button.textContent==='Finalizar').click();await wait();lastFinal=await files.at(-1).text();student.hidden=true;return new DOMParser().parseFromString(lastFinal,'text/html');}
document.querySelector('#run').onclick=async()=>{results=[];try{
 await setup();let dialog=await open(),box=dialog.querySelector('[name=reviewWatermark]'),text=dialog.querySelector('[name=reviewWatermarkText]');
 check('Opción desactivada inicialmente y texto predeterminado',!box.checked&&text.disabled&&text.value==='Para revisión');
 box.click();check('Activar muestra el campo editable',!text.disabled&&!text.closest('label').hidden);text.value='No guardar';dialog.querySelector('[value=cancel]').click();await wait();check('Cancelar no modifica la configuración',submission().dataset.reviewWatermark===undefined);
 dialog=await open();dialog.querySelector('[name=reviewWatermark]').click();await save();check('Guardar conserva activación y texto por defecto',submission().dataset.reviewWatermark==='true'&&submission().dataset.reviewWatermarkText==='Para revisión');
 dialog=await open();text=dialog.querySelector('[name=reviewWatermarkText]');check('Reabrir recupera la elección',dialog.querySelector('[name=reviewWatermark]').checked&&text.value==='Para revisión');text.value='Evaluación de la Unidad 4';await save();check('Texto alternativo se guarda',submission().dataset.reviewWatermarkText==='Evaluación de la Unidad 4');
 env().w.undo();await wait();check('Deshacer restaura el texto anterior',submission().dataset.reviewWatermarkText==='Para revisión');env().w.redo();await wait();check('Rehacer recupera el texto personalizado',submission().dataset.reviewWatermarkText==='Evaluación de la Unidad 4');
 const saved=env().d.querySelector('#canvas-container-outer').innerHTML;env().w.restoreState(saved);await wait();dialog=await open();check('Restaurar el ejercicio conserva la marca y el texto',dialog.querySelector('[name=reviewWatermark]').checked&&dialog.querySelector('[name=reviewWatermarkText]').value==='Evaluación de la Unidad 4');await save();
 let html=await studentFile();check('Archivo para el alumno conserva datos de configuración',html.includes('data-review-watermark="true"')&&html.includes('Evaluación de la Unidad 4'));await load(student,html);capture();let d=student.contentDocument;
 check('Ejercicio abierto no muestra marca de revisión',!d.querySelector('.exercise-review-watermark'));d.querySelector('#student-save').click();await wait();let progress=new DOMParser().parseFromString(await files.at(-1).text(),'text/html');check('Guardar progreso no añade marca de revisión',!progress.querySelector('.exercise-review-watermark')&&JSON.parse(progress.querySelector('#exercise-student-state').textContent).finalized===false);
 check('Ejercicio editable y progreso conservan el botón y las indicaciones de entrega',!!d.querySelector('.exercise-finish')&&!!progress.querySelector('.exercise-finish')&&progress.querySelector('.exercise-instructions').textContent.includes('Al terminar'));
 let final=await finalize(),mark=final.querySelector('.exercise-review-watermark');check('HTML final contiene el texto configurado',mark?.textContent==='Evaluación de la Unidad 4');check('Marca arriba a la derecha, dentro del documento',mark.parentElement.matches('.anahuac-builder-export')&&parseFloat(mark.style.top)>=12&&mark.style.right==='16px'&&mark.style.textAlign==='right');check('Entrega mantiene respuestas y bloquea edición',final.querySelector('.student-answer').textContent==='Respuesta de prueba para revisión docente.'&&final.querySelector('.student-answer').disabled&&JSON.parse(final.querySelector('#exercise-student-state').textContent).finalized);
 await load(finalDoc,lastFinal);check('Reabrir el final muestra una sola marca y sigue bloqueado',finalDoc.contentDocument.querySelectorAll('.exercise-review-watermark').length===1&&finalDoc.contentDocument.querySelector('.student-answer').readOnly&&finalDoc.contentDocument.querySelector('#student-save').hidden);
 check('HTML de evidencia elimina el botón y su contenedor',!final.querySelector('.exercise-finish,.finish-button-row')&&!finalDoc.contentDocument.querySelector('.exercise-finish,.finish-button-row'));
 check('La leyenda del HTML final confirma que está bloqueado',finalDoc.contentDocument.querySelector('.exercise-instructions').textContent==='Este documento esta BLOQUEADO, se usará para evidencia para tu profesor');
 finalDoc.hidden=false;const reviewBounds=finalDoc.contentDocument.querySelector('.exercise-review-watermark').getBoundingClientRect(),barBounds=finalDoc.contentDocument.querySelector('.exercise-savebar').getBoundingClientRect();check('La barra fija no tapa la marca de revisión',reviewBounds.top>=barBounds.bottom&&reviewBounds.width>0);finalDoc.hidden=true;
 student.contentDocument.querySelectorAll('dialog').forEach(dialog=>dialog.close());student.contentDocument.querySelector('.exercise-finish').click();await wait();final=new DOMParser().parseFromString(await files.at(-1).text(),'text/html');check('Volver a descargar no duplica la marca',final.querySelectorAll('.exercise-review-watermark').length===1);
 dialog=await open();dialog.querySelector('[name=reviewWatermark]').click();await save();check('Desactivar conserva el texto elegido',submission().dataset.reviewWatermark==='false'&&submission().dataset.reviewWatermarkText==='Evaluación de la Unidad 4');await load(student,await studentFile());capture();final=await finalize();check('Finalizar con la opción desactivada no incluye la marca',!final.querySelector('.exercise-review-watermark'));
 dialog=await open();dialog.querySelector('[name=reviewWatermark]').click();dialog.querySelector('[name=reviewWatermarkText]').value='  ';await save();check('Texto vacío vuelve al predeterminado',submission().dataset.reviewWatermarkText==='Para revisión');await load(student,await studentFile());capture();final=await finalize();check('Marca predeterminada se genera al finalizar',final.querySelector('.exercise-review-watermark').textContent==='Para revisión');await load(finalDoc,lastFinal);
 dialog=await open();const rect=dialog.getBoundingClientRect();check('Configuración y acciones accesibles en la ventana',rect.top>=0&&rect.bottom<=env().w.innerHeight&&dialog.scrollHeight>=dialog.clientHeight);dialog.querySelector('[value=cancel]').click();
 out.textContent=results.join('\n')+'\nTOTAL: '+results.length+' / FAIL: '+results.filter(x=>x.startsWith('FAIL')).length;
}catch(error){out.textContent+='\nERROR '+error.stack;}};
document.querySelector('#settings').onclick=async()=>{await setup();out.hidden=true;editor.hidden=false;finalDoc.hidden=student.hidden=true;const dialog=await open();if(!dialog.querySelector('[name=reviewWatermark]').checked)dialog.querySelector('[name=reviewWatermark]').click();};
document.querySelector('#final').onclick=async()=>{if(!lastFinal)return;out.hidden=true;editor.hidden=student.hidden=true;finalDoc.hidden=false;await load(finalDoc,lastFinal);};
</script></html>
