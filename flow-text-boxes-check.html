<!doctype html><html lang="es"><meta charset="utf-8"><title>Cajas de texto y menús · verificación aislada</title>
<style>body{margin:0;font:13px Arial;color:#253649}header{display:flex;align-items:center;gap:12px;padding:9px;background:#f7f7fb}button{padding:7px 10px}pre{white-space:pre-wrap;max-height:180px;overflow:auto;margin:0;padding:10px}pre:empty{display:none}iframe{width:100%;height:calc(100vh - 48px);border:0}body.results iframe{height:calc(100vh - 248px)}</style>
<header><strong>Prueba aislada · cajas de texto</strong><button id="run">Verificar cajas independientes</button><button id="menus">Verificar menús rollover</button><button id="proof">Mostrar ejemplo editable</button><button id="read">Leer geometría visible</button></header><pre id="result" role="status"></pre><iframe id="app" title="Builder de prueba de cajas" src="/?check=text-boxes"></iframe>
<script type="module">
import{createFlowModel,addFlowNode}from'/src/flow-model.ts';
import{flowNodeTextBox,flowNodeTextArea}from'/src/flow-node-text.ts';
const frame=document.querySelector('#app'),out=document.querySelector('#result'),wait=(ms=100)=>new Promise(r=>setTimeout(r,ms));let results=[],block,node,busy=false;
const env=()=>({w:frame.contentWindow,d:frame.contentDocument});const check=(label,ok)=>{results.push((ok?'PASS ':'FAIL ')+label);out.textContent=results.join('\n');if(!ok)throw Error(label);};
async function ready(){for(let i=0;i<200;i++){const{w,d}=env();if(w?.editFlowDiagram&&d?.querySelector('#canvas')){const create=d.querySelector('.project-welcome .welcome-actions button');if(create){create.click();await wait();}return env();}await wait(50);}throw Error('Builder no disponible');}
const dialog=()=>env().d.querySelector('.flow-design-editor'),edit=()=>dialog()?.querySelector('.fde-rich-edit'),box=()=>dialog()?.querySelector('.fde-rich-box'),tools=()=>env().d.querySelector('#rtf-toolbar');
const done=()=>tools().querySelector('[aria-label="Terminar texto"]').click();
const openText=(id='primary')=>dialog().querySelector(`[data-action=edit-text-box][data-text-box-id="${id}"]`).click();
function type(text){const{w}=env();edit().textContent=text;edit().dispatchEvent(new w.Event('input',{bubbles:true}));}
function rect(){return {x:parseFloat(box().style.left),y:parseFloat(box().style.top),width:parseFloat(box().style.width),height:parseFloat(box().style.height)};}
function drag(handle,dx,dy){const{w}=env(),b=box(),capture=b.setPointerCapture;b.setPointerCapture=()=>{};const target=b.querySelector(`[data-text-handle="${handle}"]`),fire=(el,type,x,y)=>el.dispatchEvent(new w.PointerEvent(type,{bubbles:true,button:0,pointerId:999,clientX:x,clientY:y}));fire(target,'pointerdown',300,300);fire(b,'pointermove',300+dx,300+dy);fire(b,'pointerup',300+dx,300+dy);b.setPointerCapture=capture;}
async function setup(){const{w,d}=await ready();dialog()?.querySelector('[data-action=cancel]')?.click();d.querySelector('[data-flow-discard]')?.click();d.querySelector('#canvas').replaceChildren();w.insertTemplate('pagina_basica');w.insertTemplate('diagrama_flujo');block=d.querySelector('#canvas [data-type=diagrama_flujo]');const m=createFlowModel();node=addFlowNode(m,'terminator');Object.assign(node,{x:200,y:220,width:455,height:235,text:'Inicio / fin'});block.dataset.flowModel=JSON.stringify(m);w.initNestedDropzones();return env();}
async function start(){const{w}=env();w.editFlowDiagram(block);await wait();dialog().querySelector(`[data-flow-node="${node.id}"]`).dispatchEvent(new w.MouseEvent('dblclick',{bubbles:true}));await wait();}
function save(){dialog().querySelector('[data-action=save]').click();return JSON.parse(block.dataset.flowModel);}
function selectAll(){const{w,d}=env(),r=d.createRange();r.selectNodeContents(edit());w.getSelection().removeAllRanges();w.getSelection().addRange(r);w.lastKnownRange=r.cloneRange();edit().focus();}
document.querySelector('#run').onclick=async()=>{if(busy)return;busy=true;results=[];document.body.classList.add('results');try{
 const{w,d}=await setup();await start();
 check('La caja tiene ocho tiradores y un control para moverla',box().querySelectorAll('[data-text-handle]').length===9);
 check('La barra sigue siendo la del Builder con todos sus menús',d.querySelectorAll('#rtf-toolbar').length===1&&tools().closest('dialog')===dialog()&&tools().querySelector('[title="Insertar Imagen Editorial"]'));
 const initial=rect(),font=edit().style.fontSize;drag('se',-65,-45);const resized=rect();check('Arrastrar un tirador cambia ancho y alto sin escalar letra',resized.width<initial.width&&resized.height<initial.height&&edit().style.fontSize===font);
 drag('move',30,25);const moved=rect();check('Arrastrar el asa desplaza solo el texto dentro de la figura',moved.x>resized.x&&moved.y>resized.y&&moved.width===resized.width);
 const parentTransform=dialog().querySelector(`[data-flow-node="${node.id}"]`).getAttribute('transform');drag('move',5000,5000);const atEdge=rect();check('Arrastrar fuera conserva la figura en su posición',dialog().querySelector(`[data-flow-node="${node.id}"]`).getAttribute('transform')===parentTransform&&atEdge.x<moved.x+500);
 type('Texto principal');tools().querySelector('[aria-label="Agregar caja de texto"]').click();await wait();check('Añadir desde la barra crea otra caja y abre su texto',box().dataset.textBoxId!=='primary'&&edit().textContent==='Nuevo texto');
 const extraId=box().dataset.textBoxId;type('Segunda caja');selectAll();tools().querySelector('[title="Negrita"]').click();await wait();check('La caja adicional admite el formato original de selección',/bold|700|<b>/.test(edit().innerHTML));drag('e',25,0);done();
 check('Salir conserva las dos cajas visibles en la misma figura',dialog().querySelector(`[data-flow-node="${node.id}"]`).textContent.includes('Texto principal')&&dialog().querySelector(`[data-flow-node="${node.id}"]`).textContent.includes('Segunda caja'));
 check('El inspector permite volver a editar cada caja por separado',dialog().querySelectorAll('[data-action=edit-text-box]').length===2);
 openText();type('Principal editado');done();openText(extraId);check('Editar la principal no cambia el contenido de la adicional',edit().textContent==='Segunda caja');done();
 let saved=save(),owner=saved.nodes[0],safe=flowNodeTextArea(owner),b=flowNodeTextBox(owner);
 check('Guardar persiste texto principal, caja adicional y geometría',owner.text==='Principal editado'&&owner.textBoxes.length===1&&owner.textBoxes[0].text==='Segunda caja'&&owner.textLayout);
 check('La caja movida permanece dentro del área segura de la cápsula',b.x>=safe.x-.01&&b.y>=safe.y-.01&&b.x+b.width<=safe.x+safe.width+.01&&b.y+b.height<=safe.y+safe.height+.01);
 check('El formato de la caja adicional sobrevive la normalización',owner.textBoxes[0].textRuns.some(r=>r.bold));
 await start();check('Reabrir conserva dimensiones y texto principal',Math.abs(rect().width-b.width)<.01&&edit().textContent==='Principal editado');done();
 const caption=dialog().querySelector(`[data-text-box-id="${extraId}"]`);caption.dispatchEvent(new w.MouseEvent('dblclick',{bubbles:true}));await wait();check('Doble clic sobre una caja adicional abre esa caja y no la principal',box().dataset.textBoxId===extraId&&edit().textContent==='Segunda caja');done();
 dialog().querySelector('[data-action=add-text-box]').click();await wait();const thirdId=box().dataset.textBoxId;type('Tercera caja');drag('move',10,10);done();
 dialog().querySelector('[data-action=undo]').click();check('Deshacer revierte la sesión de edición de una caja sin afectar las otras',dialog().querySelector(`[data-text-box-id="${thirdId}"]`).textContent.includes('Nuevo texto'));
 dialog().querySelector('[data-action=undo]').click();check('Deshacer la inserción retira únicamente la caja nueva',!dialog().querySelector(`[data-text-box-id="${thirdId}"]`)&&dialog().querySelector(`[data-text-box-id="${extraId}"]`));
 dialog().querySelector('[data-action=redo]').click();dialog().querySelector('[data-action=redo]').click();check('Rehacer recupera caja, contenido y posición',dialog().querySelector(`[data-text-box-id="${thirdId}"]`).textContent.includes('Tercera caja'));
 dialog().querySelector(`[data-flow-node="${node.id}"]`).dispatchEvent(new w.MouseEvent('dblclick',{bubbles:true}));done();dialog().querySelector(`[data-action=remove-text-box][data-text-box-id="${thirdId}"]`).click();check('Eliminar una caja conserva las otras y la figura',dialog().querySelectorAll('[data-action=edit-text-box]').length===2&&dialog().querySelector(`[data-flow-node="${node.id}"]`));
 saved=save();const exportDoc=new DOMParser().parseFromString(w.generateExportHTML(false),'text/html'),svg=exportDoc.querySelector('.flow-published svg');check('Publicación incluye todas las cajas, sin controles del editor',svg?.textContent.includes('Principal editado')&&svg?.textContent.includes('Segunda caja')&&!svg?.querySelector('[data-text-handle]'));
 check('La barra principal se restaura una sola vez y queda oculta',d.querySelectorAll('#rtf-toolbar').length===1&&!tools().closest('dialog')&&tools().classList.contains('hidden'));
 out.textContent=results.join('\n')+`\nTOTAL: ${results.length} / FAIL: 0`;
 }catch(e){out.textContent+='\nERROR '+e.stack;}finally{busy=false;}};
document.querySelector('#menus').onclick=async()=>{if(busy)return;busy=true;results=[];out.removeAttribute('data-complete');document.body.classList.add('results');try{
 const{w,d}=await setup(),trigger=key=>block.querySelector(`[data-flow-presentation="${key}"]`),panel=()=>d.querySelector('.flow-block-popover'),hover=el=>el.dispatchEvent(new w.PointerEvent('pointerover',{bubbles:true,pointerType:'mouse'})),leave=el=>el.dispatchEvent(new w.PointerEvent('pointerout',{bubbles:true,pointerType:'mouse',relatedTarget:d.body}));
 // Anchor the test toolbar independently of the Builder's insertion auto-scroll.
 Object.assign(block.querySelector('.block-toolbar').style,{position:'fixed',top:'150px',left:'500px',transform:'none',opacity:'1',visibility:'visible'});await wait();for(const key of ['crop','radius','opacity']){hover(trigger(key));check(`${key}: rollover abre sin botón cerrar`,panel()&&!panel().querySelector('button')&&trigger(key).getAttribute('aria-expanded')==='true');leave(trigger(key));panel().dispatchEvent(new w.PointerEvent('pointerenter'));await wait(450);check(`${key}: permite pasar del botón al panel`,!!panel());panel().dispatchEvent(new w.PointerEvent('pointerleave'));await wait(450);check(`${key}: salir cierra con retardo`,!panel());}
 trigger('crop').click();check('Clic y teclado también abren el menú',panel()&&panel().contains(d.activeElement));d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));check('Escape cierra y devuelve el foco al botón',!panel()&&d.activeElement===trigger('crop'));
 hover(trigger('radius'));hover(trigger('opacity'));check('Pasar a otro menú reemplaza el anterior',d.querySelectorAll('.flow-block-popover').length===1&&panel().textContent.includes('Transparencia'));
 d.body.dispatchEvent(new w.PointerEvent('pointerdown',{bubbles:true}));check('Clic fuera cierra sin botón adicional',!panel());
 hover(trigger('radius'));const input=panel().querySelector('input');input.value='37';input.dispatchEvent(new w.Event('input',{bubbles:true}));input.dispatchEvent(new w.Event('change',{bubbles:true}));check('Los controles siguen aplicando cambios al diagrama',JSON.parse(block.dataset.flowModel).backgroundRadius===37);d.body.dispatchEvent(new w.PointerEvent('pointerdown',{bubbles:true}));
 out.textContent=results.join('\n')+`\nTOTAL: ${results.length} / FAIL: 0`;
 }catch(e){out.textContent+='\nERROR '+e.stack;}finally{busy=false;out.dataset.complete='true';}};
document.querySelector('#proof').onclick=async()=>{await setup();document.body.classList.remove('results');out.textContent='';await start();tools().querySelector('[aria-label="Agregar caja de texto"]').click();type('Segunda caja');done();openText();};
document.querySelector('#read').onclick=()=>{out.textContent=JSON.stringify({box:rect(),font:edit()?.style.fontSize,controls:box()?.querySelectorAll('[data-text-handle]').length,content:edit()?.textContent},null,2);};
</script></html>
