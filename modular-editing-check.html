<!doctype html><html lang="es"><meta charset="utf-8"><title>Texto opcional y edición directa · tabla modular</title>
<style>body{margin:0;font:13px Arial;color:#253649}header{display:flex;gap:10px;align-items:center;padding:8px;background:#f7f7fb}button{padding:7px 10px}pre{white-space:pre-wrap;max-height:160px;overflow:auto;margin:0;padding:8px}pre:empty{display:none}iframe{width:100%;height:calc(100vh - 46px);border:0}body.results iframe{height:calc(100vh - 220px)}</style>
<header><strong>Prueba aislada · sugerencia y edición directa</strong><button id="run">Verificar edición directa</button><button id="proof">Mostrar ejemplo corregido</button></header><pre id="result" role="status"></pre><iframe id="app" title="Builder de prueba" src="/?check=modular-editing"></iframe>
<script type="module">
import{createModular,activateAllCells}from'/src/modular-model.ts';
const frame=document.querySelector('#app'),out=document.querySelector('#result'),wait=(ms=150)=>new Promise(r=>setTimeout(r,ms));let results=[],busy=false;
const env=()=>({w:frame.contentWindow,d:frame.contentDocument}),block=()=>env().d.querySelector('#canvas .modular-table'),cell=()=>block().querySelector('.mod-cell[data-cell="0:0"]'),state=()=>JSON.parse(block().dataset.modular),menu=()=>cell().querySelector('.mod-text-box-menu-panel'),info=()=>cell().querySelector('.mod-overflow-info'),editor=()=>env().d.querySelector('.mod-overflow-editor'),edit=()=>env().w.currentEditableText,tools=()=>env().d.querySelector('#rtf-toolbar');
const check=(name,ok)=>{results.push((ok?'PASS ':'FAIL ')+name);out.textContent=results.join('\n');if(!ok)throw Error(name);};
async function setup(){for(let i=0;i<200;i++){const{w,d}=env();if(w?.initNestedDropzones&&d?.querySelector('#canvas')){d.querySelector('.project-welcome .welcome-actions button')?.click();await wait();d.querySelector('#canvas').replaceChildren();const m=createModular(1,2);m.rows=[180];activateAllCells(m);const section=d.createElement('section');section.className='lms-element is-rendered modular-table';section.dataset.type='tabla_modular';section.dataset.modular=JSON.stringify(m);d.querySelector('#canvas').append(section);w.checkEmptyState?.();w.initNestedDropzones();await wait(350);await d.fonts.ready;w.saveHistoryState(true);return env();}await wait(50);}throw Error('Builder no disponible');}
function dbl(node){node.dispatchEvent(new(env().w.MouseEvent)('dblclick',{bubbles:true}));}
function input(value){edit().textContent=value;edit().dispatchEvent(new(env().w.Event)('input',{bubbles:true}));}
function all(){const{w,d}=env(),r=d.createRange();r.selectNodeContents(edit());w.getSelection().removeAllRanges();w.getSelection().addRange(r);w.lastKnownRange=r.cloneRange();edit().focus();}
async function toggle(checked){const input=menu().querySelector('[data-overflow-enabled]');input.checked=checked;input.dispatchEvent(new(env().w.Event)('change',{bubbles:true}));await wait();}
document.querySelector('#run').onclick=async()=>{if(busy)return;busy=true;results=[];out.removeAttribute('data-complete');document.body.classList.add('results');try{
 const{w,d}=await setup(),suggestion=cell().querySelector('.mod-text');
 check('Un rectángulo nuevo no contiene una caja principal obligatoria',!menu().querySelector('[data-mod-text-action=edit]')&&!cell().textContent.includes('Texto principal')&&state().cells['0:0'].html==='');
 check('El texto inicial es solo una sugerencia visual, no contenido guardado',suggestion.textContent===''&&w.getComputedStyle(suggestion,'::before').content.includes('Escribe tu texto'));
 check('El checkbox de desbordamiento está en Cajas de texto',!!menu().querySelector('input[type=checkbox][data-overflow-enabled]'));
 check('No aparece + info en un rectángulo vacío',w.getComputedStyle(info()).display==='none');
 await toggle(true);check('Activar desbordamiento sin texto tampoco crea + info ficticio',w.getComputedStyle(info()).display==='none'&&state().cells['0:0'].html==='');await toggle(false);
 dbl(suggestion);await wait();check('Un solo doble clic sobre la sugerencia abre toda la edición',edit()===suggestion&&suggestion.isContentEditable&&!tools().classList.contains('hidden')&&cell().querySelectorAll('.mod-text-geometry button').length===9&&tools().querySelector('[title="Insertar Imagen Editorial"]'));
 check('La sugerencia se convierte en una caja ordinaria, sin contenido inventado',menu().querySelector('[data-mod-text-action=edit]').textContent==='Caja de texto 1'&&edit().textContent==='');
 input('Primera caja');all();tools().querySelector('[title="Negrita"]').click();await wait();tools().querySelector('[aria-label="Terminar texto"]').click();
 check('La primera edición guarda texto y formato reales',state().cells['0:0'].html.includes('Primera caja')&&/bold|700|<b>/.test(state().cells['0:0'].html));
 menu().querySelector('[data-mod-text-action=add]').click();await wait();const second=cell().querySelector('.mod-text-box-active').dataset.modTextId;
 check('Agregar otra caja abre su edición directamente y deja solo una sugerencia',second!=='primary'&&edit().textContent===''&&edit().isContentEditable&&!tools().classList.contains('hidden'));
 input('Segunda caja');tools().querySelector('[aria-label="Terminar texto"]').click();await toggle(true);
 check('El menú ofrece checkbox individual para cada caja real',menu().querySelectorAll('[data-overflow-box]').length===2&&[...menu().querySelectorAll('[data-overflow-box]')].every(input=>input.checked&&!input.disabled));
 check('El desbordamiento es individual por rectángulo',state().cells['0:0'].textOverflow.enabled&&!state().cells['0:1'].textOverflow.enabled);
 check('Un solo + info reúne las cajas seleccionadas',w.getComputedStyle(info()).display!=='none'&&info().querySelectorAll('.mod-overflow-text').length===2);
 const infoButton=info().querySelector('summary');infoButton.dispatchEvent(new w.PointerEvent('pointerover',{bubbles:true}));await wait();check('El rollover de diseño ofrece Mostrar previo, sin abrir el contenido',!info().open&&w.getComputedStyle(info().querySelector('.mod-overflow-panel')).display==='none'&&info().querySelector('[aria-label="Mostrar previo"]'));
 check('El menú antiguo ya no existe',!info().querySelector('.mod-overflow-settings,.mod-overflow-options,[data-overflow-edit]'));
 info().querySelector('[data-overflow-preview]').click();await wait();const preview=info().querySelector('.mod-overflow-surface').getBoundingClientRect();check('Mostrar previo abre solo la vista del estudiante',info().open&&!editor()&&!info().querySelector('[contenteditable=true]'));d.body.click();await wait();check('Clic fuera cierra el previo',!info().open);
 dbl(info().querySelector('summary'));await wait();check('Doble clic en + info abre solo apariencia, sin activar texto',!!editor()&&!editor().querySelector('[contenteditable=true]')&&tools().classList.contains('hidden')&&w.getComputedStyle(editor().querySelector('.mod-overflow-editor-bar')).display!=='none');
 const surface=editor().querySelector('.mod-overflow-edit-surface'),initial=surface.getBoundingClientRect();check('El diseño y el previo usan la misma posición y tamaño',Math.abs(initial.left-preview.left)<1&&Math.abs(initial.top-preview.top)<1&&Math.abs(initial.width-preview.width)<1&&Math.abs(initial.height-preview.height)<1);
 check('El fondo está inerte y sus menús quedan ocultos',!!cell().closest('[inert]')&&w.getComputedStyle(cell().querySelector('.mod-cell-tools')).visibility==='hidden');
 const beforeBackground=JSON.stringify(state());dbl(cell().querySelector('.mod-text'));check('Ni siquiera un doble clic en el fondo puede activar su texto',JSON.stringify(state())===beforeBackground&&!cell().querySelector('[contenteditable=true]')&&!editor().querySelector('[contenteditable=true]'));
 editor().querySelector('[data-panel-move]').dispatchEvent(new w.KeyboardEvent('keydown',{key:'z',ctrlKey:true,bubbles:true,cancelable:true}));check('Deshacer en apariencia no modifica la página que está detrás',!!editor()&&JSON.stringify(state())===beforeBackground);
 const r=info().querySelector('summary').getBoundingClientRect();check('El botón + info queda detrás del editor y su capa de enfoque',!info().contains(d.elementFromPoint(r.left+r.width/2,r.top+r.height/2)));
 surface.setPointerCapture=()=>{};const draft=editor().querySelector('[data-overflow-draft]');draft.dispatchEvent(new w.PointerEvent('pointerdown',{bubbles:true,pointerId:70,button:0,clientX:initial.left+30,clientY:initial.top+30}));d.body.dispatchEvent(new w.PointerEvent('pointerup',{bubbles:true,pointerId:70}));await wait(280);check('Soltar fuera antes de la pulsación sostenida cancela el gesto',!surface.hasAttribute('data-dragging'));
 draft.dispatchEvent(new w.PointerEvent('pointerdown',{bubbles:true,pointerId:71,button:0,clientX:initial.left+30,clientY:initial.top+30}));surface.dispatchEvent(new w.PointerEvent('pointermove',{bubbles:true,pointerId:71,clientX:initial.left+70,clientY:initial.top+70}));check('Sin clic sostenido el contenedor no se arrastra',Math.abs(surface.getBoundingClientRect().left-initial.left)<1);await wait(280);surface.dispatchEvent(new w.PointerEvent('pointermove',{bubbles:true,pointerId:71,clientX:initial.left+70,clientY:initial.top+70}));surface.dispatchEvent(new w.PointerEvent('pointerup',{bubbles:true,pointerId:71}));const moved=surface.getBoundingClientRect();check('Clic sostenido sobre el propio texto mueve todo el contenedor',moved.left>initial.left+30&&moved.top>initial.top+30&&JSON.stringify(state())===beforeBackground);
 dbl(draft);await wait();check('Doble clic en el texto activa toda la barra nativa y oculta apariencia',edit()===draft&&edit().isContentEditable&&!tools().classList.contains('hidden')&&tools().querySelector('[aria-label="Agregar hipervínculo"]')&&w.getComputedStyle(editor().querySelector('.mod-overflow-editor-bar')).display==='none');
 draft.dispatchEvent(new w.KeyboardEvent('keydown',{key:'z',ctrlKey:true,shiftKey:true,bubbles:true,cancelable:true}));check('Rehacer dentro del texto no altera el historial de la página',JSON.stringify(state())===beforeBackground&&editor()?.contains(draft));
 input('No guardar');tools().querySelector('[aria-label="Confirmar texto"]').click();await wait();check('Confirmar texto regresa a apariencia sin guardar todavía',!draft.isContentEditable&&tools().classList.contains('hidden')&&w.getComputedStyle(editor().querySelector('.mod-overflow-editor-bar')).display!=='none'&&JSON.stringify(state())===beforeBackground);
 editor().querySelector('[data-panel-cancel]').click();await wait();check('Cancelar descarta texto y posición y restaura la página',!editor()&&!cell().closest('[inert]')&&!d.body.classList.contains('mod-overflow-isolating')&&JSON.stringify(state())===beforeBackground);
 menu().querySelector(`[data-mod-text-action=edit][data-mod-text-id="${second}"]`).click();await wait();check('Editar una caja enviada a + info abre esa caja, sin otro doble clic',edit()?.dataset.overflowDraft===second&&edit().isContentEditable&&!tools().classList.contains('hidden'));
 input('Segunda caja corregida');all();tools().querySelector('[title="Cursiva"]').click();await wait();tools().querySelector('[aria-label="Confirmar texto"]').click();editor().querySelector('[data-panel-move]').dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowRight',shiftKey:true,bubbles:true}));editor().querySelector('[data-panel-accept]').click();await wait();
 check('Aceptar conserva cada caja y su formato independiente',state().cells['0:0'].html.includes('Primera caja')&&JSON.stringify(state().cells['0:0'].textBoxes).includes('Segunda caja corregida')&&/italic|"tag":"(?:i|em)"/.test(JSON.stringify(state().cells['0:0'].textBoxes)));
 check('Aceptar guarda posición y devuelve el diseño normal de página',state().cells['0:0'].textOverflow.panel.x>.5&&!editor()&&!cell().closest('[inert]'));
 const selected=menu().querySelector(`[data-overflow-box="${second}"]`);selected.checked=false;selected.dispatchEvent(new w.Event('change',{bubbles:true}));await wait();check('Desmarcar una caja la devuelve al rectángulo',cell().querySelector(`[data-mod-text-id="${second}"]`).style.display==='flex'&&!selected.checked);
 await toggle(false);check('Desactivar devuelve todo el texto y oculta + info',w.getComputedStyle(info()).display==='none'&&cell().querySelector('.mod-primary-text-frame').style.display==='flex');
 menu().querySelector('[data-mod-text-action=remove][data-mod-text-id=primary]').click();await wait();check('La primera caja puede borrarse completamente, igual que las demás',!state().cells['0:0'].textLayout&&state().cells['0:0'].html===''&&!menu().querySelector('[data-mod-text-action=edit][data-mod-text-id=primary]'));
 menu().querySelector(`[data-mod-text-action=remove][data-mod-text-id="${second}"]`).click();await wait();check('Borrar todas las cajas restaura únicamente la sugerencia',!menu().querySelector('[data-mod-text-action=edit]')&&cell().querySelector('.mod-text').textContent===''&&w.getComputedStyle(info()).display==='none');
 const exported=new DOMParser().parseFromString(w.generateExportHTML(false),'text/html');check('La publicación no incluye sugerencias ni Texto principal',!exported.querySelector('.mod-editor')&&!exported.body.textContent.includes('Texto principal')&&!exported.body.textContent.includes('Escribe tu texto'));
 w.undo();await wait();check('Deshacer recupera la caja eliminada con su contenido',JSON.stringify(state().cells['0:0'].textBoxes).includes('Segunda caja corregida'));
 out.textContent=results.join('\n')+`\nTOTAL: ${results.length} / FAIL: 0`;
 }catch(e){out.textContent+='\nERROR '+e.stack;}finally{busy=false;out.dataset.complete='true';}};
document.querySelector('#proof').onclick=async()=>{await setup();document.body.classList.remove('results');out.textContent='';dbl(cell().querySelector('.mod-text'));await wait();input('Una caja de texto editable');tools().querySelector('[aria-label="Terminar texto"]').click();const details=cell().querySelector('.mod-text-box-menu');details.open=true;cell().classList.add('mod-cell-selected');block().dataset.pinnedCell='0:0';cell().dispatchEvent(new(env().w.PointerEvent)('pointerover',{bubbles:true}));};
</script></html>
