<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificación de editores independientes</title>
<style>*{box-sizing:border-box}body{margin:0;font:13px Arial;color:#374151;background:#f3f4f6}header{height:46px;display:flex;align-items:center;gap:8px;padding:7px 12px;overflow:auto;white-space:nowrap;background:white;border-bottom:1px solid #cdd5dc}header>*{flex-shrink:0}button{padding:6px 10px;border:1px solid #5d428c;border-radius:6px;background:white;color:#5d428c;cursor:pointer}pre{margin:0;max-height:180px;overflow:auto;white-space:pre-wrap;padding:10px;font:12px/1.4 Consolas,monospace}pre:empty{display:none}iframe{display:block;border:0;width:100%;height:calc(100vh - 46px)}iframe[hidden]{display:none}body.results iframe{height:calc(100vh - 226px)}</style>
<header><strong>Prueba aislada</strong><button id="exercise-check">Verificar barra del ejercicio</button><button id="flow-check">Verificar apariencia del diagrama</button><button id="exercise-demo">Ejercicio · ejemplo</button><button id="flow-demo">Diagrama · ejemplo</button></header>
<pre id="result" role="status"></pre><iframe id="exercise" title="Ejercicio de prueba" src="/?editor=exercise&amp;check=layout"></iframe><iframe id="flow" title="Diagrama de prueba" src="/?check=independent-layout" hidden></iframe>
<script type="module">
import{createFlowModel,addFlowNode,addFlowEdge}from'/src/flow-model.ts';
const exercise=document.querySelector('#exercise'),flow=document.querySelector('#flow'),out=document.querySelector('#result'),wait=(ms=80)=>new Promise(r=>setTimeout(r,ms));let results=[],busy=false,flowBlock=null;
const check=(name,ok)=>{results.push(`${ok?'PASS':'FAIL'} ${name}`);out.textContent=results.join('\n');if(!ok)throw Error(name);};
const show=frame=>{exercise.hidden=frame!==exercise;flow.hidden=frame!==flow;};
async function ready(frame){let requested=false;for(let i=0;i<180;i++){const w=frame.contentWindow,d=frame.contentDocument;if(typeof w?.insertTemplate==='function'&&d?.querySelector('#canvas')){if(frame===flow&&!d.querySelector('.project-tab[data-active="true"]')){const button=d.querySelector('.project-welcome .welcome-actions > button');if(button&&!requested){requested=true;button.click();}}else return{w,d};}await wait(60);}throw Error('El editor no terminó de iniciar');}
function model(){const m=createFlowModel();m.title='Decisión y seguimiento';const a=addFlowNode(m,'decision',210,100),b=addFlowNode(m,'document',730,390),c=addFlowNode(m,'terminator',150,520);a.text='Decisión';b.text='Documento';c.text='Inicio / fin';const edge=addFlowEdge(m,a.id,c.id,{fromSide:'bottom',toSide:'top',color:'#ff5900',label:'No',width:7});edge.labels=[{id:'review',text:'Revisar',position:.72}];addFlowEdge(m,a.id,b.id,{fromSide:'right',toSide:'top',label:'Sí'});return m;}
async function openFlow(){const{w,d}=await ready(flow);const existing=d.querySelector('dialog.flow-design-editor');if(existing){existing.querySelector('[data-action="cancel"]').click();existing.querySelector('[data-flow-discard]')?.click();}if(!flowBlock?.isConnected){w.insertTemplate('pagina_basica');w.insertTemplate('diagrama_flujo');flowBlock=d.querySelector('#canvas [data-type="diagrama_flujo"]');flowBlock.dataset.flowModel=JSON.stringify(model());w.initNestedDropzones();}w.editFlowDiagram(flowBlock);await wait();return{w,d,dialog:d.querySelector('dialog.flow-design-editor')};}
const done=()=>out.textContent=results.join('\n')+`\nTOTAL: ${results.length} / FAIL: 0`;
document.querySelector('#exercise-check').onclick=async()=>{if(busy)return;busy=true;results=[];document.body.classList.add('results');show(exercise);exercise.style.width='1120px';try{
 const{w,d}=await ready(exercise);await wait();const sidebar=d.querySelector('[data-tour="sidebar"]'),resizer=sidebar.querySelector('[role="separator"]'),bar=d.querySelector('.exercise-editor-actions'),scroll=d.querySelector('#scroll-container');
 check('La barra comparte el área principal del ejercicio, sin desplazamiento fijo',bar.parentElement===scroll.parentElement&&w.getComputedStyle(bar).position==='relative'&&!bar.style.left);
 if(!d.querySelector('#canvas .lms-element'))w.insertTemplate('pagina_ejercicio');await wait();const content=d.querySelector('#canvas').innerHTML;
 const keyboard=async width=>{const current=Number(resizer.getAttribute('aria-valuenow')),key=width<current?'ArrowLeft':'ArrowRight';for(let n=0;n<Math.abs(width-current)/10;n++)resizer.dispatchEvent(new w.KeyboardEvent('keydown',{bubbles:true,cancelable:true,key}));await wait();};
 const aligned=()=>{const s=sidebar.getBoundingClientRect(),b=bar.getBoundingClientRect();return Math.abs(b.left-s.right)<1&&Math.abs(b.right-w.innerWidth)<1&&Math.abs(b.bottom-w.innerHeight)<1;};
 const usable=()=>Array.from(bar.querySelectorAll('button')).every(button=>{const r=button.getBoundingClientRect(),b=bar.getBoundingClientRect();return r.left>=b.left-1&&r.right<=b.right+1&&r.top>=b.top&&r.bottom<=b.bottom;});
 for(const width of [220,520,340]){await keyboard(width);check(`La barra sigue el lateral de ${width} px`,Number(resizer.getAttribute('aria-valuenow'))===width&&aligned());check(`Acciones visibles sin solapar el lienzo con lateral de ${width} px`,usable()&&scroll.getBoundingClientRect().bottom<=bar.getBoundingClientRect().top+1);}
 const set=resizer.setPointerCapture.bind(resizer),has=resizer.hasPointerCapture.bind(resizer),release=resizer.releasePointerCapture.bind(resizer);let captured=false;resizer.setPointerCapture=()=>{captured=true;};resizer.hasPointerCapture=()=>captured;resizer.releasePointerCapture=()=>{captured=false;};
 const send=(type,x)=>resizer.dispatchEvent(new w.PointerEvent(type,{bubbles:true,cancelable:true,button:0,buttons:type==='pointerup'?0:1,pointerId:12345,clientX:x,clientY:200}));send('pointerdown',340);send('pointermove',440);await wait();check('Arrastre del separador actualiza la barra durante el movimiento',Number(resizer.getAttribute('aria-valuenow'))===440&&aligned());send('pointerup',440);resizer.setPointerCapture=set;resizer.hasPointerCapture=has;resizer.releasePointerCapture=release;
 await keyboard(340);for(const width of [820,640,1120]){exercise.style.width=`${width}px`;await wait();check(`Barra y acciones se adaptan al viewport de ${width} px`,aligned()&&usable()&&scroll.getBoundingClientRect().bottom<=bar.getBoundingClientRect().top+1);}
 check('Redimensionar no modifica el contenido del ejercicio',d.querySelector('#canvas').innerHTML===content);check('Cancelar y Guardar y volver siguen disponibles',Array.from(bar.querySelectorAll('button')).map(b=>b.textContent).join('|')==='Cancelar|Guardar y volver'&&Array.from(bar.querySelectorAll('button')).every(b=>!b.disabled));done();
 }catch(error){out.textContent+='\nERROR '+error.stack;}finally{busy=false;}};
document.querySelector('#flow-check').onclick=async()=>{if(busy)return;busy=true;results=[];document.body.classList.add('results');show(flow);flow.style.width='1280px';try{
 const{w,d,dialog}=await openFlow(),palette=dialog.querySelector('.fde-palette'),inspector=dialog.querySelector('.fde-inspector'),footer=dialog.querySelector('.fde-footer'),viewport=dialog.querySelector('.fde-viewport'),before=flowBlock.dataset.flowModel;
 const background=el=>w.getComputedStyle(el).backgroundColor;
 check('Diagrama abre a pantalla completa sin marco redondeado ni vidrio',dialog.getBoundingClientRect().left===0&&dialog.getBoundingClientRect().top===0&&Math.abs(dialog.getBoundingClientRect().width-w.innerWidth)<1&&Math.abs(dialog.getBoundingClientRect().height-w.innerHeight)<1&&w.getComputedStyle(dialog).borderRadius==='0px'&&w.getComputedStyle(dialog).backdropFilter==='none');
 check('Conserva paleta izquierda e inspector derecho',!!palette&&!!inspector&&palette.querySelectorAll('[data-shape]').length===8&&inspector.getBoundingClientRect().left>viewport.getBoundingClientRect().left);
 check('Cabecera naranja identifica el editor como en ejercicio descargable',background(dialog.querySelector('.fde-header'))==='rgb(255, 89, 0)'&&dialog.querySelector('h2').textContent==='HTML Builder para LMS'&&dialog.querySelector('.fde-heading p').textContent==='Editor de diagrama de flujo');
 check('Acciones inferiores comparten el morado del ejercicio',background(footer)==='rgb(93, 66, 140)'&&footer.querySelector('[data-action="cancel"]')&&footer.querySelector('[data-action="save"]')&&!dialog.querySelector('.fde-header [data-action]'));
 check('Herramientas superiores y ambos paneles tienen fondo sólido',background(dialog.querySelector('.fde-commandbar'))==='rgb(255, 255, 255)'&&background(palette)==='rgb(255, 255, 255)'&&background(inspector)==='rgb(255, 255, 255)');
 for(const width of [1280,1024,760,480,360]){flow.style.width=`${width}px`;await wait();dialog.querySelector('[data-action="fit"]').click();await wait();const p=palette.getBoundingClientRect(),f=footer.getBoundingClientRect(),i=inspector.getBoundingClientRect(),v=viewport.getBoundingClientRect();check(`Paneles y acciones permanecen dentro de ${width} px`,p.width>0&&i.width>0&&i.height>0&&v.width>0&&v.height>0&&Math.abs(f.left-p.right)<1&&Math.abs(f.bottom-w.innerHeight)<1&&f.right<=w.innerWidth+1&&i.right<=w.innerWidth+1);check(`Guardar y Cancelar siguen accesibles a ${width} px`,Array.from(footer.querySelectorAll('button')).every(button=>{const r=button.getBoundingClientRect();return r.left>=f.left&&r.right<=w.innerWidth+1&&r.bottom<=w.innerHeight+1;}));}
 flow.style.width='1280px';await wait();dialog.querySelector('[data-action="fit"]').click();const source=JSON.parse(before),edge=source.edges[0];dialog.querySelector(`[data-select-kind="edge"][data-select-id="${edge.id}"]`).click();check('El nuevo diseño conserva etiquetas escala y edición de conexiones',!!inspector.querySelector('[data-prop="labelScale"]')&&!!inspector.querySelector('[data-action="add-label"]')&&dialog.querySelectorAll('[data-flow-bend]').length>0);
 dialog.querySelector('[data-action="save"]').click();await wait();check('Guardar sin cambios visuales mantiene intacto el diagrama',flowBlock.dataset.flowModel===before&&!d.querySelector('dialog.flow-design-editor'));
 w.editFlowDiagram(flowBlock);await wait();const reopened=d.querySelector('dialog.flow-design-editor');check('Reabrir conserva ambos laterales y la barra inferior',!!reopened.querySelector('.fde-palette')&&!!reopened.querySelector('.fde-inspector')&&!!reopened.querySelector('.fde-footer'));reopened.querySelector('[data-action="cancel"]').click();check('Cancelar sin cambios conserva el bloque y vuelve a la página',!d.querySelector('dialog.flow-design-editor')&&flowBlock.dataset.flowModel===before);done();
 }catch(error){out.textContent+='\nERROR '+error.stack;}finally{busy=false;}};
document.querySelector('#exercise-demo').onclick=async()=>{show(exercise);exercise.style.width='100%';document.body.classList.remove('results');out.textContent='';await ready(exercise);};
document.querySelector('#flow-demo').onclick=async()=>{show(flow);flow.style.width='100%';document.body.classList.remove('results');out.textContent='';await openFlow();};
</script></html>
