<!doctype html><html lang="es"><meta charset="utf-8"><title>Desbordamiento individual · prueba aislada</title>
<style>body{margin:0;font:13px Arial;color:#253649}header{display:flex;gap:10px;align-items:center;padding:8px;background:#f7f7fb}button{padding:7px 10px}pre{white-space:pre-wrap;max-height:180px;overflow:auto;margin:0;padding:8px}pre:empty{display:none}iframe{width:100%;height:calc(100vh - 46px);border:0}body.results iframe{height:calc(100vh - 240px)}</style>
<header><strong>Prueba aislada · + info por rectángulo</strong><button id="run">Verificar desbordamiento</button><button id="proof">Mostrar diseño editable</button></header><pre id="result" role="status"></pre><iframe id="app" title="Builder de prueba" src="/?check=modular-overflow"></iframe>
<script type="module">
import{createModular,activateAllCells}from'/src/modular-model.ts';import{addModularTextBox}from'/src/modular-text-model.ts';import{normalizeModularOverflow}from'/src/modular-overflow-model.ts';
const frame=document.querySelector('#app'),out=document.querySelector('#result'),wait=(ms=120)=>new Promise(r=>setTimeout(r,ms));let results=[],busy=false;
const env=()=>({w:frame.contentWindow,d:frame.contentDocument}),block=()=>env().d.querySelector('#canvas .modular-table'),cell=()=>block().querySelector('.mod-cell[data-cell="0:0"]'),state=()=>JSON.parse(block().dataset.modular),info=()=>cell().querySelector('.mod-overflow-info'),editor=()=>env().d.querySelector('.mod-overflow-editor'),edit=()=>env().w.currentEditableText,tools=()=>env().d.querySelector('#rtf-toolbar');
const check=(name,ok)=>{results.push((ok?'PASS ':'FAIL ')+name);out.textContent=results.join('\n');if(!ok)throw Error(name);};
async function setup(){for(let i=0;i<200;i++){const{w,d}=env();if(w?.initNestedDropzones&&d?.querySelector('#canvas')){d.querySelector('.project-welcome .welcome-actions button')?.click();await wait();d.querySelector('#canvas').replaceChildren();const m=createModular(2,2);m.rows=[160,120];activateAllCells(m);m.cells['0:0'].html='<p>Contenido principal '.repeat(35)+'</p>';const box=addModularTextBox(m.cells['0:0']);box.document={tag:'div',style:{'font-size':'18px'},children:[{tag:'#text',text:'Segunda caja independiente'}]};box.layout={x:.1,y:.68,width:.8,height:.22};m.cells['0:1'].html='<p>Sin cambios</p>';const section=d.createElement('section');section.className='lms-element is-rendered modular-table';section.dataset.type='tabla_modular';section.dataset.modular=JSON.stringify(m);d.querySelector('#canvas').append(section);w.checkEmptyState?.();w.initNestedDropzones();await wait(300);w.saveHistoryState(true);return env();}await wait(50);}throw Error('Builder no disponible');}
function toggle(selector,checked){const{w}=env(),input=cell().querySelector('.mod-text-box-menu-panel').querySelector(selector);input.checked=checked;input.dispatchEvent(new w.Event('change',{bubbles:true}));}
async function openEditor(){info().querySelector('summary').dispatchEvent(new(env().w.MouseEvent)('dblclick',{bubbles:true}));await wait();}
async function startDraft(id='primary'){editor().querySelector(`[data-overflow-draft="${id}"]`).dispatchEvent(new(env().w.MouseEvent)('dblclick',{bubbles:true}));await wait();}
function type(value){edit().textContent=value;edit().dispatchEvent(new(env().w.Event)('input',{bubbles:true}));}
function all(){const{w,d}=env(),r=d.createRange();r.selectNodeContents(edit());w.getSelection().removeAllRanges();w.getSelection().addRange(r);w.lastKnownRange=r.cloneRange();edit().focus();}
function field(name,value){const input=editor().querySelector(`[data-panel-field="${name}"]`);input.value=value;input.dispatchEvent(new(env().w.Event)('input',{bubbles:true}));}
document.querySelector('#run').onclick=async()=>{if(busy)return;busy=true;results=[];out.removeAttribute('data-complete');document.body.classList.add('results');try{
 const{w,d}=await setup();check('No existe el botón global de desbordamiento',!block().querySelector('[data-mod-action=overflow]'));
 check('Una sola entrada + info por rectángulo, sin copias por caja',cell().querySelectorAll('.mod-overflow-info').length===1&&!cell().querySelector('.mod-info,.mod-text-box-info'));
 const card=cell().querySelector('.mod-card'),font=w.getComputedStyle(cell().querySelector('.mod-extra-text')).fontSize,height=card.offsetHeight,top=card.getBoundingClientRect().top;
 check('Desactivado: el rectángulo crece hacia abajo y muestra todo el texto',height>160&&cell().querySelector('.mod-text').scrollHeight<=card.offsetHeight&&state().cells['0:0'].textOverflow.enabled===false);
 await wait(700);check('El crecimiento es estable y no mueve el borde superior',card.offsetHeight===height&&Math.abs(card.getBoundingClientRect().top-top)<1&&w.getComputedStyle(cell().querySelector('.mod-extra-text')).fontSize===font);
 check('Las cajas que crecen no se superponen',cell().querySelector('.mod-extra-text').getBoundingClientRect().top>=cell().querySelector('.mod-text').getBoundingClientRect().bottom);
 check('El menú Cajas de texto lista todas las cajas con casillas',cell().querySelector('.mod-text-box-menu-panel').querySelectorAll('[data-overflow-box]').length===2);
 const connector=block().querySelector('[data-mod-action=connect]');connector.dispatchEvent(new w.PointerEvent('pointerover',{bubbles:true}));await wait();check('Hover sobre el conector no abre su menú',!d.querySelector('.mod-connector-popover'));connector.click();await wait();check('Clic abre el menú del conector',!!d.querySelector('.mod-connector-popover'));connector.dispatchEvent(new w.PointerEvent('pointerout',{bubbles:true,relatedTarget:cell()}));await wait(300);check('El menú de clic permanece abierto al salir del conector',!!d.querySelector('.mod-connector-popover'));connector.click();check('Un segundo clic cierra el menú del conector',!d.querySelector('.mod-connector-popover'));connector.dispatchEvent(new w.PointerEvent('pointerover',{bubbles:true}));check('El menú no reaparece por rollover después de cerrarlo',!d.querySelector('.mod-connector-popover'));
 toggle('[data-overflow-enabled]',true);await wait(200);check('Activar es individual: no cambia el rectángulo contiguo',state().cells['0:0'].textOverflow.enabled&&!state().cells['0:1'].textOverflow.enabled);
 check('Solo las cajas seleccionadas quedan dentro de + info',cell().querySelector('.mod-text').style.display==='none'&&cell().querySelector('.mod-text-box-frame').style.display==='none'&&info().querySelectorAll('.mod-overflow-text').length===2&&Math.abs(card.offsetHeight-160)<=2);
 toggle('[data-overflow-box="text-1"]',false);await wait();check('Desmarcar una caja la devuelve al rectángulo',cell().querySelector('.mod-text-box-frame').style.display==='flex'&&info().querySelectorAll('.mod-overflow-text').length===1);
 toggle('[data-overflow-box="text-1"]',true);await openEditor();check('Doble clic abre un borrador independiente para las cajas elegidas',editor()?.querySelectorAll('[data-overflow-draft]').length===2);
 const before=JSON.stringify(state().cells['0:0']);await startDraft();check('El texto del contenedor usa la barra completa original',edit()?.classList.contains('mod-overflow-draft-text')&&!tools().classList.contains('hidden')&&tools().querySelector('[title="Insertar Imagen Editorial"]')&&tools().querySelector('[aria-label="Agregar hipervínculo"]'));
 check('Desenfoque, opacidad, oscurecimiento y radio usan sliders',editor().querySelectorAll('[data-panel-field][type=range]').length===4&&!editor().querySelector('[type=number]'));
 tools().querySelector('[aria-label="Confirmar texto"]').click();const designMenu=editor().querySelector('.mod-overflow-design-menu');designMenu.dispatchEvent(new w.PointerEvent('pointerenter'));await wait();check('El diseño usa los mismos menús contextuales por icono',editor().querySelector('.mod-overflow-editor-bar.mod-tools')&&designMenu.open&&designMenu.querySelector('summary .material-symbols-outlined'));await startDraft();
 type('Cambio descartado');field('style','thought');field('opacity',35);check('Los cambios de texto y estilo siguen aislados antes de aceptar',JSON.stringify(state().cells['0:0'])===before);
 editor().querySelector('[data-panel-cancel]').click();await wait();check('Cancelar descarta texto y estilo sin modificar el modelo',!editor()&&JSON.stringify(state().cells['0:0'])===before);
 await openEditor();await startDraft();type('Texto aprobado');all();tools().querySelector('[title="Negrita"]').click();await wait();check('Negrita de la barra nativa funciona dentro del borrador',/bold|700|<b>/.test(edit().innerHTML));
 type('Primero\nSegundo');all();Array.from(tools().querySelectorAll('button')).find(button=>button.textContent.trim()==='a.').click();await wait();check('Las siete listas originales conservan todas sus opciones',edit().querySelector('.list-letters')&&Array.from(tools().querySelectorAll('button')).filter(button=>['1.','a.','•','○','▶','+','-'].includes(button.textContent.trim())).length===7);tools().querySelector('[title="Viñetas Moradas"]').click();await wait();check('El menú completo de color de viñetas funciona en el contenedor',edit().querySelector('.list-color-purple'));
 all();tools().querySelector('[aria-label="Agregar hipervínculo"]').click();await wait();check('El diálogo original de enlaces sigue disponible',d.querySelector('.text-link-dialog'));d.querySelector('.text-link-dialog input').value='https://example.com/info';d.querySelector('.text-link-dialog [value=ok]').click();await wait();check('El destino del enlace queda en el borrador correcto',edit().querySelector('a[href="https://example.com/info"]'));
 const range=d.createRange();range.selectNodeContents(edit());range.collapse(false);w.getSelection().removeAllRanges();w.getSelection().addRange(range);w.lastKnownRange=range.cloneRange();edit().focus();tools().querySelector('[title="Insertar Ícono Embebido"]').click();await wait();check('Los iconos embebidos usan su editor nativo',edit().querySelector('.editable-icon'));edit().querySelector('.editable-icon').dispatchEvent(new w.MouseEvent('dblclick',{bubbles:true}));await wait();check('Se conserva el catálogo íntegro de iconos',!d.querySelector('#icon-modal').classList.contains('hidden')&&d.querySelectorAll('#icon-grid span').length>50);Array.from(d.querySelectorAll('#icon-grid span')).find(node=>node.textContent==='school').click();await wait();check('El catálogo edita el icono del borrador',edit().querySelector('.editable-icon').textContent==='school');type('Texto aprobado');all();tools().querySelector('[title="Negrita"]').click();await wait();
 const caret=d.createRange();caret.selectNodeContents(edit());caret.collapse(false);w.getSelection().removeAllRanges();w.getSelection().addRange(caret);w.lastKnownRange=caret.cloneRange();edit().focus();const originalPrompt=w.prompt;w.prompt=()=>location.origin+'/imagenes/titulos/Fondo_naranja_escolar.png';tools().querySelector('[title="Insertar Imagen Editorial"]').click();w.prompt=originalPrompt;await wait();const image=edit().querySelector('.editorial-image');check('Las imágenes editoriales se insertan en el texto aislado',image);image.click();await wait();check('La imagen mantiene su menú nativo sobre el editor aislado',!d.querySelector('#image-toolbar').classList.contains('hidden')&&d.querySelector('#image-toolbar [title="Rotar Imagen"]'));w.setImageSize('w-1/4');w.rotateEditorialImage(90);await wait();check('La escala y rotación nativas funcionan sin editar el fondo',image.classList.contains('w-1/4')&&image.style.transform.includes('90deg')&&JSON.stringify(state().cells['0:0'])===before);image.remove();
 tools().querySelector('[aria-label="Confirmar texto"]').click();field('style','hologram');field('fill','#f3eef9');field('opacity',45);field('blur',6);field('dim',30);field('radius',28);
 const bg=editor().querySelector('.mod-overflow-background'),text=editor().querySelector('[data-overflow-draft]');check('La opacidad solo afecta al fondo, nunca al texto',w.getComputedStyle(bg).opacity==='0.45'&&w.getComputedStyle(text).opacity==='1');
 const move=editor().querySelector('[data-panel-move]'),surface=editor().querySelector('.mod-overflow-edit-surface'),left=surface.getBoundingClientRect().left;move.dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowRight',shiftKey:true,bubbles:true}));check('El contenedor se puede reposicionar con control de geometría',surface.getBoundingClientRect().left>left);
 const width=surface.offsetWidth;editor().querySelector('[data-panel-resize]').dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowRight',shiftKey:true,bubbles:true}));check('Redimensionar no cambia la tipografía',surface.offsetWidth>width&&w.getComputedStyle(text).fontSize);
 editor().querySelector('[data-panel-accept]').click();await wait();check('Aceptar guarda contenido rico y todos los estilos del contenedor',state().cells['0:0'].html.includes('Texto aprobado')&&/bold|700|<b>/.test(state().cells['0:0'].html)&&state().cells['0:0'].textOverflow.panel.style==='hologram'&&state().cells['0:0'].textOverflow.panel.blur===6&&state().cells['0:0'].textOverflow.panel.opacity===.45);
 check('La caja adicional conserva su propio contenido y formato',JSON.stringify(state().cells['0:0'].textBoxes).includes('Segunda caja independiente')&&state().cells['0:0'].textBoxes[0].document.style['font-size']==='18px');
 w.undo();await wait();check('Deshacer revierte la aceptación completa',JSON.stringify(state().cells['0:0'])===before);w.redo();await wait();check('Rehacer recupera texto y apariencia juntos',state().cells['0:0'].html.includes('Texto aprobado')&&state().cells['0:0'].textOverflow.panel.style==='hologram');
 await openEditor();editor().querySelector('[data-panel-reset]').click();check('Restablecer vuelve al diseño regular en el borrador',editor().querySelector('[data-panel-field=style]').value==='normal'&&editor().querySelector('[data-panel-field=opacity]').value==='100');editor().querySelector('[data-panel-cancel]').click();check('Cancelar después de reset no sobrescribe lo guardado',state().cells['0:0'].textOverflow.panel.style==='hologram');
 await openEditor();editor().querySelector('[data-panel-reset]').click();editor().querySelector('[data-panel-accept]').click();await wait();check('Aceptar reset sobrescribe el estilo anterior',state().cells['0:0'].textOverflow.panel.style==='normal'&&state().cells['0:0'].textOverflow.panel.radius===16);
 const summary=info().querySelector('summary');summary.setPointerCapture=()=>{};summary.dispatchEvent(new w.PointerEvent('pointerdown',{bubbles:true,pointerId:52,button:0,clientX:300,clientY:300}));await wait(300);summary.dispatchEvent(new w.PointerEvent('pointermove',{bubbles:true,pointerId:52,clientX:10000,clientY:10000}));summary.dispatchEvent(new w.PointerEvent('pointerup',{bubbles:true,pointerId:52,clientX:10000,clientY:10000}));await wait();const button=info().getBoundingClientRect(),bounds=card.isConnected?card.getBoundingClientRect():cell().querySelector('.mod-card').getBoundingClientRect();check('Arrastre sostenido mantiene + info dentro de su rectángulo',state().cells['0:0'].textOverflow.button.x>.5&&button.right<=bounds.right+1&&button.bottom<=bounds.bottom+1);
 check('El menú de cajas permite agregar y borrar también el texto principal',cell().querySelector('[data-mod-text-action=add]')&&cell().querySelector('[data-mod-text-action=remove][data-mod-text-id=primary]'));
 check('Eliminar está al extremo derecho y los seis puntos al izquierdo',cell().querySelector('.mod-cell-tools').lastElementChild.matches('[data-mod-action=remove]')&&block().querySelector('.block-toolbar .mod-tools').firstElementChild.matches('.drag-handle'));
 const exported=new DOMParser().parseFromString(w.generateExportHTML(false),'text/html'),published=exported.querySelector('.mod-published');check('Publicar conserva una sola entrada por rectángulo y ningún control de edición',published.querySelectorAll('.mod-cell[data-cell="0:0"] .mod-overflow-info').length===1&&!published.querySelector('.mod-editor,[data-panel-accept]'));
 check('HTML publicado conserva contenido seleccionado y fondo transparente independiente',published.querySelector('.mod-overflow-content').textContent.includes('Texto aprobado')&&published.querySelector('.mod-overflow-background').style.opacity==='1'&&published.querySelector('.mod-overflow-surface').style.position==='fixed');
 const publicFrame=d.createElement('iframe');Object.assign(publicFrame.style,{position:'fixed',left:'-2000px',top:'0',width:'430px',height:'350px'});d.body.append(publicFrame);await new Promise(resolve=>{publicFrame.onload=resolve;publicFrame.srcdoc=exported.documentElement.outerHTML;});await wait(300);const pd=publicFrame.contentDocument,pi=pd.querySelector('.mod-overflow-info');pi.querySelector('summary').click();await wait();const pr=pi.querySelector('.mod-overflow-surface').getBoundingClientRect();check('En publicación el contenedor abre completo y dentro de un viewport móvil',pi.open&&pr.left>=0&&pr.top>=0&&pr.right<=publicFrame.clientWidth+1&&pr.bottom<=publicFrame.clientHeight+1);pd.body.click();check('Clic fuera cierra el contenedor publicado',!pi.open);publicFrame.remove();
 const snapshot=state(),section=d.createElement('section');section.className='lms-element is-rendered modular-table';section.dataset.type='tabla_modular';section.dataset.modular=JSON.stringify(snapshot);block().replaceWith(section);w.initNestedDropzones();await wait();check('Restaurar conserva selección, contenido, estilo y posición del botón',JSON.stringify(state().cells['0:0'].textOverflow)===JSON.stringify(snapshot.cells['0:0'].textOverflow)&&state().cells['0:0'].html.includes('Texto aprobado'));
 out.textContent=results.join('\n')+`\nTOTAL: ${results.length} / FAIL: 0`;
 }catch(e){out.textContent+='\nERROR '+e.stack;}finally{busy=false;out.dataset.complete='true';}};
document.querySelector('#proof').onclick=async()=>{document.body.classList.remove('results');out.textContent='';await setup();toggle('[data-overflow-enabled]',true);await openEditor();field('style','dialogue');field('fill','#f3eef9');field('opacity',90);field('blur',4);field('dim',15);await startDraft();type('Doble clic para editar el texto.\nMantén pulsado para colocar el contenedor.');tools().querySelector('[aria-label="Confirmar texto"]').click();};
</script></html>
