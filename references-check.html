<!doctype html><meta charset="utf-8"><button id="run">Probar referencias</button><button id="simulate">Verificar arrastre</button><button id="dragtest">Preparar arrastre</button><pre id="results"></pre><iframe id="app" src="/?editor=exercise" style="width:100%;height:820px"></iframe><script type="module">
simulate.onclick=async()=>{const w=app.contentWindow,d=w.document,list=d.querySelector('.references-list'),first=list.firstElementChild,handle=first.querySelector('.drag-handle'),a=handle.getBoundingClientRect(),b=list.lastElementChild.getBoundingClientRect();const fire=(type,x,y,target)=>target.dispatchEvent(new w.PointerEvent(type,{bubbles:true,cancelable:true,pointerId:1,pointerType:'mouse',isPrimary:true,button:0,buttons:type==='pointerup'?0:1,clientX:x,clientY:y}));fire('pointerdown',a.x+10,a.y+10,handle);for(let i=1;i<=15;i++){const x=a.x+10,y=a.y+10+(b.bottom-a.y-20)*i/15;fire('pointermove',x,y,d.elementFromPoint(x,y)||d);await new Promise(r=>setTimeout(r,40));}fire('pointerup',a.x+10,b.bottom-10,d);await new Promise(r=>setTimeout(r,100));results.style.display='block';results.textContent+='\n'+(list.lastElementChild===first?'PASS':'FAIL')+' Reordenamiento real con eventos de puntero';};
dragtest.onclick=()=>{results.style.display='none';const d=app.contentDocument;d.querySelector('.reference-settings').open=false;const css=d.createElement('style');css.textContent='.references-list>.lms-element>.block-toolbar{opacity:1!important;pointer-events:auto!important}';d.head.append(css);};
run.onclick=async()=>{const w=app.contentWindow,d=w.document,out=document.querySelector('#results');out.textContent='';let n=0;const check=(ok,label)=>{out.textContent+=(ok?'PASS ':'FAIL ')+label+'\n';if(!ok)throw Error(label);n++;};try{
 const canvas=d.querySelector('#canvas');canvas.replaceChildren();w.insertTemplate('referencias_importer');w.initNestedDropzones();let group=canvas.querySelector('.references-importer-container');const paste=(html,plain='')=>{const dt=new w.DataTransfer();dt.setData('text/html',html);dt.setData('text/plain',plain);group.querySelector('textarea').dispatchEvent(new w.ClipboardEvent('paste',{clipboardData:dt,bubbles:true,cancelable:true}));};
 paste('<p><strong>Autor uno.</strong> <em>Título primero.</em> https://example.com/uno</p><p>Autor dos. <span style="font-family:Comic Sans MS;font-style:italic;font-weight:700">Título segundo.</span> https://example.com/dos</p>');
 let list=group.querySelector('.references-list');check(group.querySelector('[data-duplicate-element]').nextElementSibling.matches('.reference-settings'),'Estilo inmediatamente después de duplicar');check(list.children.length===2&&canvas.children.length===1,'Dos referencias dentro de un único elemento');check(list.querySelector('strong').textContent==='Autor uno.'&&list.querySelector('em').textContent==='Título primero.','Negritas y cursivas preservadas');check(!list.innerHTML.includes('Comic Sans'),'Tipografía externa descartada');check(list.querySelector('.editable-icon').style.fontSize==='49px','Iconos reducidos 30%');check(list.dataset.sortableActive==='true','Arrastre inicializado en lista');check(!!list.querySelector('.drag-handle'),'Cada referencia tiene mediador de arrastre');paste('','Autor tres. https://example.com/tres');check(list.children.length===3&&canvas.children.length===1,'Pegados adicionales en mismo contenedor');
 const slider=(label,value)=>{const input=group.querySelector('[aria-label="'+label+'"]');input.value=value;input.dispatchEvent(new w.Event('input',{bubbles:true}));input.dispatchEvent(new w.Event('change',{bubbles:true}));};slider('Separación entre referencias','24');slider('Tamaño del icono','35');w.initNestedDropzones();const distance=()=>list.children[1].getBoundingClientRect().top-list.children[0].getBoundingClientRect().bottom;check(Math.abs(distance()-24)<1,'Separación visible de 24 px después de normalizar');slider('Separación entre referencias','0');w.initNestedDropzones();check(Math.abs(distance())<1,'Separación visible de 0 px');slider('Separación entre referencias','48');w.initNestedDropzones();check(Math.abs(distance()-48)<1,'Separación visible de 48 px');slider('Separación entre referencias','24');check(list.style.gap==='24px'&&list.querySelector('.editable-icon').style.fontSize==='35px','Sliders de separación y tamaño');group.querySelector('[aria-label="Color del icono: Morado"]').click();group.querySelector('[aria-label="Color de Link: Gris oscuro"]').click();check(list.querySelector('.editable-icon').style.color==='rgb(93, 66, 140)'&&list.querySelector('.reference-link').style.color==='rgb(100, 100, 100)','Colores independientes');
 const saved=group.outerHTML;group.outerHTML=saved;w.initNestedDropzones();group=canvas.querySelector('.references-importer-container');list=group.querySelector('.references-list');slider('Tamaño del icono','49');check(list.querySelector('.editable-icon').style.fontSize==='49px','Controles funcionan después de restaurar HTML');check(list.style.gap==='24px'&&group.dataset.referenceLinkColor==='#646464','Preferencias conservadas al restaurar');
 paste('<p><b>Texto seguro</b><img src=x onerror=alert(1)> https://example.com/seguro</p>');check(!list.querySelector('img,script,[onerror]'),'Pegado elimina contenido ejecutable');
 const exported=await w.generateExportHTML(true);const exportedDoc=new DOMParser().parseFromString(exported,'text/html');check(exportedDoc.querySelectorAll('[data-type=referencia_item]').length===4,'Exportación conserva referencias');check(!exportedDoc.querySelector('.references-paste-panel,.reference-settings'),'Exportación sin controles de edición');group.querySelector('.reference-settings').open=true;out.textContent+='TOTAL '+n;
 }catch(e){out.textContent+='ERROR '+e.message;}};
</script>
