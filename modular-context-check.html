<!doctype html><html lang="es"><meta charset="utf-8"><title>Verificación de menús, copia y footer</title>
<style>body{margin:0;font:13px Arial}header{padding:8px;display:flex;gap:8px;background:#f7f7fb;align-items:center}button{padding:7px}pre{white-space:pre-wrap;max-height:160px;overflow:auto;margin:0}pre:empty{display:none}iframe{width:100%;height:calc(100vh - 48px);border:0}body.results iframe{height:calc(100vh - 210px)}</style>
<header><strong>Verificación aislada</strong><button id="run">Verificar anotaciones</button><button id="show">Mostrar ejemplos</button><button id="inspect">Inspeccionar estado</button></header><pre id="result"></pre><iframe id="app" title="Builder de prueba" src="/?check=modular-context"></iframe>
<script type="module">
import{createModular,activateAllCells}from'/src/modular-model.ts';import{createBadge}from'/src/modular-badges-model.ts';import{getCuadroNaranjaHTML,getDynamicFooterHTML}from'/src/templates.ts';
const frame=document.querySelector('#app'),out=document.querySelector('#result'),wait=(ms=160)=>new Promise(r=>setTimeout(r,ms));let results=[];
const env=()=>({w:frame.contentWindow,d:frame.contentDocument}),block=()=>env().d.querySelector('.modular-table'),cell=(key='0:0')=>block().querySelector(`[data-cell="${key}"]`),state=()=>JSON.parse(block().dataset.modular),check=(name,ok)=>{results.push((ok?'PASS ':'FAIL ')+name);out.textContent=results.join('\n');if(!ok)throw Error(name);};
async function setup(){for(let i=0;i<200;i++){const{w,d}=env();if(w?.initNestedDropzones&&d?.querySelector('#canvas')){d.querySelector('.project-welcome .welcome-actions button')?.click();await wait();const canvas=d.querySelector('#canvas');canvas.replaceChildren();const m=createModular(2,3);m.rows=[150,100];activateAllCells(m);Object.values(m.cells).forEach((v,i)=>v.html=`<p>Rectángulo ${i+1}</p>`);m.cells['0:0'].html='<b>Origen con formato</b>';m.cells['0:0'].color='#ff5900';m.cells['0:0'].radius=16;m.cells['0:0'].badge={...createBadge('triangle'),text:'A'};m.cells['0:0'].textLayout={x:.1,y:.2,width:.8,height:.65};m.cells['0:1'].html='<i>Destino conservado</i>';m.cells['0:1'].color='#cdd5dc';const page=d.createElement('div');page.className='relative lms-element is-rendered';page.innerHTML='<div class="lms-dropzone bg-white flex flex-col" style="padding:25px;min-height:620px;border-radius:14px"><div class="lms-element is-rendered" data-check="heading"><h2 class="editable-text" style="font:26px Georgia;color:#ff5900;text-align:center;margin:10px 0 50px">Herramientas de texto y copia</h2></div><section class="relative lms-element is-rendered modular-table" data-type="tabla_modular"></section>'+getCuadroNaranjaHTML()+getDynamicFooterHTML()+'</div>';page.querySelector('.modular-table').dataset.modular=JSON.stringify(m);page.querySelector('[data-type=cuadro_naranja]').style.marginTop='45px';canvas.append(page);w.checkEmptyState?.();w.initNestedDropzones();await wait(400);await d.fonts.ready;w.saveHistoryState(true);return env();}await wait(50);}throw Error('Builder no disponible');}
function pointer(node,type,x=0,y=0){const{w}=env();node.dispatchEvent(new w.PointerEvent(type,{bubbles:true,cancelable:true,pointerId:89,button:0,clientX:x,clientY:y}));}
function dbl(node){node.dispatchEvent(new(env().w.MouseEvent)('dblclick',{bubbles:true}));}
function copy(mode,source='0:0',dest='0:1'){cell(source).querySelector('[data-mod-cell-copy]').click();cell(source).querySelector('.mod-card').click();cell(source).querySelector(`[data-transfer-mode=${mode}]`).click();cell(dest).querySelector('.mod-card').click();}
document.querySelector('#run').onclick=async()=>{results=[];out.removeAttribute('data-complete');document.body.classList.add('results');try{const{w,d}=await setup();
check('Alineación vertical retirada del menú del rectángulo',!block().querySelector('.mod-cell-tools [aria-label="Alineación vertical"]'));check('Copia disponible una vez en cada rectángulo',block().querySelectorAll('[data-mod-cell-copy]').length===6);check('Triángulo disponible y renderizado',!!cell().querySelector('[data-badge-shape=triangle]')&&cell().querySelector('.mod-badge polygon')?.getAttribute('points')==='50,2 98,96 2,96');
const badgeText=cell().querySelector('.mod-badge-text').innerHTML;cell().querySelector('[data-badge-icon]').click();check('Usa el catálogo completo del Builder',!d.querySelector('#icon-modal').classList.contains('hidden')&&d.querySelectorAll('#icon-grid .material-symbols-outlined').length>100);d.querySelector('#icon-modal').classList.add('hidden');await wait();check('Cancelar catálogo conserva el texto anterior',cell().querySelector('.mod-badge-text').innerHTML===badgeText);cell().querySelector('[data-badge-icon]').click();const catalog=d.querySelector('#icon-grid .material-symbols-outlined');catalog.click();await wait();check('Icono centrado se guarda en la figura',state().cells['0:0'].badge.html.includes('editable-icon')&&state().cells['0:0'].badge.text===catalog.textContent);
const dest=structuredClone(state().cells['0:1']);copy('content');check('Modo exclusivo oculta los otros menús',d.body.classList.contains('mod-cell-copy-mode')&&w.getComputedStyle(cell().querySelector('.mod-cell-tools')).display==='none');check('Copiar contenido conserva color y radio del destino',state().cells['0:1'].html.includes('Origen con formato')&&state().cells['0:1'].color===dest.color&&state().cells['0:1'].radius===dest.radius);d.querySelector('[data-transfer-end]').click();
const content=state().cells['0:2'].html;copy('style','0:0','0:2');check('Copiar estilo conserva el texto del destino',state().cells['0:2'].html===content&&state().cells['0:2'].color==='#ff5900'&&state().cells['0:2'].radius===16);d.querySelector('[data-transfer-end]').click();copy('all');check('Copia completa conserva todos los datos',JSON.stringify(state().cells['0:0'])===JSON.stringify(state().cells['0:1']));cell('1:0').querySelector('.mod-card').click();check('Permite aplicar el mismo origen más de una vez',JSON.stringify(state().cells['0:0'])===JSON.stringify(state().cells['1:0']));d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));check('Escape restaura interacción y atributos originales',!d.body.classList.contains('mod-cell-copy-mode')&&!block().querySelector('[data-transfer-source],[role=button].mod-cell'));
const text=cell().querySelector('.mod-text');dbl(text);await wait();const toolbar=d.querySelector('#rtf-toolbar');check('Primer doble clic abre texto con menú y geometría',text.isContentEditable&&!toolbar.classList.contains('hidden')&&cell().querySelectorAll('.mod-text-geometry button').length===9);check('Alineación vertical junto a alineación horizontal',!!toolbar.querySelector('.rtf-vertical-menu')&&toolbar.querySelector('.rtf-vertical-menu').previousElementSibling?.title?.includes('derecha'));toolbar.querySelector('[aria-label="Texto abajo"]').click();await wait();check('Alineación vertical guardada sin cambiar tipografía',state().cells['0:0'].textStyle?.['align-content']==='end'&&text.style.height!==undefined);pointer(toolbar.querySelector('button'),'pointerdown');check('Clic en herramientas no termina el texto',text.isContentEditable);pointer(cell('1:2'),'pointerover');await wait();check('Edición bloquea otros rollovers y mantiene su barra',w.getComputedStyle(cell('1:2').querySelector('.mod-cell-tools')).display==='none'&&!toolbar.classList.contains('hidden'));pointer(d.querySelector('[data-check=heading]'),'pointerdown');await wait();check('Clic fuera, incluso en otro elemento, termina texto y geometría',!text.isContentEditable&&toolbar.classList.contains('hidden')&&!cell().querySelector('.mod-text-geometry')&&!d.body.classList.contains('builder-text-editing'));
const heading=d.querySelector('[data-check=heading] .editable-text');dbl(heading);await wait();pointer(d.body,'pointerdown');await wait();check('Clic exterior funciona también en textos generales',!heading.isContentEditable&&toolbar.classList.contains('hidden'));
const box=d.querySelector('#canvas [data-type=cuadro_naranja]'),surface=box.querySelector(':scope>div:not(.block-toolbar)'),slider=box.querySelector('.box-stroke-width input');box.querySelector('[data-box-transparent]').click();await wait(400);check('Círculo transparente cambia solo el relleno',w.getComputedStyle(surface).backgroundColor==='rgba(0, 0, 0, 0)'&&w.getComputedStyle(surface).opacity==='1');check('Grosor usa slider y paleta institucional completa',slider.type==='range'&&box.querySelectorAll('[data-box-color]').length===5);slider.value='4';slider.dispatchEvent(new w.Event('input',{bubbles:true}));box.querySelector('[data-box-color="#5d428c"]').click();check('Color y grosor se aplican al stroke',w.getComputedStyle(surface).borderTopWidth==='4px'&&w.getComputedStyle(surface).borderTopColor==='rgb(93, 66, 140)');slider.value='0';slider.dispatchEvent(new w.Event('input',{bubbles:true}));box.querySelector('[data-box-color="#ff5900"]').click();check('Cero elimina borde incluso al cambiar su color',w.getComputedStyle(surface).borderTopWidth==='0px');
const exported=new DOMParser().parseFromString(w.generateExportHTML(false),'text/html');check('Exportación conserva triángulos e iconos sin controles de copia',!!exported.querySelector('.mod-badge polygon')&&!!exported.querySelector('.mod-badge .material-symbols-outlined')&&!exported.querySelector('[data-mod-cell-copy],.mod-cell-copy-choice'));check('Exportación conserva alineación vertical del texto',!!exported.querySelector('.mod-text[style*="align-content: end"]'));
// Exercise the actual group-selection pointer handlers: move a selected group to the end slot.
await setup();const page=block().parentElement,headingBlock=page.querySelector('[data-check=heading]'),boxBlock=page.querySelector('[data-type=cuadro_naranja]'),footer=page.querySelector(':scope>.lms-footer-wrapper'),scroll=d.querySelector('#scroll-container');scroll.scrollTop=0;await wait();const bounds=page.getBoundingClientRect(),first=headingBlock.getBoundingClientRect(),mod=block().getBoundingClientRect();pointer(page,'pointerdown',bounds.left+2,first.top-2);pointer(d,'pointermove',mod.right+2,mod.bottom+2);pointer(d,'pointerup',mod.right+2,mod.bottom+2);check('Selección de grupo incluye dos elementos',d.querySelector('[data-group-count]').textContent==='2 elementos');const grip=d.querySelector('[data-group-move]'),gr=grip.getBoundingClientRect();pointer(grip,'pointerdown',gr.left+8,gr.top+8);scroll.scrollTop=scroll.scrollHeight;await wait();const foot=footer.getBoundingClientRect();pointer(d,'pointermove',foot.left+40,foot.top+2);pointer(d,'pointerup',foot.left+40,foot.top+2);await wait();check('Soltar grupo antes del footer lo conserva como último hijo',page.lastElementChild===footer&&block().nextElementSibling===footer&&headingBlock.nextElementSibling===block());check('El grupo se movió completo después de los otros elementos',boxBlock.nextElementSibling===headingBlock);
out.textContent=results.join('\n')+`\nTOTAL ${results.length} / FAIL 0`;
}catch(e){out.textContent+='\nERROR '+e.stack;}finally{out.dataset.complete='true';}};
document.querySelector('#show').onclick=async()=>{document.body.classList.remove('results');out.textContent='';await setup();};
document.querySelector('#inspect').onclick=()=>{const{w,d}=env(),text=w.currentEditableText;out.textContent=JSON.stringify({editing:!!text?.isContentEditable,geometry:d.querySelectorAll('.mod-text-geometry button').length,vertical:!!d.querySelector('#rtf-toolbar .rtf-vertical-menu'),body:d.body.className,model:state(),footerLast:block().parentElement.lastElementChild.className},null,2);};
</script></html>
