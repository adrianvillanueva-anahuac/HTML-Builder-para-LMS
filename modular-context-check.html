<!doctype html><html lang="es"><meta charset="utf-8"><title>Jerarquía de menús y figuras estables</title>
<style>body{margin:0;font:13px Arial}header{display:flex;gap:10px;padding:9px;background:#f7f7fb}pre{white-space:pre-wrap;max-height:160px;overflow:auto;margin:0;padding:8px}iframe{width:100%;height:calc(100vh - 230px);border:0}#published{height:260px}button{padding:7px}</style>
<header><strong>Prueba aislada · menús por nivel</strong><button id="run">Verificar correcciones</button><button id="proof">Mostrar ejemplo</button></header><pre id="result">Preparado</pre><iframe id="app" title="Builder aislado" src="/?check=modular-context"></iframe><iframe id="published" title="Publicación sin scripts" sandbox="allow-same-origin"></iframe>
<script type="module">
import {createModular,activateAllCells} from '/src/modular-model.ts';import {createBadge} from '/src/modular-badges-model.ts';import {getBlockToolbar} from '/src/templates.ts';
const frame=document.querySelector('#app'),out=document.querySelector('#result');let w,d,block;const wait=(n=300)=>{d?.body?.getBoundingClientRect();return new Promise(r=>setTimeout(r,n));};
const cell=key=>block.querySelector(`[data-cell="${key}"]`),primary=()=>block.querySelector(':scope>.block-toolbar'),bar=key=>cell(key).querySelector('.mod-cell-tools'),rect=n=>n.getBoundingClientRect(),style=n=>w.getComputedStyle(n),hover=n=>n.dispatchEvent(new w.PointerEvent('pointerover',{bubbles:true,relatedTarget:d.body})),leave=n=>{n.dispatchEvent(new w.PointerEvent('pointerout',{bubbles:true,relatedTarget:d.body}));hover(d.body);},input=(node,value)=>{node.value=String(value);node.dispatchEvent(new w.Event('input',{bubbles:true}));};
async function setup(){for(let i=0;i<200;i++){w=frame.contentWindow;d=frame.contentDocument;if(w?.initNestedDropzones&&d?.querySelector('#canvas'))break;await wait(50);}d.querySelector('.project-welcome .welcome-actions button')?.click();await wait(100);const canvas=d.querySelector('#canvas');canvas.replaceChildren();const m=createModular(2,3);activateAllCells(m);m.rows=[130,130];m.cells['0:1'].badge={...createBadge('rounded'),width:150,height:54,text:'Esquinas uniformes'};const page=d.createElement('div');page.className='lms-element relative is-rendered';page.innerHTML='<div class="lms-dropzone bg-white" style="padding:60px;min-height:750px"><h2 class="editable-text" style="font:26px Georgia;color:#ff5900;margin:0 0 70px">Menús por nivel · figuras sin deformación</h2><section class="lms-element is-rendered modular-table" data-type="tabla_modular"></section><section id="parent-example" class="lms-element relative" style="margin-top:70px;padding:35px;border:1px solid #cdd5dc">'+getBlockToolbar('parrafo_suelto')+'<div class="lms-dropzone"><section id="child-example" class="lms-element relative">'+getBlockToolbar('parrafo_suelto')+'<p class="editable-text">Elemento anidado de prueba</p></section></div></section></div>';block=page.querySelector('.modular-table');block.dataset.modular=JSON.stringify(m);canvas.append(page);w.checkEmptyState?.();w.initNestedDropzones();await wait();d.body.click();return block;}
document.querySelector('#proof').onclick=async()=>{await setup();hover(cell('0:1'));cell('0:1').click();cell('0:1').querySelector('.mod-badge-menu summary').click();await wait();};
document.querySelector('#run').onclick=async()=>{const results=[],check=(name,ok)=>{results.push((ok?'PASS ':'FAIL ')+name);out.textContent=results.join('\n');if(!ok){out.textContent+='\nDIAG '+JSON.stringify({primary:primary()&&{opacity:style(primary()).opacity,pointer:style(primary()).pointerEvents,transition:style(primary()).transition},classes:block?.className});throw Error(name);}};out.removeAttribute('data-complete');try{
await setup();d.body.style.setProperty('--menu-motion-duration','0ms');d.body.style.setProperty('--menu-motion-fade','0ms');const hit=block.querySelector('.mod-primary-hit-area');hover(hit);await wait();let a=rect(primary()),b=rect(block),h=rect(hit);check('Menú principal centrado en el elemento',Math.abs(a.left+a.width/2-b.left-b.width/2)<1);check('Menú principal junto al área sensible superior',Math.abs(a.bottom-h.top-4)<1&&h.height===20);

// Preserve the useful viewport coverage of the former toolbar-elevation fixture.
const originalWidth=frame.style.width;
for(const width of [1320,970]){
 frame.style.width=width+'px';d.body.click();hover(hit);await wait();
 const initial=rect(block),mainRect=rect(primary());
 check(width+' px: menú principal centrado',Math.abs(mainRect.left+mainRect.width/2-initial.left-initial.width/2)<1);
 hit.click();hover(cell('0:1'));cell('0:1').click();await wait();
 check(width+' px: solo el nivel secundario recibe acciones',style(primary()).pointerEvents==='none'&&style(bar('0:1')).opacity==='1');
 check(width+' px: seleccionar no desplaza contenido',Math.abs(rect(block).top-initial.top)<1);
}
frame.style.width=originalWidth;d.body.click();hover(hit);await wait();
hit.click();leave(block);await wait();check('Clic en área superior fija el menú principal',style(primary()).opacity==='1'&&style(primary()).pointerEvents==='auto');
hover(cell('0:1'));await wait();check('Al aparecer menú del rectángulo se oculta el principal fijado',style(primary()).opacity==='0'&&style(bar('0:1')).opacity==='1');
hover(hit);leave(cell('0:1'));hover(hit);await wait();check('Salir del secundario recupera el nivel principal fijado',style(primary()).opacity==='1');
hover(cell('0:1'));cell('0:1').click();leave(block);await wait();check('Clic en rectángulo fija su menú y no el principal',style(bar('0:1')).display==='flex'&&style(bar('0:1')).opacity==='1'&&style(primary()).opacity==='0');check('Menú principal oculto no intercepta controles',style(primary().querySelector('.mod-tools')).pointerEvents==='none');
hover(cell('0:2'));await wait();check('Otro rollover no sustituye el menú de rectángulo fijado',style(bar('0:1')).opacity==='1'&&style(bar('0:2')).opacity==='0');
cell('0:2').click();leave(block);await wait();check('Clic en otro rectángulo transfiere la fijación',style(bar('0:2')).opacity==='1'&&style(bar('0:1')).opacity==='0');
hit.click();leave(block);await wait();check('Clic en área sensible vuelve a fijar únicamente principal',style(primary()).opacity==='1'&&style(bar('0:2')).opacity==='0'&&!block.dataset.pinnedCell);
hover(cell('0:1'));cell('0:1').click();const menu=cell('0:1').querySelector('.mod-badge-menu');menu.querySelector('summary').click();await wait();const panel=menu.querySelector('.mod-badge-panel'),before=rect(panel),barBefore=rect(bar('0:1'));
for(const [width,height]of[[70,180],[200,30],[110,420],[219,80]]){input(menu.querySelector('[data-badge-width]'),width);input(menu.querySelector('[data-badge-height]'),height);await wait(90);const p=rect(panel),t=rect(bar('0:1')),svg=cell('0:1').querySelector('.mod-badge>svg'),r=svg.querySelector('rect'),matrix=r.getScreenCTM();check(`Dimensiones ${width}×${height}: menú permanece inmóvil`,Math.abs(p.left-before.left)<1&&Math.abs(p.top-before.top)<1&&Math.abs(t.left-barBefore.left)<1&&Math.abs(t.top-barBefore.top)<1);check(`Dimensiones ${width}×${height}: esquinas circulares sin estiramiento`,!svg.hasAttribute('viewBox')&&r.rx.baseVal.value===r.ry.baseVal.value&&Math.abs(matrix.a-matrix.d)<.001);}
d.body.click();const parent=d.querySelector('#parent-example'),child=d.querySelector('#child-example'),parentBar=parent.querySelector(':scope>.block-toolbar'),childBar=child.querySelector(':scope>.block-toolbar');parentBar.click();hover(child.querySelector('p'));await wait();check('Elementos anidados: rollover secundario oculta menú del padre',style(parentBar).opacity==='0'&&style(childBar).opacity==='1');child.querySelector('p').click();hover(d.body);await wait();check('Elementos anidados: clic fija únicamente el nivel hijo',style(parentBar).opacity==='0'&&style(childBar).opacity==='1');d.body.click();
const exported=new DOMParser().parseFromString(w.generateExportHTML(false),'text/html');exported.querySelectorAll('script').forEach(n=>n.remove());const pub=document.querySelector('#published');pub.srcdoc='<!doctype html>'+exported.documentElement.outerHTML;await new Promise(resolve=>pub.onload=resolve);await wait(100);const pd=pub.contentDocument,psvg=pd.querySelector('.mod-badge>svg');check('Publicación elimina área sensible y controles del editor',!pd.querySelector('.mod-primary-hit-area,.mod-cell-tools'));check('Publicación conserva SVG con radios iguales sin viewBox deformable',!psvg.hasAttribute('viewBox')&&psvg.querySelector('rect').getAttribute('rx')===psvg.querySelector('rect').getAttribute('ry'));pub.style.width='540px';await wait();const pm=psvg.querySelector('rect').getScreenCTM();check('Sin JavaScript las esquinas no se deforman al reducir viewport',Math.abs(pm.a-pm.d)<.001);pub.style.width='100%';
out.textContent=results.join('\n')+`\nTOTAL ${results.length} / FAIL 0`;
}catch(e){out.textContent+='\nERROR '+e.stack;}finally{out.dataset.complete='true';}};
</script></html>
