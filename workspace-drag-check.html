<!doctype html><html lang="es"><meta charset="utf-8"><title>Arrastre entre espacios</title><body style="font:14px Arial;margin:12px"><h1>Prueba: mover elementos entre pestañas</h1><button id="run" disabled>Probar arrastre</button><pre id="result">Cargando editor…</pre><iframe id="editor" src="/" style="width:1300px;height:680px;border:1px solid #ddd"></iframe>
<script type="module">
import {getCajaTextoHTML,getPaginaBasicaHTML} from '/src/templates.ts';
const frame=document.querySelector('#editor'),run=document.querySelector('#run'),result=document.querySelector('#result');
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
frame.onload=()=>run.disabled=false;
run.onclick=async()=>{run.disabled=true;result.textContent='';const check=(ok,label)=>{if(!ok)throw Error(label);result.textContent+='✓ '+label+'\n';};try{
 const w=frame.contentWindow,d=frame.contentDocument;
 const buttons=()=>[...d.querySelectorAll('[role=tab]')];
 const active=()=>buttons().findIndex(b=>b.getAttribute('aria-selected')==='true');
 const canvas=()=>d.querySelector('#canvas');
 const count=()=>canvas().querySelectorAll('[data-type=caja_texto]').length;
 const point=el=>{const r=el.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+Math.min(r.height/2,75)};};
 const pointer=(type,p,target)=>{(target||d.elementFromPoint(p.x,p.y)||d).dispatchEvent(new w.PointerEvent(type,{bubbles:true,cancelable:true,clientX:p.x,clientY:p.y,pointerId:1,pointerType:'mouse',isPrimary:true,button:0,buttons:type==='pointerup'?0:1}));};
 const move=async p=>{pointer('pointermove',p);await wait(100);};
 const start=async()=>{const handle=canvas().querySelector('.drag-handle'),p=point(handle);pointer('pointerdown',p,handle);await move({x:p.x+12,y:p.y+15});await move({x:p.x+20,y:p.y+20});check(w.isLmsDragging,'Arrastre real de Sortable iniciado desde los seis puntos');};
 let create=[...d.querySelectorAll('button')].find(b=>b.textContent==='Nuevo proyecto'&&!b.closest('#project-file-menu'));
 if(!create){d.querySelector('.project-menu-toggle').click();await wait(100);create=[...d.querySelectorAll('button')].find(b=>b.textContent==='Nuevo proyecto');}
 create.click();await wait(250);const discard=d.querySelector('dialog button[value=discard]');if(discard){discard.click();await wait(200);}
 canvas().innerHTML=getCajaTextoHTML();w.initNestedDropzones();await wait(300);
 d.querySelector('[aria-label="Agregar página"]').click();await wait(100);d.querySelector('dialog input').value='Destino';d.querySelector('dialog button[value=ok]').click();await wait(200);
 buttons()[0].click();await wait(200);
 await start();const tabPoint=point(buttons()[1]);await move(tabPoint);await wait(200);check(active()===0,'No cambia antes de medio segundo');await wait(400);check(active()===1,'Abre la pestaña al mantener el puntero 500 ms');
 const drop=point(canvas());await move(drop);await wait(250);pointer('pointerup',drop);await wait(300);check(count()===1,'Coloca el elemento en el destino');check(!d.querySelector('[data-workspace-parking]'),'Libera los lienzos temporales');
 buttons()[0].click();await wait(200);check(count()===0,'Elimina el elemento del origen al confirmar');buttons()[1].click();await wait(200);check(count()===1,'Conserva una sola copia al volver al destino');
 await start();await move(point(buttons()[0]));await wait(600);check(active()===0,'Puede regresar a otra pestaña durante un segundo arrastre');
 d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true,cancelable:true}));await wait(300);check(active()===1&&count()===1&&!w.isLmsDragging,'Esc termina el arrastre y restaura origen');
 await start();await move(point(buttons()[0]));await wait(600);const outside={x:30,y:110};await move(outside);pointer('pointerup',outside);await wait(300);check(active()===1&&count()===1,'Soltar fuera de una zona válida restaura origen');
 buttons()[0].click();await wait(150);check(count()===0,'Cancelar no deja copias en el destino');buttons()[1].click();await wait(150);
 d.querySelector('[aria-label="Agregar página"]').click();await wait(100);d.querySelector('dialog input').value='Página con contenido';d.querySelector('dialog button[value=ok]').click();await wait(200);
 canvas().innerHTML=getPaginaBasicaHTML();w.initNestedDropzones();await wait(200);buttons()[1].click();await wait(200);
 await start();await move(point(buttons()[0]));await wait(600);await move(point(buttons()[2]));await wait(600);check(active()===2,'Permite recorrer varias pestañas sin soltar');
 const nested=canvas().querySelector('.lms-dropzone'),nestedPoint=point(nested);await move(nestedPoint);await wait(300);pointer('pointerup',nestedPoint);await wait(250);
 check(count()===1&&canvas().querySelector('[data-type=caja_texto]').parentElement!==canvas(),'Coloca el elemento dentro de una página existente');
 buttons()[1].click();await wait(150);check(count()===0,'El origen queda sin el elemento después del recorrido');buttons()[0].click();await wait(150);check(count()===0,'Las pestañas intermedias no reciben copias');buttons()[2].click();await wait(150);
 result.textContent+='Todas las comprobaciones correctas';
 }catch(error){result.textContent+='ERROR: '+error.message;}finally{run.disabled=false;}};
</script></body></html>
