<!doctype html><meta charset="utf-8"><button id="run">Probar imagen de tarjeta</button><pre id="results"></pre><iframe id="app" src="/?editor=exercise" style="width:100%;height:820px"></iframe><script type="module">
run.onclick=async()=>{const w=app.contentWindow,d=w.document,wait=()=>new Promise(r=>setTimeout(r,250)),out=document.querySelector('#results');let n=0;const check=(ok,label)=>{out.textContent+=(ok?'PASS ':'FAIL ')+label+'\n';if(!ok)throw Error(label);n++;};try{
 d.querySelector('#canvas').replaceChildren();w.insertTemplate('flipcard');w.initNestedDropzones();const card=d.querySelector('.flipcard-item'),front=card.querySelector('.flipcard-front'),back=card.querySelector('.flipcard-back'),b=card.querySelector('[data-flip-image-button]'),menu=d.querySelector('#flip-image-menu');b.click();check(menu.querySelectorAll('button:disabled').length===2,'PC y galería visibles e inactivos');const url=menu.querySelector('input');url.value='http://127.0.0.1:3003/imagenes/titulos/Fondo_naranja_escolar.png';[...menu.querySelectorAll('button')].find(x=>x.getAttribute('aria-label')==='Insertar desde URL').click();await wait();await wait();check(!!front.querySelector('.flip-image-layer img'),'Imagen por URL insertada');check(!back.querySelector('.flip-image-layer'),'Dorso independiente');check(b.parentElement===card.querySelector('.flipcard-item-controls').firstElementChild,'Imagen en el extremo izquierdo');check(menu.querySelectorAll('button').length===4,'Cuatro acciones con iconos');const mr=menu.getBoundingClientRect(),cr=card.getBoundingClientRect();check(mr.right<=cr.left||mr.left>=cr.right||mr.bottom<=cr.top,'Menú fuera de la imagen');menu.querySelector('[aria-label="Editar imagen"]').click();let slider=menu.querySelector('[aria-label="Desenfoque"]');slider.value='5';slider.dispatchEvent(new w.Event('input',{bubbles:true}));slider.dispatchEvent(new w.Event('change',{bubbles:true}));check(front.querySelector('img').style.filter.includes('blur(5px)'),'Blur aplicado solo a la imagen');check(w.getComputedStyle(front.querySelector('.editable-text')).filter==='none','Texto sin desenfoque');const click=label=>[...menu.querySelectorAll('button')].find(x=>x.getAttribute('aria-label')===label).click();click('Rotar 90°');check(JSON.parse(front.dataset.flipImage).rotation===90,'Rotación persistida');slider=menu.querySelector('[aria-label="Contraste"]');slider.value='120';slider.dispatchEvent(new w.Event('input',{bubbles:true}));slider.dispatchEvent(new w.Event('change',{bubbles:true}));check(front.querySelector('img').style.filter.includes('contrast(120%)'),'Ajustes de color compartidos');click('Volver');click('Reencuadre libre');const modal=d.querySelector('.flip-image-reframe'),svg=modal.querySelector('svg'),handle=modal.querySelector('[data-scale-handle=se]');check(modal.querySelectorAll('[data-scale-handle]').length===4,'Cuatro esquinas para escala proporcional');const vb=svg.viewBox.baseVal;check([...modal.querySelectorAll('[data-scale-handle]')].every(r=>Number(r.getAttribute('x'))>=vb.x&&Number(r.getAttribute('y'))>=vb.y&&Number(r.getAttribute('x'))+Number(r.getAttribute('width'))<=vb.x+vb.width&&Number(r.getAttribute('y'))+Number(r.getAttribute('height'))<=vb.y+vb.height),'Mediadores visibles con imagen panorámica');check(!!modal.querySelector('[data-ghost]'),'Exterior atenuado como diagrama de flujo');const photo=modal.querySelector('[data-photo]'),ratio=Number(photo.getAttribute('width'))/Number(photo.getAttribute('height'));handle.dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));check(Math.abs(Number(photo.getAttribute('width'))/Number(photo.getAttribute('height'))-ratio)<.001,'Escala conserva proporción natural');svg.dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));modal.querySelector('[aria-label="Aplicar encuadre"]').click();check(JSON.parse(front.dataset.flipImage).scale>1&&JSON.parse(front.dataset.flipImage).x===1,'Encuadre y escala guardados');b.dispatchEvent(new w.PointerEvent('pointerover',{bubbles:true}));click('Reencuadre libre');const cancel=d.querySelector('.flip-image-reframe');cancel.querySelector('[data-scale-handle=se]').dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));cancel.querySelector('[aria-label="Cancelar"]').click();check(JSON.parse(front.dataset.flipImage).scale===1.05,'Cancelar conserva encuadre anterior');const clone=d.createElement('div');clone.innerHTML=card.outerHTML;check(clone.querySelector('.flip-image-layer img').style.filter.includes('blur(5px)'),'Apariencia conservada al serializar');b.dispatchEvent(new w.PointerEvent('pointerover',{bubbles:true}));check(!menu.hidden&&!!menu.querySelector('[aria-label="Reemplazar imagen"]'),'Menú disponible en rollover');out.textContent+='TOTAL '+n;
 }catch(e){out.textContent+='ERROR '+e.message;}};
