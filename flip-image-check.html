<!doctype html><meta charset="utf-8"><button id="run">Probar imagen de tarjeta</button><pre id="results"></pre><iframe id="app" src="/?editor=exercise" style="width:100%;height:820px"></iframe><script type="module">
run.onclick=async()=>{const w=app.contentWindow,d=w.document,wait=()=>new Promise(r=>setTimeout(r,250)),out=document.querySelector('#results');let n=0;const check=(ok,label)=>{out.textContent+=(ok?'PASS ':'FAIL ')+label+'\n';if(!ok)throw Error(label);n++;};try{
 d.querySelector('#canvas').replaceChildren();w.insertTemplate('flipcard');w.initNestedDropzones();const card=d.querySelector('.flipcard-item'),front=card.querySelector('.flipcard-front'),back=card.querySelector('.flipcard-back'),b=card.querySelector('[data-flip-image-button]'),menu=d.querySelector('#flip-image-menu');b.click();check(menu.querySelectorAll('button:disabled').length===2,'PC y galería visibles e inactivos');const url=menu.querySelector('input');url.value='http://127.0.0.1:3003/imagenes/titulos/Fondo_naranja_escolar.png';[...menu.querySelectorAll('button')].find(x=>x.textContent==='Insertar desde URL').click();await wait();await wait();check(!!front.querySelector('.flip-image-layer img'),'Imagen por URL insertada');check(!back.querySelector('.flip-image-layer'),'Dorso independiente');let slider=menu.querySelector('[aria-label="Desenfoque"]');slider.value='5';slider.dispatchEvent(new w.Event('input',{bubbles:true}));slider.dispatchEvent(new w.Event('change',{bubbles:true}));check(front.querySelector('img').style.filter.includes('blur(5px)'),'Blur aplicado solo a la imagen');check(w.getComputedStyle(front.querySelector('.editable-text')).filter==='none','Texto sin desenfoque');const click=label=>[...menu.querySelectorAll('button')].find(x=>x.textContent===label).click();click('Rotar 90°');check(JSON.parse(front.dataset.flipImage).rotation===90,'Rotación persistida');click('Editar color de imagen');slider=menu.querySelector('[aria-label="Contraste"]');slider.value='120';slider.dispatchEvent(new w.Event('input',{bubbles:true}));slider.dispatchEvent(new w.Event('change',{bubbles:true}));check(front.querySelector('img').style.filter.includes('contrast(120%)'),'Ajustes de color compartidos');click('Volver');click('Reencuadre libre');const modal=d.querySelector('.flip-image-reframe'),scale=modal.querySelector('input');scale.value='1.5';scale.dispatchEvent(new w.Event('input',{bubbles:true}));modal.querySelector('[data-apply]').click();check(JSON.parse(front.dataset.flipImage).scale===1.5,'Reencuadre guardado');const clone=d.createElement('div');clone.innerHTML=card.outerHTML;check(clone.querySelector('.flip-image-layer img').style.filter.includes('blur(5px)'),'Apariencia conservada al serializar');b.dispatchEvent(new w.PointerEvent('pointerover',{bubbles:true}));check(!menu.hidden&&menu.textContent.includes('Reemplazar imagen'),'Menú disponible en rollover');out.textContent+='TOTAL '+n;
 }catch(e){out.textContent+='ERROR '+e.message;}};
</script>
