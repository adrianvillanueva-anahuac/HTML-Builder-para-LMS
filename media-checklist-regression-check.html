<!doctype html><html lang="es"><meta charset="utf-8"><title>Verificación de pendientes de Medios</title>
<style>body{margin:0;font:13px Arial}#controls{padding:8px;background:#eee}pre{white-space:pre-wrap;margin:8px;max-height:130px;overflow:auto}iframe{width:100%;height:calc(100vh - 42px);border:0}</style>
<div id="controls"><button id="run">Probar Medios y pendientes automáticos</button> <button id="proof">Mostrar menú</button> <button id="tasks">Mostrar checklist</button></div><pre id="result"></pre><iframe id="app" src="/"></iframe>
<script type="module">
import {getEmbedHTML,getCalculadoraHTML} from '/src/templates.ts';
import {isMediaFilled,syncWorkspaceAutomaticChecklist} from '/src/media-checklist.ts';
const frame=document.querySelector('#app'),out=document.querySelector('#result'),wait=(ms=400)=>new Promise(r=>setTimeout(r,ms));
const env=()=>({w:frame.contentWindow,d:frame.contentWindow.document});
const types=['embed_youtube','embed_vimeo','embed_genially','embed_canva','embed_sketchfab','embed_gamma','calculadora_html'];
const labels=['YouTube','Vimeo','Genially','Canva','Sketchfab','Gamma','Funciones externas'];
const tab=(i=0)=>env().d.querySelectorAll('.project-tabs [role=tab]')[i];
const description=(i=0)=>tab(i).getAttribute('aria-description');
const mediaCount=(i=0)=>(description(i).match(/Tienes pendiente agregar contenido/g)||[]).length;
const buttonCount=(i=0)=>(description(i).match(/Tienes pendiente poner acción/g)||[]).length;
const block=type=>env().d.querySelector(`#canvas [data-type="${type}"]`);
const mediaBlocks=()=>Array.from(env().d.querySelectorAll('#canvas [id^=media-],#canvas [data-type^=embed_],#canvas [data-type=calculadora_html]')).filter(el=>types.includes(el.dataset.type));
function insertMedia(type){const {w,d}=env();w.saveHistoryState(true);const holder=d.createElement('template');holder.innerHTML=type==='calculadora_html'?getCalculadoraHTML():getEmbedHTML(type);const target=d.querySelector('#canvas .lms-dropzone.bg-white')||d.querySelector('#canvas');target.insertBefore(holder.content.firstElementChild,target.querySelector(':scope > .lms-footer-wrapper'));w.initNestedDropzones();w.checkEmptyState();w.saveHistoryState(true);}
let results=[];
const check=(name,ok)=>{results.push((ok?'PASS ':'FAIL ')+name);out.textContent=results.join('\n');if(!ok)throw Error(name);};
async function menu(){const {d}=env();const toggle=d.querySelector('.project-menu-toggle');if(toggle.getAttribute('aria-expanded')!=='true')toggle.click();await wait(100);return d.querySelector('[role=switch]');}
async function toggle(enabled){const control=await menu();if((control.getAttribute('aria-checked')==='true')!==enabled)control.click();await wait();return control;}
async function info(i=0){const {w,d}=env();tab(i).dispatchEvent(new w.KeyboardEvent('keydown',{key:'F2',bubbles:true}));await wait();return d.querySelector('dialog.workspace-settings');}
function fillEmbed(item){const {w}=env();item.querySelector('.embed-input').value='<iframe src="http://127.0.0.1:3000/media-checklist-resource.html" srcdoc="<p>Recurso de prueba</p>"></iframe>';w.processEmbed(item.querySelector('.embed-input'),item.dataset.type);}
async function save(){const {w,d}=env();let captured;w.showSaveFilePicker=async()=>({name:'Prueba medios.lmsproject',createWritable:async()=>({write:async text=>{captured=text;},close:async()=>{}})});d.querySelector('.project-name').dispatchEvent(new w.MouseEvent('dblclick',{bubbles:true}));await wait();const prompt=d.querySelector('dialog.project-prompt');prompt.querySelector('input').value='Prueba medios';prompt.querySelector('button[value=ok]').click();await wait();return JSON.parse(captured);}
async function reopen(project){const {w,d}=env();await menu();Array.from(d.querySelectorAll('#project-file-menu button')).find(b=>b.textContent==='Abrir proyecto o HTML').click();const input=Array.from(d.querySelectorAll('input[type=file]')).at(-1),transfer=new w.DataTransfer();transfer.items.add(new w.File([JSON.stringify(project)],'Prueba medios.lmsproject',{type:'application/json'}));input.files=transfer.files;input.dispatchEvent(new w.Event('change'));await wait();d.querySelector('dialog button[value=ok]').click();await wait();d.querySelector('dialog button[value=discard]').click();await wait();}
document.querySelector('#run').onclick=async()=>{
 results=[];out.textContent='Preparando…';
 try{
  const {w,d}=env();check('Interruptor inhabilitado sin proyecto',d.querySelector('[role=switch]').disabled);
  d.querySelector('.project-welcome .welcome-actions button').click();await wait();w.insertTemplate('bienvenida');await wait();
  check('Creación automática activada por defecto',(await menu()).getAttribute('aria-checked')==='true');d.querySelector('.project-menu-toggle').click();
  for(let i=0;i<types.length;i++){insertMedia(types[i]);await wait();check(labels[i]+' vacío crea su pendiente',mediaCount()===i+1&&description().includes(`Pendiente: Tienes pendiente agregar contenido en "${labels[i]}".`));}
  check('Todos los medios tienen identidad estable y única',new Set(mediaBlocks().map(item=>item.id)).size===7&&mediaBlocks().every(item=>item.id));
  block('embed_youtube').querySelector('.embed-input').value='https://youtu.be/ejemplo';block('embed_youtube').querySelector('.embed-input').dispatchEvent(new w.Event('input',{bubbles:true}));await wait();
  check('Pegar sin incrustar no completa el pendiente',description().includes('Pendiente: Tienes pendiente agregar contenido en "YouTube".'));
  for(let i=0;i<6;i++){fillEmbed(block(types[i]));await wait();check(labels[i]+' se marca al incrustar contenido',description().includes(`Completado: Tienes pendiente agregar contenido en "${labels[i]}".`));}
  const calc=block('calculadora_html');calc.querySelector('.calc-raw-code').value='<p>Actividad externa</p>';calc.querySelector('.calc-raw-code').textContent='<p>Actividad externa</p>';w.processCalculadora(calc);await wait();check('Funciones externas incrustadas completan el pendiente',description().includes('Completado: Tienes pendiente agregar contenido en "Funciones externas".'));
  w.editCalculadora(calc);await wait();check('Editar funciones externas vuelve a pendiente pese al código conservado',description().includes('Pendiente: Tienes pendiente agregar contenido en "Funciones externas".'));
  calc.querySelector('.calc-raw-code').value='<!doctype html><html><head><title>Actividad íntegra</title></head><body><p>Contenido completo</p></body></html>';w.processCalculadora(calc);await wait();check('HTML íntegro con botón a pantalla completa también cuenta como contenido',!!calc.querySelector('[data-standalone-html]')&&description().includes('Completado: Tienes pendiente agregar contenido en "Funciones externas".'));
  w.editEmbed(block('embed_youtube'));await wait();check('Editar medio reabre su pendiente aunque conserve la URL',description().includes('Pendiente: Tienes pendiente agregar contenido en "YouTube".'));
  const off=await toggle(false);check('Apagar conserva los siete pendientes',off.getAttribute('aria-checked')==='false'&&mediaCount()===7);
  insertMedia('embed_youtube');await wait();check('Apagado no crea pendientes para nuevos medios',mediaCount()===7);
  block('embed_youtube').querySelector('[data-duplicate-element]').click();await wait();check('Duplicar un medio vacío con el interruptor apagado no crea tarea',mediaCount()===7);
  w.insertTemplate('boton_interactivo');await wait();d.querySelector('dialog.ib-dialog button[value=ok]').click();await wait();check('Interruptor también detiene nuevos pendientes de botones',buttonCount()===0&&mediaCount()===7);
  let settings=await info();check('Tareas de medios son automáticas y no editables manualmente',settings.querySelectorAll('.workspace-task[data-automatic=true]').length===7&&Array.from(settings.querySelectorAll('.workspace-task[data-automatic=true] input[type=checkbox]')).every(input=>input.disabled));
  settings.querySelector('[data-add-task]').click();settings.querySelector('.workspace-task:last-child input[type=text]').value='Revisar bibliografía';settings.querySelector('button[value=ok]').click();await wait();check('Con interruptor apagado se pueden añadir tareas manualmente',description().includes('Pendiente: Revisar bibliografía')&&mediaCount()===7);
  fillEmbed(block('embed_youtube'));await wait();check('Pendientes existentes se completan aunque la creación esté apagada',description().includes('Completado: Tienes pendiente agregar contenido en "YouTube".'));
  const project=await save();check('Guardar conserva interruptor apagado e identidades',project.autoChecklist===false&&project.spaces[0].checklist.filter(item=>item.mediaId).length===7&&d.querySelector('.project-save-state').textContent==='Guardado');
  await toggle(true);await reopen(project);check('Reabrir conserva apagado y no inventa tareas omitidas',(await menu()).getAttribute('aria-checked')==='false'&&mediaCount()===7&&buttonCount()===0);
  await toggle(true);check('Reactivar incorpora los medios y botones pendientes sin duplicar los existentes',mediaCount()===9&&buttonCount()===1&&description().includes('Revisar bibliografía'));
  block('calculadora_html').querySelector('[data-duplicate-element]').click();await wait();check('Duplicar un medio ya completo no crea una tarea completada innecesaria',mediaCount()===9);
  await toggle(false);const original=block('embed_youtube'),originalId=original.id;w.saveHistoryState(true);original.querySelector(':scope > .block-toolbar button[onclick*="deleteBlock"]').click();w.saveHistoryState(true);await wait();check('Eliminar retira solo el pendiente del medio eliminado',mediaCount()===8);
  w.undo();await wait();check('Deshacer eliminación restaura la tarea existente aun con creación apagada',mediaCount()===9&&!!d.getElementById(originalId)&&description().includes('Revisar bibliografía'));
  const moved=Array.from(d.querySelectorAll('#canvas [data-type=embed_youtube]')).find(item=>!isMediaFilled(item)),movedId=moved.id;
  // Synthetic pointermove does not dispatch the pointerleave that closes this menu in a real drag.
  const projectMenu=d.querySelector('.project-menu-toggle');if(projectMenu.getAttribute('aria-expanded')==='true')projectMenu.click();
  d.querySelector('.project-tab-add').click();await wait();d.querySelector('dialog input').value='Destino';d.querySelector('dialog button[value=ok]').click();await wait();tab(0).click();await wait();
  const point=el=>{const r=el.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+Math.min(r.height/2,55)};};
  const pointer=(type,p,target)=>{(target||d.elementFromPoint(p.x,p.y)||d).dispatchEvent(new w.PointerEvent(type,{bubbles:true,cancelable:true,clientX:p.x,clientY:p.y,pointerId:1,pointerType:'mouse',isPrimary:true,button:0,buttons:type==='pointerup'?0:1}));};
  const move=async p=>{pointer('pointermove',p);await wait(100);};
  const handle=d.getElementById(movedId).querySelector('.drag-handle');handle.scrollIntoView({block:'center'});const start=point(handle);pointer('pointerdown',start,handle);await move({x:start.x+12,y:start.y+15});await move({x:start.x+20,y:start.y+20});check('Arrastre de medio iniciado',!!w.isLmsDragging&&!!w.lmsWorkspaceDragActive);
  const destination=point(tab(1));await move(destination);await wait(850);if(tab(1).getAttribute('aria-selected')!=='true')out.textContent+='\nDEBUG '+JSON.stringify({active:w.lmsWorkspaceDragActive,drag:w.isLmsDragging,switched:w.lmsWorkspaceDragSwitched,destination,hit:d.elementFromPoint(destination.x,destination.y)?.outerHTML.slice(0,240)});check('Arrastre abre la pestaña destino',tab(1).getAttribute('aria-selected')==='true');const drop=point(d.querySelector('#canvas'));await move(drop);pointer('pointerup',drop);await wait();
  check('Mover con interruptor apagado conserva el pendiente en la página correcta',mediaCount(0)===8&&mediaCount(1)===1&&d.getElementById(movedId));
  fillEmbed(d.getElementById(movedId));await wait();check('Después del traslado el pendiente se sigue completando automáticamente',description(1).includes('Completado: Tienes pendiente agregar contenido en "YouTube".'));
  const detached=document.createElement('div');detached.innerHTML=getEmbedHTML('embed_vimeo');detached.querySelector('iframe')?.remove();const frameEl=document.createElement('iframe');frameEl.src='about:blank';detached.querySelector('.embed-result').classList.remove('hidden');detached.querySelector('.embed-result').append(frameEl);check('Iframe vacío about:blank no cuenta como contenido',!isMediaFilled(detached.firstElementChild));
  const legacy=document.createElement('div');legacy.innerHTML=getEmbedHTML('embed_gamma');legacy.firstElementChild.removeAttribute('id');const legacySpace={id:'legacy',name:'Anterior',html:legacy.innerHTML,bg:'blanco',style:''};const synced=syncWorkspaceAutomaticChecklist(legacySpace);check('Medios antiguos sin id se normalizan una sola vez',!!synced.checklist?.[0]?.mediaId&&synced.html.includes(synced.checklist[0].mediaId)&&syncWorkspaceAutomaticChecklist(synced).checklist===synced.checklist);
  out.textContent=results.join('\n')+'\nTOTAL: '+results.length+' / FAIL: '+results.filter(x=>x.startsWith('FAIL')).length;
 }catch(error){out.textContent+='\nERROR '+error.stack;}
};
document.querySelector('#proof').onclick=async()=>{out.hidden=true;env().d.querySelector('#scroll-container').scrollTop=0;await menu();};
document.querySelector('#tasks').onclick=async()=>{out.hidden=true;env().d.querySelector('.project-name').focus();env().d.querySelector('.project-tab[data-active=true] [role=tab]').focus();};
</script></html>
