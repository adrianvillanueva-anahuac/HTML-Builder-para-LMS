<!doctype html><html lang="es"><meta charset="utf-8"><title>Primer doble clic y cajas dentro de + info</title>
<style>body{margin:0;font:13px Arial;color:#253649}header{display:flex;gap:8px;align-items:center;padding:8px;background:#f7f7fb}button{padding:7px 10px}pre{white-space:pre-wrap;max-height:140px;overflow:auto;margin:0;padding:8px}pre:empty{display:none}iframe{width:100%;height:calc(100vh - 46px);border:0}body.results iframe{height:calc(100vh - 205px)}</style>
<header><strong>Prueba aislada · cajas de texto</strong><button id="run">Verificar cajas y lienzo</button><button id="regular">Mostrar texto del rectángulo</button><button id="container">Mostrar contenedor</button></header><pre id="result" role="status"></pre><iframe id="app" title="Builder de prueba" src="/?check=modular-caption"></iframe>
<script type="module">
import{createModular,activateAllCells}from'/src/modular-model.ts';import{addModularTextBox}from'/src/modular-text-model.ts';import{normalizeModularOverflow}from'/src/modular-overflow-model.ts';
const frame=document.querySelector('#app'),out=document.querySelector('#result'),wait=(ms=140)=>new Promise(r=>setTimeout(r,ms));let busy=false,results=[];
const env=()=>({w:frame.contentWindow,d:frame.contentDocument}),block=()=>env().d.querySelector('#canvas .modular-table'),cell=()=>block().querySelector('[data-cell="0:0"]'),state=()=>JSON.parse(block().dataset.modular),info=()=>cell().querySelector('.mod-overflow-info'),editor=()=>env().d.querySelector('.mod-overflow-editor'),tools=()=>env().d.querySelector('#rtf-toolbar'),edit=()=>env().w.currentEditableText;
const check=(name,ok)=>{results.push((ok?'PASS ':'FAIL ')+name);out.textContent=results.join('\n');if(!ok)throw Error(name);};
function dbl(node){node.dispatchEvent(new(env().w.MouseEvent)('dblclick',{bubbles:true}));}
async function setup(){for(let i=0;i<200;i++){const{w,d}=env();if(w?.initNestedDropzones&&d?.querySelector('#canvas')){d.querySelector('.project-welcome .welcome-actions button')?.click();await wait();const canvas=d.querySelector('#canvas');canvas.replaceChildren();const m=createModular(1,2);m.rows=[240];activateAllCells(m);m.cells['0:0'].html='<p>Contenido de + info</p>';const extra=addModularTextBox(m.cells['0:0']);extra.document={tag:'div',style:{'font-size':'18px'},children:[{tag:'#text',text:'Texto editable en el rectángulo'}]};extra.layout={x:.12,y:.45,width:.72,height:.3};m.cells['0:0'].textOverflow=normalizeModularOverflow({enabled:true,boxIds:['primary']},['primary',extra.id]);m.cells['0:1'].html='<p>El resto de la página queda bloqueado, no el Builder.</p>';const page=d.createElement('div');page.className='lms-element is-rendered lms-dropzone bg-white';page.style.cssText='padding:42px;min-height:480px;margin:20px auto;border-radius:14px;';const heading=d.createElement('h2');heading.textContent='Cajas de texto independientes';heading.style.cssText='font:bold 28px Georgia;text-align:center;color:#ff5900;margin:12px 0 55px';const section=d.createElement('section');section.className='lms-element is-rendered modular-table';section.dataset.type='tabla_modular';section.dataset.modular=JSON.stringify(m);page.append(heading,section);canvas.append(page);w.checkEmptyState?.();w.initNestedDropzones();await wait(350);await d.fonts.ready;w.saveHistoryState(true);return env();}await wait(50);}throw Error('Builder no disponible');}
async function open(){dbl(info().querySelector('summary'));await wait();}
function key(handle,key,shiftKey=true){editor().querySelector(`[data-mod-text-handle="${handle}"]`).dispatchEvent(new(env().w.KeyboardEvent)('keydown',{key,shiftKey,bubbles:true,cancelable:true}));}
function draftLayout(){return JSON.parse(editor().querySelector('[data-overflow-frame=primary]').dataset.textLayout);}
function type(value){edit().textContent=value;edit().dispatchEvent(new(env().w.Event)('input',{bubbles:true}));}
document.querySelector('#run').onclick=async()=>{if(busy)return;busy=true;results=[];out.removeAttribute('data-complete');document.body.classList.add('results');try{
 const{w,d}=await setup(),text=cell().querySelector('.mod-extra-text');dbl(text);await wait();check('El primer doble clic activa texto, barra nativa y nueve tiradores',text.isContentEditable&&!tools().classList.contains('hidden')&&cell().querySelectorAll('.mod-text-geometry button').length===9&&tools().querySelector('[aria-label="Terminar texto"]'));const grip=cell().querySelector('[data-mod-text-handle=move]').getBoundingClientRect(),bar=tools().getBoundingClientRect();check('Los seis puntos están debajo de la herramienta de texto',grip.top>=bar.bottom&&grip.top-bar.bottom<20);tools().querySelector('[aria-label="Terminar texto"]').click();
 info().querySelector('[data-overflow-preview]').click();await wait();const summary=info().querySelector('summary'),beforeButton=summary.getBoundingClientRect();
 await open();check('El doble clic en + info sigue entrando solo en apariencia',!editor().querySelector('[contenteditable=true]')&&w.getComputedStyle(editor().querySelector('.mod-overflow-editor-bar')).display!=='none');
 const page=cell().closest('.lms-dropzone.bg-white'),backdrop=editor().querySelector(':scope>.mod-overflow-backdrop').getBoundingClientRect(),bounds=page.getBoundingClientRect();check('Solo el lienzo de esta página queda inerte',page.inert&&!d.querySelector('#scroll-container').inert&&!d.querySelector('#canvas-container-outer').inert&&!d.body.inert);check('El fondo del editor queda dentro del lienzo visible',backdrop.left>=bounds.left-1&&backdrop.right<=bounds.right+1&&backdrop.top>=Math.max(bounds.top,d.querySelector('#scroll-container').getBoundingClientRect().top)-1&&backdrop.bottom<=bounds.bottom+1);
 const catalog=d.querySelector('[data-tab="elements"]')||[...d.querySelectorAll('button')].find(button=>button.textContent.trim()==='Elementos');check('El catálogo no está bloqueado por el editor',catalog&&!catalog.closest('[inert]'));catalog.click();check('El catálogo del Builder sigue respondiendo durante la edición',!!editor()&&d.querySelector('#tab-elements')?.classList.contains('hidden')===false);
 const before=JSON.stringify(state().cells['0:0']),draft=editor().querySelector('[data-overflow-draft=primary]');dbl(draft);await wait();check('Primer doble clic en el borrador activa texto y la misma geometría',edit()===draft&&draft.isContentEditable&&editor().querySelectorAll('.mod-text-geometry button').length===9&&tools().querySelector('[aria-label="Confirmar texto"]'));check('Apariencia se oculta mientras se edita la caja',w.getComputedStyle(editor().querySelector('.mod-overflow-editor-bar')).display==='none');
 w.saveHistoryState(true);const liveExport=new DOMParser().parseFromString(w.generateExportHTML(false),'text/html');check('Guardar o publicar durante la edición no conserva el bloqueo temporal',!!editor()&&!liveExport.querySelector('.mod-overflow-page-locked,[data-mod-overflow-was-inert],[inert],.mod-overflow-editor'));
 const dg=editor().querySelector('[data-mod-text-handle=move]').getBoundingClientRect(),dt=tools().getBoundingClientRect();check('El asa del contenedor también queda debajo de la barra nativa',dg.top>=dt.bottom&&dg.top-dt.bottom<20);
 const font=w.getComputedStyle(draft).fontSize;key('se','ArrowLeft');key('se','ArrowDown');const resized=draftLayout();check('Los tiradores redimensionan sin cambiar la tipografía',resized.width<1&&w.getComputedStyle(draft).fontSize===font);key('move','ArrowRight');const moved=draftLayout();check('Los seis puntos reposicionan el texto dentro del contenedor',moved.x>resized.x);for(let i=0;i<45;i++)key('move','ArrowRight');check('El texto no puede salir del contenedor',draftLayout().x+draftLayout().width<=1.00001);check('La geometría del rectángulo original no se modifica al mover su copia',JSON.stringify(state().cells['0:0'])===before);
 tools().querySelector('[aria-label="Confirmar texto"]').click();await wait();check('Confirmar texto cierra sus tiradores y regresa a apariencia',!editor().querySelector('.mod-text-geometry')&&w.getComputedStyle(editor().querySelector('.mod-overflow-editor-bar')).display!=='none');editor().querySelector('[data-panel-cancel]').click();check('Cancelar descarta también las posiciones del texto',!editor()&&JSON.stringify(state().cells['0:0'])===before&&!page.inert);
 await open();dbl(editor().querySelector('[data-overflow-draft=primary]'));await wait();type('Texto con caja reposicionada');key('se','ArrowLeft');key('move','ArrowRight');const saved=draftLayout();tools().querySelector('[aria-label="Confirmar texto"]').click();editor().querySelector('[data-panel-accept]').click();await wait();check('Aceptar guarda texto y geometría independiente',state().cells['0:0'].html.includes('Texto con caja reposicionada')&&JSON.stringify(state().cells['0:0'].textOverflow.textLayouts.primary)===JSON.stringify(saved));
 info().querySelector('[data-overflow-preview]').click();await wait();const preview=info().querySelector('.mod-overflow-text');check('El previo usa la posición y tamaño guardados',preview.style.position==='absolute'&&Math.abs(parseFloat(preview.style.left)-saved.x*100)<.001&&Math.abs(parseFloat(preview.style.width)-saved.width*100)<.001);
 const surface=info().querySelector('.mod-overflow-surface'),s=surface.getBoundingClientRect();summary.dispatchEvent(new w.PointerEvent('pointerdown',{bubbles:true,pointerId:88,button:0,clientX:beforeButton.left,clientY:beforeButton.top}));summary.dispatchEvent(new w.PointerEvent('pointerup',{bubbles:true,pointerId:88}));check('El contenedor del previo está delante de + info y del botón de ojo',Number(w.getComputedStyle(surface).zIndex)>Number(w.getComputedStyle(summary).zIndex));
 const exported=new DOMParser().parseFromString(w.generateExportHTML(false),'text/html'),published=exported.querySelector('.mod-published .mod-overflow-text');check('Publicación conserva la geometría sin menús ni tiradores',published.style.position==='absolute'&&published.style.width===preview.style.width&&!exported.querySelector('.mod-text-geometry,.mod-editor'));
 d.body.click();await open();dbl(editor().querySelector('[data-overflow-draft=primary]'));await wait();check('Reabrir restaura exactamente la caja de texto guardada',JSON.stringify(draftLayout())===JSON.stringify(saved)&&edit().isContentEditable&&editor().querySelectorAll('.mod-text-geometry button').length===9);tools().querySelector('[aria-label="Confirmar texto"]').click();editor().querySelector('[data-panel-cancel]').click();w.undo();await wait();check('Deshacer revierte texto y geometría de + info juntos',!state().cells['0:0'].textOverflow.textLayouts&&state().cells['0:0'].html.includes('Contenido de + info'));check('El historial nunca restaura una página bloqueada',!cell().closest('[inert]')&&!d.querySelector('.mod-overflow-page-locked,[data-mod-overflow-was-inert]'));
 await open();dbl(editor().querySelector('[data-overflow-draft=primary]'));await wait();type('Borrador que no debe guardarse al cambiar de página');const previousBlock=block(),nextCanvas=d.createElement('div');nextCanvas.id='canvas';d.querySelector('#canvas').replaceWith(nextCanvas);await wait();check('Cambiar el lienzo cierra el editor sin guardar su borrador ni bloquear el Builder',!editor()&&!d.body.classList.contains('mod-overflow-isolating')&&!previousBlock.dataset.modular.includes('Borrador que no debe guardarse'));
 out.textContent=results.join('\n')+`\nTOTAL: ${results.length} / FAIL: 0`;
 }catch(e){out.textContent+='\nERROR '+e.stack;}finally{busy=false;out.dataset.complete='true';}};
document.querySelector('#regular').onclick=async()=>{document.body.classList.remove('results');out.textContent='';await setup();};
document.querySelector('#container').onclick=async()=>{document.body.classList.remove('results');out.textContent='';await setup();await open();const blur=editor().querySelector('[data-panel-field=blur]');blur.value='5';blur.dispatchEvent(new(env().w.Event)('input',{bubbles:true}));};
</script></html>
