<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pendientes automáticos de diagramas</title>
<style>body{margin:0;font:13px Arial;color:#374151}header{display:flex;gap:8px;align-items:center;padding:8px;background:#f3f4f6}button{padding:7px 11px;border:1px solid #5d428c;border-radius:6px;background:white;color:#5d428c;cursor:pointer}pre{white-space:pre-wrap;max-height:180px;overflow:auto;padding:10px;margin:0;font:12px/1.4 Consolas,monospace}pre:empty{display:none}iframe{width:100%;height:calc(100vh - 48px);border:0;display:block}body.results iframe{height:calc(100vh - 228px)}</style>
<header><strong>Prueba aislada</strong><button id="run">Verificar pendientes de diagramas</button><button id="proof">Mostrar pendiente automático</button><button id="canvas-proof">Mostrar pestaña pendiente</button></header><pre id="result" role="status"></pre><iframe id="app" title="Builder de prueba de pendientes" src="/?check=flow-checklist"></iframe>
<script type="module">
import{createFlowModel,addFlowNode,addFlowLane}from'/src/flow-model.ts';
import{getFlowHTML}from'/src/flow-block.ts';
import{isMediaFilled,syncWorkspaceAutomaticChecklist}from'/src/media-checklist.ts';
import{parseProject}from'/src/project-model.ts';
const frame=document.querySelector('#app'),out=document.querySelector('#result'),wait=(ms=340)=>new Promise(r=>setTimeout(r,ms)),env=()=>({w:frame.contentWindow,d:frame.contentDocument});let results=[],busy=false,stored='';
const check=(name,ok)=>{results.push(`${ok?'PASS':'FAIL'} ${name}`);out.textContent=results.join('\n');if(!ok)throw Error(name);};
const tab=(i=0)=>env().d.querySelectorAll('.project-tabs [role="tab"]')[i],description=(i=0)=>tab(i)?.getAttribute('aria-description')||'',taskText='Tienes pendiente agregar contenido en "Diagrama de flujo".',count=(i=0)=>description(i).split(taskText).length-1,dot=(i=0)=>tab(i)?.querySelector('.project-tab-checklist-dot');
const blocks=()=>Array.from(env().d.querySelectorAll('#canvas [data-type="diagrama_flujo"]')),editor=()=>env().d.querySelector('dialog.flow-design-editor');
async function ready(){let requested=false;for(let n=0;n<180;n++){const{w,d}=env();if(typeof w?.insertTemplate==='function'&&typeof w?.editFlowDiagram==='function'&&d?.querySelector('#canvas')){if(d.querySelector('.project-tab[data-active="true"]'))return env();const button=d.querySelector('.project-welcome .welcome-actions button');if(button&&!requested){requested=true;button.click();}}await wait(60);}throw Error('El Builder no terminó de iniciar');}
async function toggle(enabled){const{d}=env(),menu=d.querySelector('.project-menu-toggle');if(menu.getAttribute('aria-expanded')!=='true')menu.click();const button=d.querySelector('#project-file-menu [role="switch"]');if((button.getAttribute('aria-checked')==='true')!==enabled)button.click();if(menu.getAttribute('aria-expanded')==='true')menu.click();await wait();}
async function info(){const{w}=env();tab().dispatchEvent(new w.KeyboardEvent('keydown',{bubbles:true,key:'F2'}));await wait(90);return env().d.querySelector('dialog.workspace-settings');}
async function open(block){const live=env().d.getElementById(block.id)||block;env().w.editFlowDiagram(live);await wait(80);return editor();}
async function fill(block){const dialog=await open(block);dialog.querySelector('[data-shape="process"]').click();dialog.querySelector('[data-action="save"]').click();await wait();}
async function saveProject(){const{w,d}=env();w.showSaveFilePicker=async()=>({name:'Pendientes de diagramas.lmsproject',createWritable:async()=>({write:async text=>{stored=text;},close:async()=>{}})});d.querySelector('.project-name').dispatchEvent(new w.MouseEvent('dblclick',{bubbles:true}));await wait(80);const prompt=d.querySelector('dialog.project-prompt');prompt.querySelector('input').value='Pendientes de diagramas';prompt.querySelector('button[value="ok"]').click();await wait();return parseProject(stored);}
document.querySelector('#run').onclick=async()=>{if(busy)return;busy=true;results=[];out.textContent='Preparando…';document.body.classList.add('results');try{
 const{w,d}=await ready();check('Pendientes automáticos disponibles en un proyecto nuevo',!!d.querySelector('.project-tab[data-active="true"]'));
 d.querySelector('.project-tab-add').click();await wait(80);let prompt=d.querySelector('dialog.page-list-dialog');prompt.querySelector('input').value='Página 2';prompt.querySelector('button[value="ok"]').click();await wait(80);tab(0).click();await wait(80);
 w.insertTemplate('pagina_basica');w.insertTemplate('diagrama_flujo');await wait();check('Diagrama nuevo no queda pendiente antes de salir de su pestaña',count(0)===0&&!dot(0));tab(1).click();await wait();check('Cambiar de pestaña con diagrama vacío crea su pendiente en la pestaña de origen',count(0)===1&&description(0).includes('Pendiente: '+taskText)&&dot(0)?.dataset.state==='pending');check('La pestaña de destino no recibe el pendiente ajeno',count(1)===0&&!dot(1));
 tab(0).click();await wait(80);let original=blocks()[0],id=original.id;check('Diagrama vacío tiene identidad estable y conserva su botón de diseño',!!id&&!!original.querySelector('.flow-placeholder')&&!isMediaFilled(original));
 for(let n=0;n<3;n++){tab(1).click();await wait(40);tab(0).click();await wait(40);}check('Cambios repetidos de pestaña no duplican el pendiente',count()===1&&blocks()[0].id===id);original=d.getElementById(id);
 const settings=await info(),task=settings.querySelector('.workspace-task[data-automatic="true"]');check('El checklist muestra una tarea automática vinculada, no editable manualmente',task?.querySelector('input[type="text"]').value===taskText&&task.querySelector('input[type="text"]').readOnly&&task.querySelector('input[type="checkbox"]').disabled);settings.querySelector('button[value="cancel"]').click();
 let dialog=await open(original);const title=dialog.querySelector('[data-prop="title"]');title.value='Por diseñar';title.dispatchEvent(new w.Event('input',{bubbles:true}));title.dispatchEvent(new w.Event('change',{bubbles:true}));dialog.querySelector('[data-action="save"]').click();await wait();check('Cambiar solo título o ajustes del lienzo no completa el pendiente',count()===1&&description().includes('Pendiente: '+taskText)&&!!original.querySelector('.flow-placeholder'));
 dialog=await open(original);dialog.querySelector('[data-shape="decision"]').click();check('Un borrador sin guardar todavía no completa el pendiente',description().includes('Pendiente: '+taskText)&&!isMediaFilled(original));dialog.querySelector('[data-action="cancel"]').click();dialog.querySelector('[data-flow-discard]').click();await wait();check('Cancelar el borrador conserva el diagrama vacío y su pendiente',!editor()&&!isMediaFilled(original)&&count()===1);
 await fill(original);check('Guardar una figura completa la misma tarea sin duplicarla',count()===1&&description().includes('Completado: '+taskText)&&dot()?.dataset.state==='complete'&&original.id===id&&!original.querySelector('.flow-placeholder'));
 dialog=await open(original);const nodeId=JSON.parse(original.dataset.flowModel).nodes[0].id;dialog.querySelector(`[data-select-kind="node"][data-select-id="${nodeId}"]`).click();dialog.querySelector('.fde-viewport').dispatchEvent(new w.KeyboardEvent('keydown',{bubbles:true,cancelable:true,key:'Delete'}));dialog.querySelector('[data-action="save"]').click();await wait();check('Vaciar y guardar el diagrama vuelve a poner pendiente la misma tarea',count()===1&&description().includes('Pendiente: '+taskText)&&!!original.querySelector('.flow-placeholder'));
 w.undo();await wait();check('Deshacer el vaciado recupera contenido y estado completado',isMediaFilled(blocks()[0])&&description().includes('Completado: '+taskText));w.redo();await wait();check('Rehacer el vaciado recupera el estado pendiente',!isMediaFilled(blocks()[0])&&description().includes('Pendiente: '+taskText));original=blocks()[0];
 await toggle(false);w.insertTemplate('diagrama_flujo');await wait();check('Con pendientes automáticos apagados un nuevo diagrama vacío no crea tarea',blocks().length===2&&count()===1);original.querySelector('[data-duplicate-element]').click();await wait();check('Duplicar un diagrama vacío con creación apagada tampoco inventa tareas',blocks().length===3&&count()===1);
 await toggle(true);check('Reactivar tampoco crea pendientes nuevos mientras permanece en la pestaña',count()===1);tab(1).click();await wait();tab(0).click();await wait();check('Al salir detecta los diagramas vacíos sin duplicar tareas existentes',count()===3&&new Set(blocks().map(block=>block.id)).size===3&&blocks().every(block=>!!block.id));original=d.getElementById(id);await fill(original);check('Cada diagrama mantiene su propio estado de finalización',count()===3&&description().split('Completado: '+taskText).length-1===1&&dot()?.dataset.state==='pending');
 original.querySelector('[data-duplicate-element]').click();await wait();check('Duplicar un diagrama ya diseñado no crea una tarea completada innecesaria',blocks().length===4&&count()===3);
 await toggle(false);const empty=blocks().find(block=>!isMediaFilled(block)),emptyId=empty.id;w.saveHistoryState(true);empty.querySelector(':scope > .block-toolbar button[onclick*="deleteBlock"]').click();w.saveHistoryState(true);await wait();check('Eliminar un diagrama retira únicamente su pendiente vinculado',blocks().length===3&&count()===2);w.undo();await wait();check('Deshacer eliminación restaura su pendiente incluso con creación apagada',!!d.getElementById(emptyId)&&blocks().length===4&&count()===3);
 const project=await saveProject(),savedTasks=project.spaces[0].checklist.filter(item=>item.mediaId);check('Guardar el proyecto conserva identidades y estados de los diagramas',project.autoChecklist===false&&savedTasks.length===3&&savedTasks.filter(item=>item.done).length===1&&project.spaces[0].html.includes(id));check('La otra pestaña sigue libre de pendientes del diagrama',!project.spaces[1].checklist?.some(item=>item.text===taskText));
 const legacy=d.createElement('div');legacy.innerHTML=getFlowHTML();legacy.firstElementChild.removeAttribute('id');const before={id:'legacy',name:'Anterior',html:legacy.innerHTML,bg:'blanco',style:''},synced=syncWorkspaceAutomaticChecklist(before);check('Diagramas anteriores sin identidad migran al mismo sistema de pendientes',synced.checklist?.length===1&&synced.checklist[0].text===taskText&&!!synced.checklist[0].mediaId&&synced.html.includes(synced.checklist[0].mediaId));check('Volver a analizar una página guardada mantiene identidad y tarea únicas',syncWorkspaceAutomaticChecklist(synced).checklist===synced.checklist);
 const detached=d.createElement('div');detached.innerHTML=getFlowHTML();const fake=detached.firstElementChild;fake.dataset.flowModel='{malformado';check('Un modelo dañado se considera pendiente sin interrumpir el proyecto',!isMediaFilled(fake));fake.dataset.flowModel=JSON.stringify(createFlowModel());fake.querySelector('.flow-preview').innerHTML='<svg><rect width="80" height="60"/></svg>';check('Un SVG residual no completa un modelo sin contenido',!isMediaFilled(fake));const lanes=createFlowModel();addFlowLane(lanes);fake.dataset.flowModel=JSON.stringify(lanes);check('Un carril guardado cuenta como contenido igual que en el diagrama publicado',isMediaFilled(fake));
 const ghosts=d.createElement('div');ghosts.innerHTML=getFlowHTML();ghosts.firstElementChild.classList.add('sortable-ghost');check('El fantasma temporal de un arrastre no crea pendientes',!syncWorkspaceAutomaticChecklist({...before,html:ghosts.innerHTML},ghosts).checklist);
 tab(1).click();await wait(80);tab(0).click();await wait();check('Al volver a la pestaña persisten sus diagramas y tareas, sin duplicados',blocks().length===4&&count()===3&&blocks().some(block=>block.id===id));
 let dismiss=await info();dismiss.querySelector('.workspace-task[data-automatic="true"] [aria-label="Eliminar tarea"]').click();dismiss.querySelector('[value="cancel"]').click();await wait();check('Cancelar la eliminación conserva la tarea automática',count()===3);
 dismiss=await info();dismiss.querySelector('.workspace-task[data-automatic="true"] [aria-label="Eliminar tarea"]').click();dismiss.querySelector('[value="ok"]').click();await wait();check('Se puede eliminar una tarea automática del checklist',count()===2);tab(1).click();await wait();tab(0).click();await wait();check('El pendiente descartado no reaparece al cambiar de pestaña',count()===2);const dismissed=await saveProject();check('Guardar conserva el descarte automático para próximas aperturas',dismissed.spaces[0].dismissedAutomaticTasks?.includes('media:'+savedTasks[0].mediaId)&&dismissed.spaces[0].checklist.length===2);
 out.textContent=results.join('\n')+`\nTOTAL: ${results.length} / FAIL: 0`;
 }catch(error){out.textContent+='\nERROR '+error.stack;}finally{busy=false;}};
document.querySelector('#proof').onclick=async()=>{await ready();env().d.querySelector('dialog.workspace-settings [value="cancel"]')?.click();tab(0).click();await wait(80);document.body.classList.remove('results');out.textContent='';await info();};
document.querySelector('#canvas-proof').onclick=async()=>{await ready();env().d.querySelector('dialog.workspace-settings [value="cancel"]')?.click();tab(0).click();await wait(80);const blank=blocks().find(block=>!isMediaFilled(block));blank?.scrollIntoView({block:'center'});document.body.classList.remove('results');out.textContent='';};
</script></html>
