<!doctype html><meta charset="utf-8"><button id="run">Probar estilos recuperados</button><pre id="result"></pre><iframe id="app" src="/?editor=exercise" style="width:100%;height:800px"></iframe><script type="module">
run.onclick=async()=>{const w=app.contentWindow,d=w.document,out=result;out.textContent='';let count=0;const check=(ok,label)=>{out.textContent+=(ok?'PASS ':'FAIL ')+label+'\n';if(!ok)throw Error(label);count++;};try{const canvas=d.querySelector('#canvas');canvas.replaceChildren();w.insertTemplate('ejemplo_contenido');let block=canvas.querySelector('[data-type=pestanas]');const content=block.querySelector('.tabs-panes-wrapper').textContent;block.querySelectorAll('[data-tabs-style-tool]').forEach(e=>e.remove());w.initNestedDropzones();check(block.querySelectorAll('[data-tabs-style-tool]').length===1,'Control recuperado en pestañas antiguas');w.initNestedDropzones();check(block.querySelectorAll('[data-tabs-style-tool]').length===1,'Reinicialización sin duplicar controles');const open=()=>block.querySelector('[data-tabs-style-tool]').click();open();check(d.querySelectorAll('[data-tabs-style-choice] svg').length===4,'Cuatro miniaturas en el selector');for(const [id,color,solid]of [['line-orange','rgb(255, 89, 0)',false],['line-purple','rgb(93, 66, 140)',false],['purple','rgb(93, 66, 140)',true],['orange','rgb(255, 89, 0)',true]]){open();d.querySelector('[data-tabs-style-choice="'+id+'"]').click();const active=block.querySelector('.tab-buttons-container .border-anahuac-orange');check((solid?active.style.backgroundColor:active.style.color)===color,'Aplicación de '+id);if(solid)check(block.querySelector('.tabs-panes-wrapper').style.border.includes('1px'),'Contenido unido a pestaña en '+id);}const tab=block.querySelector('.tab-buttons-container button');tab.click();check(tab.style.backgroundColor==='rgb(255, 89, 0)','Estilo conservado al cambiar pestaña');check(block.querySelector('.tabs-panes-wrapper').textContent===content,'Contenido multimedia intacto');const saved=block.outerHTML;block.outerHTML=saved;w.initNestedDropzones();block=canvas.querySelector('[data-type=pestanas]');open();check(!d.querySelector('#tabs-style-popover').hidden,'Selector funciona después de restaurar');const exported=w.generateExportHTML(false);check(exported.includes('data-tabs-style="orange"'),'Estilo incluido en exportación');out.textContent+='TOTAL '+count;canvas.querySelectorAll(':scope>*').forEach(page=>page.querySelectorAll('.lms-element').forEach(el=>{if(el!==block&&!el.contains(block))el.remove();}));block.scrollIntoView();open();}catch(e){out.textContent+='ERROR '+e.message;}};
</script>
