<!doctype html><meta charset="utf-8"><button id="run">Probar imagen editorial</button><pre id="results"></pre><iframe id="app" src="/?editor=exercise" style="width:100%;height:850px"></iframe><script type="module">
run.onclick=async()=>{const w=app.contentWindow,d=w.document,wait=()=>new Promise(r=>setTimeout(r,180)),out=document.querySelector('#results');let n=0;const check=(ok,label)=>{out.textContent+=(ok?'PASS ':'FAIL ')+label+'\n';if(!ok)throw Error(label);n++;};try{
 const canvas=d.querySelector('#canvas');canvas.innerHTML='<div class="lms-element"><div class="editable-text"><p>Texto anterior <img class="editorial-image w-1/2" src="/imagenes/titulos/Fondo_naranja_escolar.png"> Texto posterior</p></div></div>';const img=canvas.querySelector('img');await img.decode();img.click();d.querySelector('#image-toolbar [title="Recorte libre"]').click();await wait();check(!!d.querySelector('#image-crop-editor'),'Abre el mismo recorte libre');check(d.querySelectorAll('[data-crop-handle]').length===9,'Ocho mediadores y desplazamiento');d.querySelector('[data-crop-apply]').click();await wait();const block=canvas.querySelector('[data-editorial-frame]');check(!!block.dataset.imageCrop,'Recorte persistido');img.click();d.querySelector('#image-toolbar [title="Texto sobre la imagen"]').click();await wait();const text=block.querySelector('.image-overlay-text');check(!!text,'Texto sobre imagen insertado');text.click();await wait();check(text.isContentEditable,'Texto usa editor dinámico');text.textContent='Texto sobre la imagen';text.dispatchEvent(new w.Event('input',{bubbles:true}));w.selectedEditorialImage=img;w.setImageSize('w-3/4');w.setImageStyle('center');check(block.style.width==='75%'&&block.style.margin.includes('auto'),'Tamaño y alineación del conjunto');w.rotateEditorialImage(90);check(img.dataset.rotation==='90','Rotación conserva recorte');const clone=d.createElement('div');clone.innerHTML=canvas.innerHTML;check(!!clone.querySelector('p [data-editorial-frame] .image-overlay-text'),'Imagen y texto conservados al serializar dentro de párrafo');check(canvas.textContent.includes('Texto anterior')&&canvas.textContent.includes('Texto posterior'),'Texto circundante preservado');out.textContent+='TOTAL '+n;
 }catch(e){out.textContent+='ERROR '+e.message;}};
</script>
