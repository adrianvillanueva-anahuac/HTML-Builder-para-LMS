<!doctype html><meta charset="utf-8"><button id="run">Probar selección y nombre</button><pre id="result"></pre><iframe id="app" src="/?editor=exercise" style="width:100%;height:800px"></iframe><script type="module">
run.onclick=()=>{const w=app.contentWindow,d=w.document,out=result;out.textContent='';let n=0;const check=(ok,label)=>{out.textContent+=(ok?'PASS ':'FAIL ')+label+'\n';if(!ok)throw Error(label);n++;};try{const canvas=d.querySelector('#canvas');canvas.replaceChildren();w.insertTemplate('pestanas');const block=canvas.querySelector('[data-type=pestanas]'),buttons=block.querySelector('.tab-buttons-container').children,first=buttons[0].querySelector('.editable-text'),second=buttons[1].querySelector('.editable-text');const click=el=>{el.dispatchEvent(new w.PointerEvent('pointerdown',{bubbles:true}));el.click();};click(second);check(buttons[1].classList.contains('border-anahuac-orange'),'Primer clic selecciona la pestaña inactiva');check(!second.isContentEditable&&!w.currentEditableText,'Primer clic no activa edición');check(second.textContent==='Pestaña 2','Primer clic conserva el nombre');check(block.querySelectorAll('.lms-tab-pane')[1].style.display==='flex','Primer clic muestra contenido correspondiente');click(second);check(second.isContentEditable&&w.currentEditableText===second,'Segundo clic edita el nombre seleccionado');check(!d.querySelector('#rtf-toolbar').classList.contains('hidden'),'Herramienta de texto disponible');check(buttons[1].classList.contains('border-anahuac-orange'),'Edición conserva pestaña seleccionada');click(first);check(!second.isContentEditable&&!first.isContentEditable,'Cambiar de pestaña cierra edición sin editar el nuevo nombre');check(buttons[0].classList.contains('border-anahuac-orange'),'Cambio a otra pestaña funciona');click(first);check(first.isContentEditable,'Clic posterior edita el nuevo nombre activo');out.textContent+='TOTAL '+n;}catch(e){out.textContent+='ERROR '+e.message;}};
</script>
