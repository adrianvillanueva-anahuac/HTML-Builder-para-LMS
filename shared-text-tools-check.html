<!doctype html><html lang="es"><meta charset="utf-8"><title>Texto compartido del Builder · verificación</title>
<style>body{margin:0;font:13px Arial;color:#374151}header{display:flex;gap:10px;align-items:center;padding:8px;background:#f7f7fb}button{padding:7px 10px}pre{max-height:160px;overflow:auto;white-space:pre-wrap;margin:0;padding:10px}pre:empty{display:none}iframe{width:100%;height:calc(100vh - 48px);border:0}body.results iframe{height:calc(100vh - 228px)}</style>
<header><strong>Prueba aislada · texto</strong><button id="run">Verificar barra compartida</button><button id="badge-run">Verificar texto del perímetro</button><button id="proof">Mostrar barra completa</button></header><pre id="result" role="status"></pre><iframe id="app" title="Builder de prueba" src="/?check=shared-text"></iframe>
<script type="module">
import{createFlowModel,addFlowNode}from'/src/flow-model.ts';import{getFlowHTML}from'/src/flow-block.ts';import{createModular,activateAllCells}from'/src/modular-model.ts';
const frame=document.querySelector('#app'),out=document.querySelector('#result'),wait=(ms=100)=>new Promise(r=>setTimeout(r,ms));let results=[],block,node,busy=false;
const env=()=>({w:frame.contentWindow,d:frame.contentDocument});const check=(label,ok)=>{results.push((ok?'PASS ':'FAIL ')+label);out.textContent=results.join('\n');if(!ok)throw Error(label);};
async function ready(){for(let i=0;i<150;i++){const{w,d}=env();if(w?.editFlowDiagram&&d?.querySelector('#canvas')){const create=d.querySelector('.project-welcome .welcome-actions button');if(create){create.click();await wait();}return env();}await wait(50);}throw Error('Builder no disponible');}
async function setup(){const{w,d}=await ready();d.querySelector('.flow-design-editor [data-action=cancel]')?.click();d.querySelector('[data-flow-discard]')?.click();d.querySelector('#canvas').replaceChildren();w.insertTemplate('pagina_basica');w.insertTemplate('diagrama_flujo');block=d.querySelector('#canvas [data-type=diagrama_flujo]');const m=createFlowModel();node=addFlowNode(m,'process');Object.assign(node,{x:290,y:280,width:560,height:350,text:'Texto del diagrama'});block.dataset.flowModel=JSON.stringify(m);w.initNestedDropzones();return env();}
const dialog=()=>env().d.querySelector('.flow-design-editor'),edit=()=>env().d.querySelector('.fde-rich-edit'),toolbar=()=>env().d.querySelector('#rtf-toolbar');
function all(){const{w,d}=env(),range=d.createRange();range.selectNodeContents(edit());const sel=w.getSelection();sel.removeAllRanges();sel.addRange(range);w.lastKnownRange=range.cloneRange();edit().focus();}
function caretEnd(){const{w,d}=env(),range=d.createRange();range.selectNodeContents(edit());range.collapse(false);w.getSelection().removeAllRanges();w.getSelection().addRange(range);w.lastKnownRange=range.cloneRange();edit().focus();}
async function start(){const{w}=env();w.editFlowDiagram(block);await wait();dialog().querySelector(`[data-flow-node="${node.id}"]`).dispatchEvent(new w.MouseEvent('dblclick',{bubbles:true}));await wait();}
document.querySelector('#run').onclick=async()=>{if(busy)return;busy=true;results=[];document.body.classList.add('results');try{
 const{w,d}=await setup(),count=toolbar().querySelectorAll('button').length;await start();
 check('Existe una sola barra: el Builder la presenta dentro del diálogo',d.querySelectorAll('#rtf-toolbar').length===1&&toolbar().closest('.flow-design-editor')===dialog()&&!d.querySelector('.fde-rich-toolbar'));
 check('Todos los botones originales siguen disponibles, sin barra reducida paralela',toolbar().querySelectorAll('button').length===count+3&&toolbar().querySelector('[title="Insertar Imagen Editorial"]')&&toolbar().querySelector('[title="Insertar Ícono Embebido"]'));
 check('Menú íntegro: siete tipos de lista y sus tres colores',Array.from(toolbar().querySelectorAll('button')).filter(b=>['1.','a.','•','○','▶','+','-'].includes(b.textContent.trim())).length===7&&toolbar().querySelectorAll('[title^="Viñetas"]').length===3);
 let formatCalls=0,listCalls=0,imageCalls=0;const originalFormat=w.applyTextFormat,originalList=w.applyList,originalImage=w.insertDOMImage;
 w.applyTextFormat=(...args)=>{formatCalls++;return originalFormat(...args);};w.applyList=(...args)=>{listCalls++;return originalList(...args);};w.insertDOMImage=(...args)=>{imageCalls++;return originalImage(...args);};
 all();toolbar().querySelector('[title="Título"]').click();await wait();check('T1 ejecuta la función principal y conserva tamaño y fuente',formatCalls===1&&edit().querySelector('[style*="30px"]')&&edit().querySelector('[style*="Zilla"]'));
 all();toolbar().querySelector('[title="Negrita"]').click();toolbar().querySelector('[title="Cursiva"]').click();toolbar().querySelector('[title="Subrayado"]').click();toolbar().querySelector('[title="Morado Anáhuac"]').click();await wait();check('Formato de selección y colores usan los controles React originales',edit().innerHTML.includes('#5d428c')||edit().innerHTML.includes('rgb(93, 66, 140)'));
 edit().textContent='Primero\nSegundo';edit().dispatchEvent(new w.Event('input',{bubbles:true}));all();Array.from(toolbar().querySelectorAll('button')).find(b=>b.textContent.trim()==='a.').click();await wait();toolbar().querySelector('[title="Viñetas Moradas"]').click();await wait();check('Lista alfabética y color se aplican mediante las funciones compartidas',listCalls===1&&edit().querySelector('ol.list-letters.list-color-purple'));
 all();toolbar().querySelector('[aria-label="Agregar hipervínculo"]').click();await wait();let linkDialog=d.querySelector('.text-link-dialog');check('Hipervínculo abre el diálogo completo del Builder sobre el editor',linkDialog?.open);linkDialog.querySelector('input').value='https://example.com/diagrama';linkDialog.querySelector('[value=ok]').click();await wait();check('Enlace aplicado con formato y destino seguros',edit().querySelector('a[href="https://example.com/diagrama"]')?.rel.includes('noopener'));
 let anchor=edit().querySelector('a');anchor.dispatchEvent(new w.PointerEvent('pointerover',{bubbles:true}));await wait();check('Rollover de enlace conserva reemplazo, quitar, fuentes y colores',!d.querySelector('#text-link-tools').hidden&&d.querySelector('#text-link-tools [data-link-edit]')&&d.querySelectorAll('#text-link-tools [data-link-font]').length===3);d.querySelector('#text-link-tools [data-link-color="#ff5900"]').click();await wait();check('El color de enlace se actualiza dentro del mismo editor',anchor.style.color==='rgb(255, 89, 0)');
 caretEnd();toolbar().querySelector('[title="Insertar Ícono Embebido"]').click();await wait();const icon=edit().querySelector('.editable-icon');check('Insertar icono conserva el elemento editable y su tamaño original',icon?.textContent==='star');icon.dispatchEvent(new w.MouseEvent('dblclick',{bubbles:true}));await wait();check('El catálogo original de iconos está disponible dentro del diálogo',w.getComputedStyle(d.querySelector('#icon-modal')).display!=='none'&&dialog().contains(d.querySelector('#icon-modal'))&&d.querySelectorAll('#icon-grid span').length>50);Array.from(d.querySelectorAll('#icon-grid span')).find(el=>el.textContent==='school').click();await wait();check('Elegir un icono del catálogo actualiza el contenido sin terminar la edición',edit()?.querySelector('.editable-icon').textContent==='school');
 caretEnd();const prompt=w.prompt;w.prompt=()=>location.origin+'/imagenes/titulos/Fondo_naranja_escolar.png';toolbar().querySelector('[title="Insertar Imagen Editorial"]').click();w.prompt=prompt;await wait();const img=edit().querySelector('.editorial-image');if(!img.complete)await new Promise(r=>img.onload=r);check('Insertar imagen llama a la función del Builder y conserva la imagen',imageCalls===1&&img.naturalWidth>0);img.click();await wait();check('Menú editorial completo accesible dentro del diagrama',dialog().contains(d.querySelector('#image-toolbar'))&&!d.querySelector('#image-toolbar').classList.contains('hidden')&&d.querySelector('#image-toolbar [title="Rotar Imagen"]'));
 w.setImageSize('w-1/4');w.setEditorialImageAspect('16/9');w.setEditorialImageRadius('12px');w.rotateEditorialImage(90);await wait();check('Los menús editoriales modifican escala, recorte, radio y rotación',img.classList.contains('w-1/4')&&img.style.aspectRatio==='16 / 9'&&img.style.borderRadius==='12px'&&img.style.transform.includes('90deg'));
 toolbar().querySelector('[aria-label="Terminar texto"]').click();await wait();check('Al salir se conservan listas, enlaces, icono e imagen, no texto aplanado',dialog().querySelector('foreignObject .list-letters')&&dialog().querySelector('foreignObject a')&&dialog().querySelector('foreignObject .material-symbols-outlined')&&dialog().querySelector('foreignObject img'));
 dialog().querySelector('[data-action=undo]').click();check('Deshacer revierte toda la edición de texto sin cambiar el bloque original',!dialog().querySelector('foreignObject'));dialog().querySelector('[data-action=redo]').click();check('Rehacer recupera la estructura y los recursos completos',dialog().querySelector('foreignObject .list-letters')&&dialog().querySelector('foreignObject img'));
 dialog().querySelector('[data-action=save]').click();await wait();const saved=JSON.parse(block.dataset.flowModel);check('Guardar persiste estructura completa sin manejadores ni scripts',saved.nodes[0].richText&&JSON.stringify(saved.nodes[0].richText).includes('list-letters')&&!JSON.stringify(saved.nodes[0].richText).includes('onclick'));
 check('Cerrar restaura una sola barra principal y deja ocultas las herramientas',d.querySelectorAll('#rtf-toolbar').length===1&&!toolbar().closest('dialog')&&toolbar().classList.contains('hidden'));
 await start();check('Reabrir conserva la misma lista, color, destino y recursos insertados',edit().querySelector('.list-letters.list-color-purple')&&edit().querySelector('a[href="https://example.com/diagrama"]')&&edit().querySelector('.editable-icon').textContent==='school'&&edit().querySelector('img').classList.contains('w-1/4'));
 d.querySelector('[aria-label="Terminar texto"]').click();dialog().querySelector('[data-action=save]').click();await wait();const exported=new DOMParser().parseFromString(w.generateExportHTML(false),'text/html');check('Publicación conserva el contenido y no publica las herramientas prestadas',exported.querySelector('.flow-published foreignObject .list-letters')&&exported.querySelector('.flow-published foreignObject img')&&!exported.querySelector('#rtf-toolbar,.fde-rich-box'));
 w.applyTextFormat=originalFormat;w.applyList=originalList;w.insertDOMImage=originalImage;const paragraph=d.querySelector('#canvas p.editable-text')||d.querySelector('#canvas .editable-text');paragraph.dispatchEvent(new w.MouseEvent('dblclick',{bubbles:true}));check('La barra vuelve a editar normalmente el contenido del Builder principal',w.currentEditableText===paragraph&&!toolbar().classList.contains('hidden')&&!toolbar().closest('dialog'));paragraph.blur();out.textContent=results.join('\n')+`\nTOTAL: ${results.length} / FAIL: 0`;
 }catch(error){out.textContent+='\nERROR '+error.stack;}finally{busy=false;}};
document.querySelector('#badge-run').onclick=async()=>{if(busy)return;busy=true;results=[];document.body.classList.add('results');try{
 const{w,d}=await ready();d.querySelector('#canvas').replaceChildren();const m=createModular(1,3);activateAllCells(m);for(const [index,cell]of Object.values(m.cells).entries())cell.badge={shape:['circle','rounded','hexagon'][index],text:'1',scale:[.5,1,2][index],color:'#5d428c',position:{edge:'top',offset:.5}};const section=d.createElement('section');section.dataset.type='tabla_modular';section.className='lms-element is-rendered modular-table';section.dataset.modular=JSON.stringify(m);d.querySelector('#canvas').append(section);w.initNestedDropzones();await wait();
 for(const badge of section.querySelectorAll('.mod-badge')){const text=badge.querySelector('.mod-badge-text'),a=text.getBoundingClientRect(),b=badge.getBoundingClientRect(),font=badge.style.fontSize;check(badge.style.width+': centrado sin barras de desplazamiento ni reducción de letra',w.getComputedStyle(text).overflow==='visible'&&w.getComputedStyle(text).fontSize===font&&Math.abs(a.left+a.width/2-b.left-b.width/2)<1&&Math.abs(a.top+a.height/2-b.top-b.height/2)<1);text.dispatchEvent(new w.MouseEvent('dblclick',{bubbles:true}));await wait();check('Doble clic mantiene centrado y tipografía sin scrollbars',w.getComputedStyle(text).overflow==='visible'&&w.getComputedStyle(text).fontSize===font);text.blur();}
 const before=Array.from(section.querySelectorAll('.mod-badge')).map(b=>b.style.fontSize),exported=new DOMParser().parseFromString(w.generateExportHTML(false),'text/html');check('HTML publicado también elimina scrollbars y conserva los tamaños originales',Array.from(exported.querySelectorAll('.mod-badge')).every((b,i)=>b.style.fontSize===before[i]&&b.querySelector('.mod-badge-text').style.overflow==='visible'));out.textContent=results.join('\n')+`\nTOTAL: ${results.length} / FAIL: 0`;
 }catch(error){out.textContent+='\nERROR '+error.stack;}finally{busy=false;}};
document.querySelector('#proof').onclick=async()=>{await setup();document.body.classList.remove('results');out.textContent='';await start();};
</script></html>
