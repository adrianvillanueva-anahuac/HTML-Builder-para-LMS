<!doctype html><meta charset="utf-8"><button id="run">Probar plantilla</button><pre id="results"></pre><iframe id="app" src="/" style="width:100%;height:820px"></iframe><script type="module">
run.onclick=async()=>{const w=app.contentWindow,d=w.document,out=results;out.textContent='';const check=(ok,label)=>{out.textContent+=(ok?'PASS ':'FAIL ')+label+'\n';if(!ok)throw Error(label);};try{check(!!d.querySelector('#catalog-pages [data-type=ejemplo_contenido]'),'Plantilla disponible en catálogo');const canvas=d.querySelector('#canvas');canvas.replaceChildren();w.insertTemplate('ejemplo_contenido');const first=canvas.firstElementChild;check(first.textContent.includes('Ejemplo de título')&&first.textContent.includes('Elementos interactivos'),'Títulos y contenido capturados');check([...first.querySelectorAll('input[type=range]')].some(field=>field.value==='91'),'Escala de imagen original conservada');check(first.querySelectorAll('.flipcard-item').length===3,'Tres tarjetas conservadas');check(!!first.querySelector('.modular-table'),'Tabla modular conservada');check(first.querySelectorAll('iframe').length===2,'YouTube y Sketchfab conservados');check(!!first.querySelector('[data-type=ejercicio_descargable]'),'Ejercicio descargable conservado');check(first.querySelector('.lms-dropzone').dataset.sortableActive==='true','Página editable y arrastrable');w.insertTemplate('ejemplo_contenido');const ids=[...canvas.querySelectorAll('[id]')].map(e=>e.id);check(new Set(ids).size===ids.length,'Dos inserciones sin identificadores duplicados');const second=canvas.lastElementChild;const buttons=[...second.querySelectorAll('.tab-btn,.lms-tab-btn,[onclick*=switchLmsTab]')];check(second.querySelectorAll('.lms-tab-pane').length===3,'Tres pestañas conservadas');const exported=w.generateExportHTML(false);check(!!exported&&exported.includes('Ejemplo de título'),'Página exportable con ejercicio');second.remove();out.textContent+='TOTAL 11';}catch(e){out.textContent+='ERROR '+e.message;}};
</script>
