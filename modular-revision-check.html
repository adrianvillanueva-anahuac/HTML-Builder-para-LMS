<!doctype html><html lang="es"><meta charset="utf-8"><title>Formato, selección y conectores independientes</title>
<style>body{margin:0;font:13px Arial}header{padding:8px;display:flex;gap:8px;align-items:center;background:#f7f7fb}button{padding:7px}pre{max-height:160px;white-space:pre-wrap;overflow:auto;margin:0}pre:empty{display:none}iframe{width:100%;height:calc(100vh - 48px);border:0}body.results iframe{height:calc(100vh - 210px)}</style>
<header><strong>Prueba aislada · revisión modular</strong><button id="run">Verificar correcciones</button><button id="proof">Mostrar ejemplo</button><button id="read">Leer estado</button></header><pre id="result"></pre><iframe id="app" title="Builder de prueba" src="/?check=modular-revision"></iframe>
<script type="module">
import{createModular,activateAllCells,createModularConnection}from'/src/modular-model.ts';import{createBadge}from'/src/modular-badges-model.ts';import{normalizeModularOverflow}from'/src/modular-overflow-model.ts';import{addModularTextBox}from'/src/modular-text-model.ts';
const frame=document.querySelector('#app'),out=document.querySelector('#result'),wait=(ms=160)=>new Promise(r=>setTimeout(r,ms));let results=[];
const env=()=>({w:frame.contentWindow,d:frame.contentDocument}),block=()=>env().d.querySelector('#canvas .modular-table'),cell=()=>block().querySelector('[data-cell="0:0"]'),state=()=>JSON.parse(block().dataset.modular),info=()=>cell().querySelector('.mod-overflow-info'),editor=()=>env().d.querySelector('.mod-overflow-editor'),toolbar=()=>env().d.querySelector('#rtf-toolbar'),check=(name,ok)=>{results.push((ok?'PASS ':'FAIL ')+name);out.textContent=results.join('\n');if(!ok)throw Error(name);};
async function setup(){for(let i=0;i<200;i++){const{w,d}=env();if(w?.initNestedDropzones&&d?.querySelector('#canvas')){d.querySelector('.project-welcome .welcome-actions button')?.click();await wait();const canvas=d.querySelector('#canvas');canvas.replaceChildren();const m=createModular(2,2);m.rows=[220,160];activateAllCells(m);m.cells['0:0'].html='Hola prueba';m.cells['0:0'].textOverflow=normalizeModularOverflow({enabled:true,boxIds:['primary']},['primary']);m.cells['0:0'].badge={...createBadge('rounded'),text:'Figura ajustable'};const extra=addModularTextBox(m.cells['0:0']);extra.document={tag:'div',children:[{tag:'#text',text:'Segunda caja'}]};m.cells['0:0'].textOverflow.boxIds.push(extra.id);m.cells['0:1'].html='Conectores independientes';m.cells['1:0'].html='Eje horizontal';m.cells['1:1'].html='Destino';m.connections=[createModularConnection('0:0','0:1'),createModularConnection('0:0','1:0')];const page=d.createElement('div');page.className='relative lms-element is-rendered';page.innerHTML='<div class="lms-dropzone bg-white" style="padding:35px;min-height:650px;border-radius:14px"><h2 class="editable-text" style="font:28px Georgia;color:#ff5900;text-align:center;margin:5px 0 35px">Texto, figuras y conectores</h2><section class="lms-element is-rendered modular-table" data-type="tabla_modular"></section></div>';page.querySelector('section').dataset.modular=JSON.stringify(m);canvas.append(page);w.checkEmptyState?.();w.initNestedDropzones();await wait(400);await d.fonts.ready;w.saveHistoryState(true);return env();}await wait(50);}throw Error('Builder no disponible');}
function dbl(node){node.dispatchEvent(new(env().w.MouseEvent)('dblclick',{bubbles:true}));}
async function open(){info().querySelector('summary').focus();dbl(info().querySelector('summary'));await wait();}
function start(id='primary'){const text=editor().querySelector(`[data-overflow-draft="${id}"]`);dbl(text);const{w,d}=env(),range=d.createRange();range.selectNodeContents(text);range.collapse(false);w.getSelection().removeAllRanges();w.getSelection().addRange(range);text.focus();return text;}
function edges(from='0:0',to='0:1'){return[...block().querySelectorAll('.mod-edge')].filter(edge=>edge.dataset.from===from&&edge.dataset.to===to);}
function menu(edge=edges()[0]){edge.querySelector('button').click();return env().d.querySelector('.mod-connector-popover');}
function count(action){env().d.querySelector(`[data-edge-count=${action}]`).click();}
document.querySelector('#run').onclick=async()=>{results=[];out.removeAttribute('data-complete');document.body.classList.add('results');try{const{w,d}=await setup();
check('No se selecciona texto ni iconos fuera de edición',w.getComputedStyle(cell().querySelector('.mod-text')).userSelect==='none'&&w.getComputedStyle(block().querySelector('.block-toolbar button')).userSelect==='none');const denied=new w.Event('selectstart',{bubbles:true,cancelable:true});cell().dispatchEvent(denied);check('El inicio de selección accidental queda bloqueado',denied.defaultPrevented);check('Área sensible sobresale veinte píxeles sobre los rectángulos',w.getComputedStyle(block()).paddingTop==='20px'&&w.getComputedStyle(block().querySelector('.mod-grid'),'::before').height==='20px');
await open();check('Estilo utiliza una brocha',editor().querySelector('.mod-overflow-design-menu summary .material-symbols-outlined').textContent==='brush');let text=start();await wait();check('Texto en edición sí permite selección',w.getComputedStyle(text).userSelect==='text');const allowed=new w.Event('selectstart',{bubbles:true,cancelable:true});text.dispatchEvent(allowed);check('No bloquea la selección dentro de la caja editable',!allowed.defaultPrevented);w.applyTextFormat('titulo');await wait();check('Título se aplica a la raíz del borrador sin seleccionar palabras',w.getComputedStyle(text).fontSize==='30px');toolbar().querySelector('[aria-label="Confirmar texto"]').click();editor().querySelector('[data-panel-accept]').click();await wait();check('Aceptar conserva tamaño, peso y fuente del título',state().cells['0:0'].textStyle['font-size']==='30px'&&state().cells['0:0'].textStyle['font-family'].includes('Zilla Slab')&&state().cells['0:0'].textStyle['font-weight']==='bold');info().querySelector('[data-overflow-preview]').click();await wait();check('El previo también conserva el título',w.getComputedStyle(info().querySelector('[data-overflow-source=primary]')).fontSize==='30px');
await open();text=start();await wait();check('Reabrir conserva el formato completo',w.getComputedStyle(text).fontSize==='30px');const range=d.createRange();range.selectNodeContents(text);w.getSelection().removeAllRanges();w.getSelection().addRange(range);d.execCommand('fontName',false,'Lato');d.execCommand('italic',false);toolbar().querySelector('[aria-label="Confirmar texto"]').click();editor().querySelector('[data-panel-accept]').click();await wait();check('También conserva fuentes y cursiva de una selección',state().cells['0:0'].html.includes('Lato')&&/<i|italic/.test(state().cells['0:0'].html));
const extraId=state().cells['0:0'].textBoxes[0].id;await open();text=start(extraId);await wait();w.applyTextFormat('subtitulo');toolbar().querySelector('[aria-label="Confirmar texto"]').click();editor().querySelector('[data-panel-accept]').click();await wait();check('Las cajas adicionales conservan su propio estilo',state().cells['0:0'].textBoxes[0].document.style['font-size']==='20px');
let panel=menu();check('Cantidad y distribución usan el mismo menú contextual',!!panel.querySelector('[aria-label="Cantidad y distribución"]'));count('add');await wait();count('add');await wait();check('Agregar crea tres conectores con identidad independiente',edges().length===3&&new Set(edges().map(edge=>edge.dataset.edgeId)).size===3);count('negative');await wait();const group=state().connections.filter(e=>e.to==='0:1');check('Distribuir hacia arriba parte del centro y separa equitativamente',group[0].offset===0&&group[1].offset<0&&Math.abs(group[2].offset-2*group[1].offset)<.001);count('positive');await wait();check('También distribuye del centro hacia abajo',state().connections.filter(e=>e.to==='0:1').every(e=>e.offset>=0));d.body.click();menu(edges()[1]).querySelector('[data-edge-field=fill][data-value="#ff5900"]').click();check('Cada conector conserva su estilo independiente',state().connections.filter(e=>e.to==='0:1').filter(e=>e.fill==='#ff5900').length===1);count('remove');await wait();check('Quitar elimina solo un conector del par',edges().length===2&&edges('0:0','1:0').length===1);
d.body.click();menu(edges('0:0','1:0')[0]);count('add');await wait();count('negative');await wait();check('Conectores verticales se distribuyen en el eje izquierda/derecha',env().d.querySelector('[aria-label="Distribuir del centro hacia la izquierda"]')&&state().connections.filter(e=>e.to==='1:0')[1].offset<0);d.body.click();
const beforeDrag=JSON.stringify(state().connections);const edge=edges()[1],id=edge.dataset.edgeId,initial=state().connections.find(e=>e.id===id).offset,beforeSibling=state().connections.find(e=>e.to==='0:1'&&e.id!==id).offset,svg=edge.querySelector('svg'),r=svg.getBoundingClientRect();edge.setPointerCapture=()=>{};edge.hasPointerCapture=()=>false;const fire=(target,type,x,y)=>target.dispatchEvent(new w.PointerEvent(type,{bubbles:true,cancelable:true,pointerId:991,button:0,clientX:x,clientY:y}));fire(svg,'pointerdown',r.left+3,r.top+12);await wait(290);fire(d,'pointermove',r.left+3,r.top-20);fire(d,'pointerup',r.left+3,r.top-20);check('Clic sostenido reposiciona solo ese conector en su eje',state().connections.find(e=>e.id===id).offset!==initial&&state().connections.find(e=>e.to==='0:1'&&e.id!==id).offset===beforeSibling);
const afterDrag=JSON.stringify(state().connections);w.undo();await wait();check('Deshacer restaura exactamente todos los conectores antes del arrastre',JSON.stringify(state().connections)===beforeDrag);w.redo();await wait();check('Rehacer recupera solamente el desplazamiento del conector',JSON.stringify(state().connections)===afterDrag);
const width=cell().querySelector('[data-badge-width]'),height=cell().querySelector('[data-badge-height]');check('Figura redondeada tiene sliders independientes de alto y ancho',width?.type==='range'&&height?.type==='range');width.value=String(cell().clientWidth);width.dispatchEvent(new w.Event('input',{bubbles:true}));height.value='95';height.dispatchEvent(new w.Event('input',{bubbles:true}));await wait();const badge=cell().querySelector('.mod-badge'),br=badge.getBoundingClientRect(),cr=cell().getBoundingClientRect();check('Ancho y alto se aplican sin invadir otra casilla',Math.abs(br.height-95)<1&&br.left>=cr.left-1&&br.right<=cr.right+1);check('Las dimensiones quedan guardadas',state().cells['0:0'].badge.height===95&&state().cells['0:0'].badge.width>96);
const exported=new DOMParser().parseFromString(w.generateExportHTML(false),'text/html');check('Publicación conserva todos los conectores sin botones de edición',exported.querySelectorAll('.mod-edge svg').length===state().connections.length&&!exported.querySelector('[data-edge-count]'));check('Publicación conserva formato de + info y tamaño de la figura',exported.querySelector('.mod-text').style.fontSize==='30px'&&exported.querySelector('.mod-badge').style.height==='95px');check('Publicación no incorpora el espacio sensible del editor',!exported.querySelector('.mod-published').style.paddingTop||exported.querySelector('.mod-published').style.paddingTop==='0px');
check('El bloqueo de selección pertenece al Builder, no a la vista del alumno',!exported.body.classList.contains('builder-selection-guard'));
frame.style.width='760px';await wait(400);const narrowBadge=cell().querySelector('.mod-badge').getBoundingClientRect(),narrowCell=cell().getBoundingClientRect();check('La figura se adapta al reducir el lienzo sin salir de su casilla',narrowBadge.left>=narrowCell.left-1&&narrowBadge.right<=narrowCell.right+1&&Math.abs(narrowBadge.height-95)<1);frame.style.width='100%';await wait(250);
out.textContent=results.join('\n')+`\nTOTAL ${results.length} / FAIL 0`;
}catch(e){out.textContent+='\nERROR '+e.stack;}finally{out.dataset.complete='true';}};
document.querySelector('#proof').onclick=async()=>{out.textContent='';document.body.classList.remove('results');await setup();menu();count('add');count('add');count('negative');};
document.querySelector('#read').onclick=()=>out.textContent=JSON.stringify({model:state(),selection:env().w.getSelection().toString(),editing:!!env().w.currentEditableText?.isContentEditable},null,2);
</script></html>
