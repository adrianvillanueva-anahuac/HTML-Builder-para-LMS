<!doctype html><html lang="es"><meta charset="utf-8"><title>Selección múltiple</title><body style="font:14px Arial"><h1>Selección múltiple: comprobaciones</h1><button id="run" disabled>Probar selección</button><pre id="result">Cargando…</pre><iframe id="editor" src="/" style="width:1400px;height:720px;border:1px solid #ddd"></iframe><script type="module">
import {getPaginaBasicaHTML,getParrafoBasicoHTML,getCajaTextoHTML} from '/src/templates.ts';
const frame=document.querySelector('#editor'),run=document.querySelector('#run'),result=document.querySelector('#result');
const wait=ms=>new Promise(r=>setTimeout(r,ms));frame.onload=()=>run.disabled=false;
run.onclick=async()=>{run.disabled=true;result.textContent='';const check=(ok,label)=>{if(!ok)throw Error(label);result.textContent+='✓ '+label+'\n';};try{
const w=frame.contentWindow,d=frame.contentDocument,canvas=()=>d.querySelector('#canvas'),zone=()=>canvas().querySelector(':scope > .lms-element > .lms-dropzone'),items=()=>[...zone().children].filter(x=>x.classList.contains('lms-element'));
const p=(type,x,y,target)=>{(target||d.elementFromPoint(x,y)||d).dispatchEvent(new w.PointerEvent(type,{bubbles:true,cancelable:true,clientX:x,clientY:y,pointerId:1,pointerType:'mouse',button:0,buttons:type==='pointerup'?0:1}));};
const tabs=()=>[...d.querySelectorAll('[role=tab]')],active=()=>tabs().findIndex(b=>b.getAttribute('aria-selected')==='true');
const select=async(first,last)=>{const a=first.getBoundingClientRect(),b=last.getBoundingClientRect();p('pointerdown',a.left-18,a.top+2);p('pointermove',a.left+25,b.bottom-2);p('pointerup',a.left+25,b.bottom-2);await wait(40);};
const start=()=>{const handle=d.querySelector('[data-group-move]'),r=handle.getBoundingClientRect();p('pointerdown',r.left+15,r.top+15,handle);};
const newProject=[...d.querySelectorAll('button')].find(b=>b.textContent==='Nuevo proyecto'&&!b.closest('#project-file-menu'));newProject.click();await wait(200);
canvas().innerHTML=getPaginaBasicaHTML();zone().innerHTML=['A','B','C'].map(text=>getParrafoBasicoHTML().replace('Escribe tu párrafo aquí. Haz doble clic para editar o añadir viñetas.',text)).join('');
w.initNestedDropzones();await wait(100);
items()[0].querySelector('p').id='group-original';items()[0].dataset.spaceBottom='17';items()[0].style.setProperty('margin-bottom','17px','important');
await select(items()[0],items()[1]);check(!d.querySelector('#lms-group-selection').hidden&&d.querySelector('[data-group-count]').textContent==='2 elementos','Selección parcial incluye dos elementos completos');
check(w.getSelection().toString()==='','Arrastre vacío no selecciona texto');
d.querySelector('[data-group-copy]').click();await wait(150);
check(items().map(el=>el.querySelector('p').textContent).join('')==='ABABC','Duplicación conserva contenido y orden');
check(items()[2].dataset.spaceBottom==='17','Duplicación conserva separaciones personalizadas');
check(items()[2].querySelector('p').id!=='group-original','Duplicado con identificadores independientes');
check(d.querySelector('[data-group-count]').textContent==='2 elementos','Duplicados quedan seleccionados');
w.undo();await wait(100);check(items().map(el=>el.querySelector('p').textContent).join('')==='ABC','Deshacer revierte el duplicado completo en un paso');
w.redo();await wait(100);check(items().map(el=>el.querySelector('p').textContent).join('')==='ABABC','Rehacer restaura el conjunto duplicado');
await select(items()[2],items()[3]);
start();let r=zone().getBoundingClientRect();p('pointermove',r.left+15,r.bottom-15);p('pointerup',r.left+15,r.bottom-15);await wait(180);
check(items().map(el=>el.querySelector('p').textContent).join('')==='ABCAB','Mueve el conjunto dentro de la página sin alterar su orden');
const blank=zone().getBoundingClientRect();p('pointerdown',blank.left+8,blank.top+8);p('pointerup',blank.left+8,blank.top+8);check(d.querySelector('#lms-group-selection').hidden,'Clic exterior deshace la selección sin eliminar elementos');
check(items().length===5,'Deshacer selección conserva los elementos');
await select(items()[0],items()[1]);start();p('pointermove',5,5);p('pointerup',5,5);await wait(160);check(items().map(el=>el.querySelector('p').textContent).join('')==='ABCAB','Soltar fuera de la página no pierde ni reordena elementos');
// Create a destination, then use the same sustained pointer gesture across tabs.
d.querySelector('[aria-label="Agregar página"]').click();await wait(80);d.querySelector('dialog input').value='Destino grupo';d.querySelector('dialog button[value=ok]').click();await wait(120);
tabs()[0].click();await wait(120);await select(items()[0],items()[1]);start();
let tr=tabs()[1].getBoundingClientRect();p('pointermove',tr.left+20,tr.top+12);await wait(650);check(active()===1,'Arrastre abre la otra pestaña sin soltar');
r=canvas().getBoundingClientRect();p('pointermove',r.left+30,r.top+60);p('pointerup',r.left+30,r.top+60);await wait(220);
check([...canvas().querySelectorAll('p')].map(el=>el.textContent).join('')==='AB','Destino recibe el grupo completo y en orden');
tabs()[0].click();await wait(150);check(items().map(el=>el.querySelector('p').textContent).join('')==='CAB','Origen deja de contener los elementos trasladados');
check(!d.querySelector('[data-workspace-parking]'),'Traslado limpia los espacios temporales');
// Escape after switching restores the source without moving any element.
await select(items()[0],items()[1]);start();tr=tabs()[1].getBoundingClientRect();p('pointermove',tr.left+20,tr.top+12);await wait(650);d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true,cancelable:true}));await wait(180);
check(active()===0&&items().map(el=>el.querySelector('p').textContent).join('')==='CAB','Escape restaura el origen y cancela el traslado entre pestañas');
// Nested text is selected with its box, never independently.
zone().innerHTML=getCajaTextoHTML()+getParrafoBasicoHTML();w.initNestedDropzones();await wait(100);await select(items()[0],items()[0]);check(d.querySelector('[data-group-count]').textContent==='1 elemento','Caja completa: no duplica la selección de sus textos internos');
check(!w.generateExportHTML(false).includes('id="lms-group-selection"'),'Exportación no incluye la interfaz de selección');
const text=items()[1].querySelector('p');text.contentEditable='true';const range=d.createRange();range.selectNodeContents(text);w.getSelection().removeAllRanges();w.getSelection().addRange(range);const textRect=text.getBoundingClientRect();p('pointerdown',textRect.left+4,textRect.top+4,text);check(w.getSelection().toString()===text.textContent,'La edición de texto mantiene su selección normal');text.contentEditable='false';w.getSelection().removeAllRanges();
await select(items()[0],items()[1]);
result.textContent+='Todas las comprobaciones correctas';
}catch(e){result.textContent+='ERROR: '+e.message;}};
</script></body></html>
