<!doctype html><meta charset="utf-8"><title>Verificación Footer y copia</title><button id="run">Probar footer global</button><pre id="result"></pre><iframe id="app" src="/" style="width:100%;height:700px"></iframe>
<script type="module">
import {getDynamicFooterHTML} from '/src/templates.ts';
const app=document.querySelector('#app');
document.querySelector('#run').onclick=async()=>{
 const w=app.contentWindow,d=w.document,out=document.querySelector('#result'),results=[];
 const wait=()=>new Promise(r=>setTimeout(r,350));
 const check=(name,ok)=>results.push((ok?'PASS ':'FAIL ')+name);
 const seed=()=>{d.querySelector('#canvas').innerHTML=getDynamicFooterHTML();w.initNestedDropzones();};
 if(!d.querySelector('.project-tab-add')){d.querySelector('.project-menu-toggle').click();Array.from(d.querySelectorAll('button')).find(b=>b.textContent==='Nuevo proyecto').click();await wait();}
 seed();await wait();
 d.querySelector('[title="Agregar página"]').click();await wait();
 d.querySelector('dialog input').value='Segunda';d.querySelector('dialog button[value="ok"]').click();await wait();seed();await wait();
 w.openGlobalFooterModal();w.tempFooterType='solido';w.tempFooterBlockColor='morado';w.applyFooterConfig();await wait();
 check('Footer activo global',d.querySelector('.lms-footer-wrapper').dataset.footerType==='solido');
 d.querySelectorAll('[role="tab"]')[0].click();await wait();check('Footer de pestaña inactiva',d.querySelector('.lms-footer-wrapper').dataset.footerType==='solido');
 w.openFooterModal(d.querySelector('.lms-footer-wrapper'));w.tempFooterType='lineas';w.applyFooterConfig();await wait();
 d.querySelectorAll('[role="tab"]')[1].click();await wait();check('Edición individual no cambia otras pestañas',d.querySelector('.lms-footer-wrapper').dataset.footerType==='solido');
 check('Predeterminado conservado',w.globalFooterConfig.type==='solido');
 check('Copiar habilitado sin guardar',!d.querySelector('.project-copy').disabled);
 d.querySelector('.project-copy').click();await wait();
 check('Opciones guardar y continuar',!!d.querySelector('dialog button[value="save"]')&&!!d.querySelector('dialog button[value="copy"]'));
 out.textContent=results.join('\n');
 let copied=0,stored='';
 Object.defineProperty(w.navigator,'clipboard',{configurable:true,value:{writeText:async()=>{copied++;}}});
 d.querySelector('dialog button[value="copy"]').click();await wait();check('Continuar sin guardar copia',copied===1);
 w.showSaveFilePicker=async()=>({name:'Prueba.lmsproject',createWritable:async()=>({write:async text=>{stored=text;},close:async()=>{}})});
 d.querySelector('.project-copy').click();await wait();d.querySelector('dialog button[value="save"]').click();await wait();
 const name=d.querySelector('dialog input');if(name){name.value='Prueba';d.querySelector('dialog button[value="ok"]').click();}
 await wait();await wait();check('Guardar y copiar',!!stored&&copied===2);check('Footer global persistido',!!stored&&JSON.parse(stored).footerConfig.type==='solido');
 d.querySelector('.project-copy').click();await wait();check('Proyecto guardado copia sin aviso',copied===3&&!d.querySelector('dialog[open]'));
 out.textContent=results.join('\n');
};
</script>
