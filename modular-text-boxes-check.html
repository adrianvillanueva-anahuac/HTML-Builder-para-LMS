<!doctype html><html lang="es"><meta charset="utf-8"><title>Cajas de texto en tabla modular · verificación aislada</title>
<style>body{margin:0;font:13px Arial;color:#253649}header{display:flex;align-items:center;gap:10px;padding:8px;background:#f7f7fb}button{padding:7px 10px}pre{white-space:pre-wrap;max-height:170px;overflow:auto;margin:0;padding:10px}pre:empty{display:none}iframe{width:100%;height:calc(100vh - 46px);border:0}body.results iframe{height:calc(100vh - 236px)}</style>
<header><strong>Prueba aislada · texto modular</strong><button id="run">Verificar cajas de texto</button><button id="tools">Verificar barra completa</button><button id="proof">Mostrar ejemplo editable</button></header><pre id="result" role="status"></pre><iframe id="app" title="Builder de prueba modular" src="/?check=modular-text"></iframe>
<script type="module">
import{createModular,activateAllCells}from'/src/modular-model.ts';
const frame=document.querySelector('#app'),out=document.querySelector('#result'),wait=(ms=100)=>new Promise(r=>setTimeout(r,ms));let results=[],busy=false;
const env=()=>({w:frame.contentWindow,d:frame.contentDocument}),block=()=>env().d.querySelector('#canvas .modular-table'),cell=()=>block().querySelector('.mod-cell[data-cell="0:0"]'),edit=()=>env().w.currentEditableText,tools=()=>env().d.querySelector('#rtf-toolbar'),controls=()=>cell().querySelector('.mod-text-geometry'),activeFrame=()=>cell().querySelector('.mod-text-box-active');
const check=(label,ok)=>{results.push((ok?'PASS ':'FAIL ')+label);out.textContent=results.join('\n');if(!ok)throw Error(label);};
async function ready(){for(let i=0;i<200;i++){const{w,d}=env();if(w?.initNestedDropzones&&d?.querySelector('#canvas')){const create=d.querySelector('.project-welcome .welcome-actions button');if(create){create.click();await wait();}return env();}await wait(50);}throw Error('Builder no disponible');}
async function setup(){const{w,d}=await ready();edit()?.blur();d.querySelector('#canvas').replaceChildren();const model=createModular(1,2);model.rows=[220];activateAllCells(model);model.cells['0:0'].html='<p>Texto principal</p>';model.cells['0:1'].html='<p>Otro rectángulo</p>';const section=d.createElement('section');section.dataset.type='tabla_modular';section.className='lms-element is-rendered modular-table';section.dataset.modular=JSON.stringify(model);d.querySelector('#canvas').append(section);w.checkEmptyState?.();w.initNestedDropzones();await wait();w.saveHistoryState(true);return env();}
async function start(id='primary'){const{w}=env(),text=id==='primary'?cell().querySelector('.mod-text'):cell().querySelector(`[data-mod-text-id="${id}"] .mod-extra-text`);text.dispatchEvent(new w.MouseEvent('dblclick',{bubbles:true}));await wait();}
const finish=()=>tools().querySelector('[aria-label="Terminar texto"]').click();
function type(text){const{w}=env();edit().textContent=text;edit().dispatchEvent(new w.Event('input',{bubbles:true}));}
function all(){const{w,d}=env(),r=d.createRange();r.selectNodeContents(edit());w.getSelection().removeAllRanges();w.getSelection().addRange(r);w.lastKnownRange=r.cloneRange();edit().focus();}
function drag(handle,dx,dy){const{w}=env(),c=controls(),capture=c.setPointerCapture;c.setPointerCapture=()=>{};const button=c.querySelector(`[data-mod-text-handle="${handle}"]`),fire=(el,type,x,y)=>el.dispatchEvent(new w.PointerEvent(type,{bubbles:true,pointerId:999,button:0,clientX:x,clientY:y}));fire(button,'pointerdown',300,300);fire(c,'pointermove',300+dx,300+dy);fire(c,'pointerup',300+dx,300+dy);c.setPointerCapture=capture;}
const state=()=>JSON.parse(block().dataset.modular),layout=()=>({...state().cells['0:0'].textLayout});
document.querySelector('#run').onclick=async()=>{if(busy)return;busy=true;results=[];out.removeAttribute('data-complete');document.body.classList.add('results');try{
 const{w,d}=await setup();check('Los rectángulos existentes conservan su texto sin posiciones nuevas',cell().querySelector('.mod-text').textContent==='Texto principal'&&!state().cells['0:0'].textLayout);
 await start();check('Doble clic abre edición nativa y nueve controles de geometría',edit()===cell().querySelector('.mod-text')&&controls().querySelectorAll('button').length===9);
 check('Hay una sola barra completa y no una copia reducida',d.querySelectorAll('#rtf-toolbar').length===1&&tools().querySelector('[title="Insertar Imagen Editorial"]')&&tools().querySelector('[aria-label="Agregar caja de texto"]'));
 const before=layout(),font=w.getComputedStyle(edit()).fontSize;drag('se',-60,25);check('El tirador cambia la caja sin modificar la tipografía',layout().width<before.width&&layout().height!==before.height&&w.getComputedStyle(edit()).fontSize===font);
 const resized=layout();drag('move',20,25);check('El asa mueve el texto dentro del rectángulo',layout().x>resized.x&&layout().y>resized.y);
 drag('move',5000,5000);const safe=layout();check('No permite sacar la caja fuera del rectángulo',safe.x>=0&&safe.y>=0&&safe.x+safe.width<=1&&safe.y+safe.height<=1);
 type('Principal editado');tools().querySelector('[aria-label="Agregar caja de texto"]').click();await wait();const extraId=activeFrame().dataset.modTextId;check('Agregar desde la barra crea y edita una caja independiente',extraId!=='primary'&&edit().textContent==='');
 type('Segunda caja');all();tools().querySelector('[title="Negrita"]').click();await wait();check('El formato usa la barra nativa del Builder',/bold|700|<b>/.test(edit().innerHTML));drag('se',-20,20);finish();
 check('Las cajas conservan contenido y geometría por separado',state().cells['0:0'].html.includes('Principal editado')&&state().cells['0:0'].textBoxes[0].document.children.some(n=>JSON.stringify(n).includes('Segunda caja'))&&state().cells['0:0'].textLayout);
 check('No modifica el texto del rectángulo contiguo',state().cells['0:1'].html==='<p>Otro rectángulo</p>');
 await start(extraId);check('Doble clic reabre la caja elegida con su formato',edit().textContent==='Segunda caja'&&/bold|700|<b>/.test(edit().innerHTML));
 controls().querySelector('[data-mod-text-handle=move]').dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowLeft',bubbles:true}));finish();check('Los controles también aceptan movimiento por teclado',state().cells['0:0'].textBoxes[0].layout.x>=0);
 cell().querySelector('[data-mod-text-action=add]').click();await wait();const third=activeFrame().dataset.modTextId;type('Tercera caja');finish();check('El menú del rectángulo permite añadir otra caja',state().cells['0:0'].textBoxes.length===2);
 cell().querySelector(`[data-mod-text-action=remove][data-mod-text-id="${third}"]`).click();check('Quitar una caja conserva todas las demás',state().cells['0:0'].textBoxes.length===1&&state().cells['0:0'].textBoxes[0].id===extraId);
 w.undo();await wait();check('Deshacer recupera la caja eliminada y su texto',state().cells['0:0'].textBoxes.length===2&&JSON.stringify(state().cells['0:0'].textBoxes).includes('Tercera caja'));w.redo();await wait();check('Rehacer vuelve a eliminar solo esa caja',state().cells['0:0'].textBoxes.length===1);
 await start(extraId);type('Texto completo '.repeat(150));finish();await wait();const extra=cell().querySelector(`[data-mod-text-id="${extraId}"]`);check('Sin desbordamiento individual la caja se expande y muestra todo el texto',extra.offsetHeight>=extra.querySelector('.mod-extra-text').scrollHeight&&w.getComputedStyle(extra.querySelector('.mod-extra-text')).visibility==='visible'&&!state().cells['0:0'].textOverflow.enabled);check('Existe una sola entrada + info para todas las cajas del rectángulo',cell().querySelectorAll('.mod-overflow-info').length===1);cell().querySelector(`[data-mod-text-action=edit][data-mod-text-id="${extraId}"]`).click();await wait();check('Editar desde el menú abre la caja correcta',activeFrame().dataset.modTextId===extraId);type('Segunda caja');finish();
 await start();type('Principal largo '.repeat(150));finish();await wait();check('El texto principal largo expande también el rectángulo hacia abajo',cell().querySelector('.mod-card').offsetHeight>=cell().querySelector('.mod-text').scrollHeight&&w.getComputedStyle(cell().querySelector('.mod-text')).visibility==='visible');cell().querySelector('[data-mod-text-action=edit][data-mod-text-id=primary]').click();await wait();check('Reabrir el texto principal conserva todos los controles de geometría',edit()===cell().querySelector('.mod-text')&&controls()?.querySelectorAll('button').length===9);type('Principal editado');finish();
 const positions=JSON.stringify({primary:state().cells['0:0'].textLayout,extra:state().cells['0:0'].textBoxes[0].layout}),extraText=cell().querySelector('.mod-extra-text'),fontBefore=w.getComputedStyle(extraText).fontSize,oldHeight=extraText.parentElement.getBoundingClientRect().height;
 cell().querySelector('.mod-resize-row').dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowDown',bubbles:true}));await wait();check('Al ajustar el alto del rectángulo conserva proporciones y tipografía',extraText.parentElement.getBoundingClientRect().height>oldHeight&&w.getComputedStyle(extraText).fontSize===fontBefore&&JSON.stringify({primary:state().cells['0:0'].textLayout,extra:state().cells['0:0'].textBoxes[0].layout})===positions);
 const oldWidth=extraText.parentElement.getBoundingClientRect().width;cell().querySelector('.mod-resize-col').dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));await wait();check('Al ajustar la columna las cajas se adaptan sin escalar la letra',extraText.parentElement.getBoundingClientRect().width>oldWidth&&w.getComputedStyle(extraText).fontSize===fontBefore);
 const exported=new DOMParser().parseFromString(w.generateExportHTML(false),'text/html');check('Publicar conserva las cajas y sus porcentajes, sin controles',exported.querySelector('.mod-published .mod-extra-text')?.textContent==='Segunda caja'&&exported.querySelector('.mod-primary-text-frame')?.style.position==='absolute'&&!exported.querySelector('.mod-text-geometry,.mod-text-session-actions'));
 const compact=block().cloneNode(true),root=d.createElement('div');root.append(compact);w.saveHistoryState(true);const roundtrip=state();block().remove();compact.innerHTML='';compact.dataset.modular=JSON.stringify(roundtrip);d.querySelector('#canvas').append(compact);w.initNestedDropzones();await wait();check('Restaurar el proyecto reconstruye cajas, estilos y posiciones',cell().querySelector('.mod-extra-text').textContent==='Segunda caja'&&cell().querySelector('.mod-primary-text-frame'));
 out.textContent=results.join('\n')+`\nTOTAL: ${results.length} / FAIL: 0`;
 }catch(e){out.textContent+='\nERROR '+e.stack;}finally{busy=false;out.dataset.complete='true';}};
document.querySelector('#tools').onclick=async()=>{if(busy)return;busy=true;results=[];out.removeAttribute('data-complete');document.body.classList.add('results');try{
 const{w,d}=await setup();await start();tools().querySelector('[aria-label="Agregar caja de texto"]').click();await wait();type('Primero\nSegundo');all();Array.from(tools().querySelectorAll('button')).find(b=>b.textContent.trim()==='a.').click();await wait();check('Siete tipos de lista y los menús originales siguen íntegros',Array.from(tools().querySelectorAll('button')).filter(b=>['1.','a.','•','○','▶','+','-'].includes(b.textContent.trim())).length===7&&edit().querySelector('.list-letters'));
 tools().querySelector('[title="Viñetas Moradas"]').click();await wait();check('Color de viñetas se aplica a la caja adicional',edit().querySelector('.list-color-purple'));
 all();tools().querySelector('[aria-label="Agregar hipervínculo"]').click();await wait();check('Hipervínculo abre el diálogo completo del Builder',d.querySelector('.text-link-dialog'));d.querySelector('.text-link-dialog input').value='https://example.com/modular';d.querySelector('.text-link-dialog [value=ok]').click();await wait();check('El enlace conserva su destino en la caja',edit().querySelector('a[href="https://example.com/modular"]'));
 const caretEnd=()=>{const r=d.createRange();r.selectNodeContents(edit());r.collapse(false);w.getSelection().removeAllRanges();w.getSelection().addRange(r);w.lastKnownRange=r.cloneRange();edit().focus();};
 caretEnd();tools().querySelector('[title="Insertar Ícono Embebido"]').click();await wait();check('Insertar icono usa la función original y conserva su edición',edit().querySelector('.editable-icon'));edit().querySelector('.editable-icon').dispatchEvent(new w.MouseEvent('dblclick',{bubbles:true}));await wait();check('El catálogo íntegro de iconos sigue disponible',!d.querySelector('#icon-modal').classList.contains('hidden')&&d.querySelectorAll('#icon-grid span').length>50);Array.from(d.querySelectorAll('#icon-grid span')).find(n=>n.textContent==='school').click();await wait();check('El catálogo cambia el icono de la misma caja',edit()?.querySelector('.editable-icon').textContent==='school');
 caretEnd();const original=w.prompt;w.prompt=()=>location.origin+'/imagenes/titulos/Fondo_naranja_escolar.png';tools().querySelector('[title="Insertar Imagen Editorial"]').click();w.prompt=original;await wait();const img=edit().querySelector('.editorial-image');check('Insertar imagen usa el control editorial original',img);img.click();await wait();check('La imagen mantiene todos sus menús editoriales',!d.querySelector('#image-toolbar').classList.contains('hidden')&&d.querySelector('#image-toolbar [title="Rotar Imagen"]'));w.setImageSize('w-1/4');w.rotateEditorialImage(90);await wait();check('Escala y rotación funcionan dentro de la caja',img.classList.contains('w-1/4')&&img.style.transform.includes('90deg'));
 const id=activeFrame().dataset.modTextId;finish();await start(id);check('Salir y volver conserva listas, colores, enlaces, iconos e imagen',edit().querySelector('.list-letters')&&edit().querySelector('a')&&edit().querySelector('.editable-icon')&&edit().querySelector('img'));finish();out.textContent=results.join('\n')+`\nTOTAL: ${results.length} / FAIL: 0`;
 }catch(e){out.textContent+='\nERROR '+e.stack;}finally{busy=false;out.dataset.complete='true';}};
document.querySelector('#proof').onclick=async()=>{await setup();document.body.classList.remove('results');out.textContent='';await start();tools().querySelector('[aria-label="Agregar caja de texto"]').click();await wait();type('Otra caja de texto');};
</script></html>
