<!doctype html><meta charset="utf-8"><button id="run">Probar duplicación</button><pre id="results"></pre><iframe id="app" src="/?editor=exercise" style="width:100%;height:850px"></iframe><script type="module">
import {createFlowModel,addFlowNode,addFlowEdge} from '/src/flow-model.ts';
run.onclick=async()=>{const w=app.contentWindow,d=w.document,wait=()=>new Promise(r=>setTimeout(r,200)),out=document.querySelector('#results');let n=0;const check=(ok,label)=>{out.textContent+=(ok?'PASS ':'FAIL ')+label+'\n';if(!ok)throw Error(label);n++;};try{
 d.querySelector('#canvas').replaceChildren();w.insertTemplate('diagrama_flujo');const block=d.querySelector('[data-type=diagrama_flujo]'),m=createFlowModel(),a=addFlowNode(m,'process',180,180),b=addFlowNode(m,'decision',580,180);a.text='Proceso con contenido';addFlowEdge(m,a.id,b.id,{label:'Siguiente'});block.dataset.flowModel=JSON.stringify(m);w.initNestedDropzones();w.editFlowDiagram(block);await wait();
 const dialog=d.querySelector('.flow-design-editor');dialog.querySelector(`[data-select-id="${a.id}"]`).click();await wait();check(dialog.querySelectorAll('[data-flow-duplicate]').length===2,'Dos botones para figura conectada');dialog.querySelector('[data-with-connections="true"]').dispatchEvent(new w.MouseEvent('click',{bubbles:true}));await wait();check(dialog.querySelectorAll('g[data-flow-node]').length===3,'Copia conectada creada');dialog.querySelector('[data-with-connections="false"]').dispatchEvent(new w.MouseEvent('click',{bubbles:true}));await wait();check(dialog.querySelectorAll('[data-flow-duplicate]').length===1,'Copia sin conexiones ofrece un botón');dialog.querySelector('[data-action=save]').click();const saved=JSON.parse(block.dataset.flowModel);check(saved.nodes.length===4&&saved.edges.length===2,'Guardado conserva copias y conexiones');check(saved.nodes.filter(x=>x.text===a.text).length===3,'Contenido conservado');out.textContent+='TOTAL '+n;
 w.editFlowDiagram(block);await wait();d.querySelector(`[data-select-id="${a.id}"]`).click();
 }catch(e){out.textContent+='ERROR '+e.message;}};
</script>
