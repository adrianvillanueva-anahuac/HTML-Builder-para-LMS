async function ready(){
  let projectRequested=false;
  for(let attempt=0;attempt<200;attempt++){
    const {w,d}=env();
    if(typeof w?.insertTemplate==='function'&&typeof w?.initNestedDropzones==='function'&&typeof w?.editFlowDiagram==='function'&&d.querySelector('#canvas')){
      // Exercise real project state as well as the imperative canvas helpers:
      // otherwise the welcome dialog would still intercept pointer actions.
      if(!d.querySelector('.project-tab[data-active="true"]')){
        const create=d.querySelector('.project-welcome .welcome-actions > button');
        if(create&&!projectRequested){projectRequested=true;create.click();}
      }else{
        if(!blank)blank=d.querySelector('#canvas-container-outer').innerHTML;
        return env();
      }
    }

  throw new Error('El Builder de prueba no terminó de iniciar. Revisa el servidor y recarga esta prueba.');
}

function referencesStayLocal(root){
  const ids=Array.from(root.querySelectorAll('[id]')).map(el=>el.id);
  if(ids.length!==new Set(ids).size)return false;
  for(const svg of root.querySelectorAll('svg[data-flow-canvas]')){
    const available=new Set(Array.from(svg.querySelectorAll('[id]')).map(el=>el.id));
    for(const el of [svg,...svg.querySelectorAll('*')])for(const attr of el.attributes){
      for(const match of attr.value.matchAll(/url\(["']?#([^)'"\s]+)["']?\)/g))if(!available.has(match[1]))return false;
      if(['href','xlink:href'].includes(attr.name)&&attr.value.startsWith('#')&&!available.has(attr.value.slice(1)))return false;
      if(attr.name==='aria-labelledby'&&attr.value.split(/\s+/).some(id=>!available.has(id)))return false;
    }
  }
  return true;
}
